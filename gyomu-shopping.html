<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お買い物リスト">
<meta name="theme-color" content="#FFE3EE">
<title>🛒 業務スーパーお買い物リスト</title>
<link rel="apple-touch-icon" href="gyomu-shopping-icon.png">
<link rel="icon" type="image/png" href="gyomu-shopping-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FFD9E8;
  --pink-deep:#F79EC1;
  --pink-strong:#D93B7E;
  --pink-soft:#FFF0F6;
  --lavender:#E8DFF8;
  --lavender-deep:#B79CE0;
  --white:#FFFFFF;
  --bg:#FFF9FC;
  --text:#222222;       /* 本文：#333より濃く */
  --text-soft:#333333;  /* 補足の文字も#333 */
  --title:#3A2340;      /* 見出し：濃いぶどう色 */
  --shadow:0 4px 16px rgba(214,160,192,.22);
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:500;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:110px;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;color:inherit;cursor:pointer}
/* ---------- ヘッダー ---------- */
header{
  background:linear-gradient(160deg,#FFE3EE 0%,#F3EBFC 100%);
  padding:calc(env(safe-area-inset-top) + 14px) 20px 16px;
  text-align:center;
  border-radius:0 0 34px 34px;
  position:relative;
  overflow:hidden;
}
header .deco{position:absolute;font-size:20px;opacity:.55;animation:floaty 5s ease-in-out infinite}
header .deco:nth-child(1){top:14px;left:12%;animation-delay:0s}
header .deco:nth-child(2){top:34px;right:10%;animation-delay:1.2s}
header .deco:nth-child(3){top:62px;left:20%;animation-delay:2.4s}
header .deco:nth-child(4){top:66px;right:22%;animation-delay:3.4s}
header h1,header p.sub{position:relative;z-index:1}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.basket-wrap{margin:0 auto 4px;width:70px;height:62px}
h1{
  font-family:'Kiwi Maru',serif;
  font-size:1.2rem;
  font-weight:500;
  letter-spacing:.04em;
  color:var(--title);
}
header p.sub{font-size:.9rem;color:var(--text-soft);margin-top:4px}
/* ---------- 上に固定される部分（タブ＋入力欄） ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:12px 16px 10px;
  box-shadow:0 6px 10px -8px rgba(214,160,192,.5);
}
.topbar-inner{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:10px}
.tab{
  flex:1;border:none;
  min-height:56px;padding:8px 4px;white-space:nowrap;
  border-radius:999px;
  font-size:1rem;font-weight:700;
  color:var(--text);
  background:var(--white);
  box-shadow:var(--shadow);
  border:2px solid #F3DCE8;
  transition:transform .18s,background .25s,color .25s;
}
.tab:active{transform:scale(.95)}
.tab.on{color:#fff;border-color:transparent}
.tab.on.t-pink{background:linear-gradient(135deg,#EC5F9A,#D93B7E)}
.tab.on.t-lav{background:linear-gradient(135deg,#9B7BD4,#7E5CC2)}

/* 入力欄 */
.entry{margin-top:12px}
.entry-box{
  display:flex;align-items:center;gap:8px;
  background:var(--white);
  border:3px solid var(--pink-deep);
  border-radius:20px;
  padding:5px 5px 5px 14px;
  box-shadow:var(--shadow);
}
.entry-box:focus-within{border-color:var(--pink-strong)}
.entry-box input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  font-family:inherit;font-weight:500;
  font-size:1.15rem;color:var(--text);padding:12px 0;
}
.entry-box input::placeholder{color:#6B6B6B}
.entry-add{
  flex:none;border:none;border-radius:15px;
  min-width:84px;min-height:54px;padding:0 14px;
  background:linear-gradient(135deg,#EC5F9A,#D93B7E);
  color:#fff;font-size:1.05rem;font-weight:700;
}
.entry-add:active{transform:scale(.95)}
.entry-help{font-size:.9rem;color:var(--text-soft);margin:7px 4px 0;line-height:1.5}

/* 候補 */
.suggest{margin-top:10px}
.suggest-label{font-size:.9rem;font-weight:700;color:var(--title);margin:0 4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:2px solid var(--pink-deep);
  background:var(--pink-soft);
  border-radius:999px;
  min-height:48px;padding:6px 16px;
  font-size:1rem;font-weight:700;color:var(--text);
  transition:transform .15s;
}
.chip:active{transform:scale(.93);background:var(--pink)}
.chip .plus{color:var(--pink-strong);margin-right:4px}

/* ---------- セクション共通 ---------- */
main{padding:6px 16px 30px;max-width:560px;margin:0 auto}
section{display:none}
section.show{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{
  font-family:'Kiwi Maru',serif;
  font-size:1.05rem;font-weight:500;
  margin:16px 4px 10px;color:var(--title);
}
/* ---------- ボタン ---------- */
.btn{
  border:none;border-radius:999px;
  font-weight:700;font-size:1.05rem;
  min-height:56px;padding:12px 22px;color:#fff;
  box-shadow:var(--shadow);
  transition:transform .18s;
}
.btn:active{transform:scale(.95)}
.btn-pink{background:linear-gradient(135deg,#EC5F9A,#D93B7E)}
.btn-lav{background:linear-gradient(135deg,#9B7BD4,#7E5CC2)}
.btn-ghost{background:var(--white);color:var(--text);border:2px solid #E8D3E0;box-shadow:none}
.btn-wide{width:100%;display:block}
.add-btn{width:100%;margin-bottom:16px}

/* ---------- 買い物リスト ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;align-items:stretch;
  min-height:68px;
  transition:opacity .25s;
}
.item.new{animation:pop-in .35s ease}
@keyframes pop-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.item .main-tap{
  flex:1;min-width:0;border:none;background:transparent;
  display:flex;align-items:center;gap:14px;
  padding:10px 6px 10px 14px;text-align:left;
}
.chk{
  width:40px;height:40px;flex:none;
  border-radius:12px;
  border:3px solid var(--pink-strong);
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:700;color:#fff;
}
.item.done .chk{background:linear-gradient(135deg,#EC5F9A,#D93B7E);border-color:transparent;animation:bounce .35s ease}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.25)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.item .name{
  flex:1;font-size:1.15rem;font-weight:700;color:var(--text);
  line-height:1.45;word-break:break-all;
}
.item.done{background:#F7F3F5;box-shadow:none}
.item.done .name{text-decoration:line-through;text-decoration-thickness:2px;color:#8A8A8A;font-weight:500}
.item .del{
  flex:none;width:60px;border:none;background:transparent;
  font-size:1.35rem;border-left:2px dashed #F3E2EB;border-radius:0 var(--radius) var(--radius) 0;
}
.item .del:active{background:var(--pink-soft)}
.done-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:24px 4px 10px;
}
.done-head .sec-title{margin:0;white-space:nowrap}
.clear-done{
  border:2px solid #E8D3E0;background:var(--white);border-radius:999px;
  min-height:48px;padding:6px 14px;font-size:.95rem;font-weight:700;color:var(--text);white-space:nowrap;
}
.clear-done:active{background:var(--pink-soft)}

/* ---------- おすすめ商品 ---------- */
.searchbar{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border-radius:999px;
  box-shadow:var(--shadow);
  border:2px solid #EBDDF6;
  padding:4px 6px 4px 18px;margin:6px 0 12px;
}
.searchbar input{
  flex:1;border:none;outline:none;
  font-family:inherit;font-weight:500;
  font-size:1.05rem;padding:12px 0;color:var(--text);
  background:transparent;min-width:0;
}
.searchbar input::placeholder{color:#6B6B6B}
.fav-filter{
  border:none;border-radius:999px;flex:none;
  min-width:52px;min-height:48px;padding:6px 12px;font-size:1.15rem;
  background:var(--pink-soft);
  transition:background .25s,transform .18s;
}
.fav-filter:active{transform:scale(.9)}
.fav-filter.on{background:linear-gradient(135deg,#F9A9C9,#F480B1)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  position:relative;display:flex;flex-direction:column;
}
.card .ph{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
  background:linear-gradient(135deg,#FFE9F2,#EFE7FB);
}
.card .noimg{
  width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;background:linear-gradient(135deg,#FFE9F2,#EFE7FB);
}
.card .body{padding:10px 10px 12px;flex:1;display:flex;flex-direction:column}
.card .cname{font-weight:700;font-size:1.02rem;line-height:1.4;word-break:break-all;color:var(--text)}
.card .cmemo{
  font-size:.9rem;color:var(--text-soft);margin-top:4px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .to-list{
  margin-top:auto;padding-top:10px;
}
.card .to-list button{
  width:100%;min-height:52px;border:none;border-radius:16px;
  font-size:.95rem;font-weight:700;line-height:1.3;padding:6px 8px;
  background:linear-gradient(135deg,#EC5F9A,#D93B7E);color:#fff;
}
.card .to-list button:active{transform:scale(.95)}
.card .to-list button.in{
  background:#F2ECF6;color:var(--title);border:2px solid #D9CCE8;
}
.heart{
  position:absolute;top:8px;right:8px;
  width:48px;height:48px;border:none;border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:1.2rem;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  transition:transform .18s;
  display:flex;align-items:center;justify-content:center;
}
.heart:active{transform:scale(1.2)}
.card-edit{
  position:absolute;top:8px;left:8px;
  width:48px;height:48px;border:none;border-radius:50%;
  background:rgba(255,255,255,.92);font-size:1.05rem;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
/* ---------- 空っぽ表示 ---------- */
.empty{
  text-align:center;padding:36px 16px;color:var(--text-soft);
  font-size:1rem;line-height:1.9;
}
.empty .big{font-size:2.4rem;display:block;margin-bottom:6px}
/* ---------- モーダル ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(90,75,99,.45);
  display:none;align-items:flex-end;justify-content:center;
  z-index:100;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.overlay.show{display:flex;animation:fadein .2s}
.sheet{
  background:var(--white);width:100%;max-width:560px;
  border-radius:28px 28px 0 0;
  padding:24px 22px calc(env(safe-area-inset-bottom) + 26px);
  animation:slideup .28s ease;
  max-height:88vh;overflow-y:auto;
}
@keyframes slideup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{
  font-family:'Kiwi Maru',serif;font-weight:500;
  font-size:1.1rem;text-align:center;margin-bottom:18px;color:var(--title);
}
.field{margin-bottom:16px}
.field label{display:block;font-size:.95rem;font-weight:700;color:var(--text-soft);margin-bottom:7px}
.field input[type=text],.field textarea{
  width:100%;border:2px solid #EBCFDE;border-radius:16px;
  padding:13px 15px;font-family:inherit;font-weight:500;
  font-size:1.05rem;color:var(--text);outline:none;background:#FFFDFE;
}
.field input::placeholder,.field textarea::placeholder{color:#6B6B6B}
.field input:focus,.field textarea:focus{border-color:var(--pink-strong)}
.field textarea{resize:none;height:84px;line-height:1.5}
.photo-pick{
  width:100%;aspect-ratio:16/10;border-radius:18px;border:2.5px dashed #E9C8DA;
  background:var(--pink-soft);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  font-size:1rem;color:var(--text-soft);overflow:hidden;position:relative;
}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick .pp-icon{font-size:2rem}
.sheet-btns{display:flex;gap:10px;margin-top:20px}
.sheet-btns .btn{flex:1;text-align:center}
/* アクションシート */
.acts{display:flex;flex-direction:column;gap:10px}
.acts .btn{width:100%}
.act-title{
  text-align:center;font-weight:700;font-size:1.05rem;
  padding:4px 8px 16px;word-break:break-all;color:var(--title);
}
/* 確認 */
.confirm-msg{text-align:center;font-size:1.02rem;line-height:1.7;padding:4px 6px 18px}
/* ---------- ライトボックス ---------- */
#lightbox{
  position:fixed;inset:0;background:rgba(35,25,42,.92);
  display:none;align-items:center;justify-content:center;
  z-index:200;flex-direction:column;padding:20px;
}
#lightbox.show{display:flex;animation:fadein .2s}
#lightbox img{max-width:100%;max-height:70vh;border-radius:18px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#lightbox .lb-name{color:#fff;font-weight:700;margin-top:14px;font-size:1.1rem;text-align:center}
#lightbox .lb-memo{color:#fff;margin-top:6px;font-size:1rem;text-align:center;line-height:1.6;max-width:90%}
#lightbox .lb-close{
  margin-top:20px;border:2px solid rgba(255,255,255,.6);border-radius:999px;
  min-height:56px;padding:12px 40px;background:rgba(255,255,255,.16);
  color:#fff;font-weight:700;font-size:1.05rem;
}
/* ---------- キラッ✨ ---------- */
.spark{
  position:fixed;pointer-events:none;z-index:300;font-size:20px;
  animation:sparkfly .8s ease-out forwards;
}
@keyframes sparkfly{
  0%{opacity:1;transform:translate(0,0) scale(.6)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}
}
/* ---------- お知らせ（元に戻す つき） ---------- */
#snack{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%) translateY(30px);
  width:calc(100% - 28px);max-width:540px;
  background:#3A2340;color:#fff;
  border-radius:20px;
  padding:10px 10px 10px 18px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 8px 26px rgba(58,35,64,.35);
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  z-index:400;
}
#snack.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#snack .msg{flex:1;font-size:1rem;font-weight:700;line-height:1.45;word-break:break-all}
#snack .undo{
  flex:none;border:none;border-radius:14px;
  min-height:52px;padding:6px 16px;
  background:#FFD9E8;color:#3A2340;font-size:1rem;font-weight:700;
}
#snack .undo:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <span class="deco">🌸</span><span class="deco">✨</span><span class="deco">💕</span><span class="deco">🍎</span>
  <div class="basket-wrap">
    <svg viewBox="0 0 100 90" width="70" height="62" aria-hidden="true">
      <path d="M28 38 L20 20" stroke="#B79CE0" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M72 38 L80 20" stroke="#B79CE0" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="20" cy="18" r="5" fill="#F480B1"/>
      <circle cx="80" cy="18" r="5" fill="#F480B1"/>
      <path d="M14 40 Q50 30 86 40 L80 76 Q50 84 20 76 Z" fill="#FFD9E8" stroke="#F79EC1" stroke-width="3"/>
      <path d="M22 48 Q50 42 78 48" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M24 58 Q50 52 76 58" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="34" r="7" fill="#FF8FAF"/>
      <circle cx="50" cy="30" r="8" fill="#C3A9EA"/>
      <circle cx="64" cy="34" r="7" fill="#FFC46B"/>
      <text x="50" y="72" font-size="13" text-anchor="middle">🌸</text>
    </svg>
  </div>
  <h1>🛒 業務スーパーお買い物リスト</h1>
  <p class="sub">毎週のお買い物を たのしく かわいく 💕</p>
</header>

<div class="topbar">
  <div class="topbar-inner">
    <nav class="tabs">
      <button class="tab t-pink on" id="tabList" onclick="switchTab('list')">🛒 次回買うもの</button>
      <button class="tab t-lav" id="tabReco" onclick="switchTab('reco')">🌸 おすすめ商品</button>
    </nav>

    <!-- 入力欄（いつも出ている） -->
    <div class="entry" id="entryArea">
      <div class="entry-box">
        <input type="text" id="entryInput" placeholder="買うものを書く"
               maxlength="40" enterkeyhint="enter" autocomplete="off" autocorrect="off"
               aria-label="買うものを入力">
        <button type="button" class="entry-add keep-focus" id="entryAdd">＋ 入れる</button>
      </div>
      <p class="entry-help" id="entryHelp">書いたら キーボードの「改行」を押すと すぐ入ります</p>
      <div class="suggest" id="suggestArea" hidden>
        <div class="suggest-label" id="suggestLabel"></div>
        <div class="chips" id="suggestChips"></div>
      </div>
    </div>
  </div>
</div>

<main>
  <!-- ① 次回買うものリスト -->
  <section id="secList" class="show">
    <h2 class="sec-title" id="todoTitle"></h2>
    <div class="list" id="todoWrap"></div>
    <div class="empty" id="listEmpty" style="display:none">
      <span class="big">🛒</span>
      まだ何もないよ🌸<br>上の入力欄に 買うものを書いてね💕
    </div>

    <div id="doneArea" hidden>
      <div class="done-head">
        <h2 class="sec-title" id="doneTitle"></h2>
        <button class="clear-done" onclick="clearDone()">まとめて消す</button>
      </div>
      <div class="list" id="doneWrap"></div>
    </div>
  </section>

  <!-- ② おすすめ商品 -->
  <section id="secReco">
    <div class="searchbar">
      🔍 <input type="text" id="searchInput" placeholder="商品名でさがす" oninput="renderRecos()">
      <button class="fav-filter" id="favFilter" onclick="toggleFavFilter()" aria-label="お気に入りだけ表示">🤍</button>
    </div>
    <button class="btn btn-lav add-btn" onclick="openRecoSheet()">📷 おすすめ商品を登録する</button>
    <div class="cards" id="cardsWrap"></div>
    <div class="empty" id="recoEmpty" style="display:none">
      <span class="big">🌸</span>
      お気に入り商品を写真つきで<br>登録してみてね✨
    </div>
  </section>
</main>

<!-- おすすめ商品 追加/編集シート -->
<div class="overlay" id="ovReco" onclick="closeIfBg(event,'ovReco')">
  <div class="sheet">
    <h3 id="recoSheetTitle">🌸 おすすめ商品を登録</h3>
    <div class="field">
      <label>📷 写真</label>
      <button type="button" class="photo-pick" id="photoPick" onclick="document.getElementById('photoInput').click()">
        <span class="pp-icon">📷</span>
        <span id="photoPickLabel">タップして写真を選ぶ</span>
      </button>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onPhotoPicked(event)">
    </div>
    <div class="field">
      <label>商品名</label>
      <input type="text" id="recoNameInput" placeholder="例：冷凍ブロッコリー" maxlength="40">
    </div>
    <div class="field">
      <label>ひとことメモ</label>
      <textarea id="recoMemoInput" placeholder="例：業務スーパーで必ず買う／コスパ最高" maxlength="120"></textarea>
    </div>
    <div class="sheet-btns">
      <button class="btn btn-ghost" onclick="closeOv('ovReco')">やめる</button>

<div class="overlay" id="ovRecoAct" onclick="closeIfBg(event,'ovRecoAct')">

      <button class="btn btn-lav" onclick="editRecoFromAct()">✏️ 書きなおす</button>

      <button class="btn btn-ghost" onclick="closeOv('ovConfirm')">やめておく</button>

  <img id="lbImg" alt="">

</div>

<!-- お知らせ（元に戻す つき） -->
<div id="snack" role="status" aria-live="polite">
  <span class="msg" id="snackMsg"></span>
  <button class="undo" id="snackUndo">↩ 元に戻す</button>
</div>

<script>
/* =========================================================
   💾 データ保存
   ・買い物リスト → localStorage（以前と同じ場所・同じ形）
   ・入れたことのある商品（候補用） → localStorage
   ・おすすめ商品(画像入り) → IndexedDB(容量が大きいので)
========================================================= */
const LS_KEY = 'gs_shopping_list_v1';
const HIST_KEY = 'gs_item_history_v1';
let items = [];   // {id, name, checked}
let hist = {};    // {正規化した名前: {name, count, last, yomi}}
let recos = [];   // {id, name, memo, fav, img, thumb, created}
let db = null;

function loadItems(){
  try{ items = JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch(e){ items = []; }
}
function saveItems(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(items)); }catch(e){}
}
function loadHist(){
  try{ hist = JSON.parse(localStorage.getItem(HIST_KEY)) || {}; }
  catch(e){ hist = {}; }
  // 今リストにあるのに まだ覚えていない商品は、覚えておく（以前のデータもここで候補になる）
  let added = false;
  items.forEach(it=>{
    if(!hist[norm(it.name)]){ remember(it.name, false); added = true; }
  });
  if(added) saveHist();
}
function saveHist(){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(hist)); }catch(e){}
}
function remember(name, save=true, yomi=''){
  const k = norm(name);
  if(!k) return;
  const h = hist[k] || {name, count:0, last:0};
  h.name = name; h.count++; h.last = Date.now();
  const y = norm(yomi);
  if(y && y!==k) h.yomi = y;   // ひらがなの読み（「れい」で「冷凍うどん」を出すため）
  hist[k] = h;
  if(save) saveHist();
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('gyomu-super-app', 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('recos')){
        d.createObjectStore('recos', {keyPath:'id'});
      }
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = ()=>reject(req.error);
  });
}
function dbGetAll(){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('recos','readonly');
    const rq = tx.objectStore('recos').getAll();
    rq.onsuccess = ()=>resolve(rq.result||[]);
    rq.onerror = ()=>reject(rq.error);
  });
}
function dbPut(rec){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('recos','readwrite');
    tx.objectStore('recos').put(rec);
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
  });
}
function dbDelete(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('recos','readwrite');
    tx.objectStore('recos').delete(id);
    tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
  });
}

/* ========================================================= タブ */
function switchTab(t){
  document.getElementById('secList').classList.toggle('show', t==='list');
  document.getElementById('secReco').classList.toggle('show', t==='reco');
  document.getElementById('tabList').classList.toggle('on', t==='list');
  document.getElementById('tabReco').classList.toggle('on', t==='reco');
  document.getElementById('entryArea').hidden = (t!=='list');
  if(t==='reco') renderRecos();
}

/* ========================================================= 共通UI */
function openOv(id){ document.getElementById(id).classList.add('show'); }
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
function closeIfBg(e,id){ if(e.target.id===id) closeOv(id); }

/* お知らせ。undo を渡すと「元に戻す」ボタンが出る */
let snackUndoFn = null;
function snack(msg, undo){
  const s = document.getElementById('snack');
  document.getElementById('snackMsg').textContent = msg;
  const btn = document.getElementById('snackUndo');
  snackUndoFn = undo || null;
  btn.hidden = !undo;
  s.classList.add('show');
  clearTimeout(s._tm);
  s._tm = setTimeout(hideSnack, undo ? 7000 : 2200);
}
function hideSnack(){
  document.getElementById('snack').classList.remove('show');
  snackUndoFn = null;
}
document.getElementById('snackUndo').onclick = ()=>{
  const fn = snackUndoFn;
  hideSnack();
  if(fn) fn();
};
const toast = msg=>snack(msg);

/* キラッ✨演出 */
function sparkle(el){
  let x = innerWidth/2, y = innerHeight/2;
  const r = el && (el.getBoundingClientRect ? el.getBoundingClientRect() : el);
  if(r && r.width){ x = r.left + r.width/2; y = r.top + r.height/2; }
  const chars = ['✨','🌸','💕','⭐'];
  for(let i=0;i<6;i++){
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = chars[i % chars.length];
    s.style.left = x+'px'; s.style.top = y+'px';
    const ang = Math.random()*Math.PI*2, dist = 40+Math.random()*40;
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist-30+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 850);
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* くらべる用：全角半角・カタカナひらがな・大文字小文字・空白の違いをなくす */
function norm(s){
  return (s||'').normalize('NFKC').toLowerCase()
    .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/\s+/g,'');
}

/* =========================================================
   ① 次回買うものリスト
========================================================= */
let newItemId = null;   // 入れたばかりの商品（ふわっと表示する）

/* 商品をリストに入れる。入れられたら true */
function addItem(name, fromEl, yomi){
  name = (name||'').trim();
  const k = norm(name);
  const rect = fromEl ? fromEl.getBoundingClientRect() : null;  // 描きなおす前に位置をおぼえる
  if(!k) return false;
  const same = items.find(i=>norm(i.name)===k);
  if(same && !same.checked){
    toast('「'+same.name+'」は もう入っています 🛒');
    return false;
  }
  let undo;
  if(same){
    // 買ったもの欄にあるときは、買うもの欄へ戻す
    const idx = items.indexOf(same);
    items.splice(idx,1);
    same.checked = false;
    items.push(same);
    newItemId = same.id;
    undo = ()=>{
      items = items.filter(i=>i!==same);
      same.checked = true;
      items.splice(Math.min(idx, items.length), 0, same);
      saveItems(); renderAll();
    };
  }else{
    const it = {id:uid(), name, checked:false};
    items.push(it);
    newItemId = it.id;
    undo = ()=>{
      items = items.filter(i=>i!==it);
      saveItems(); renderAll();
    };
  }
  remember(name, true, yomi);
  saveItems(); renderAll();
  snack('「'+name+'」を入れました 🛒', undo);
  if(rect) sparkle(rect);
  return true;
}

function toggleCheck(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it.checked = !it.checked;
  if(!it.checked){
    // チェックを外したら、買うもの欄のいちばん下へ
    items = items.filter(i=>i!==it);
    items.push(it);
  }
  newItemId = null;
  saveItems(); renderAll();
}

function removeItem(id){
  const idx = items.findIndex(i=>i.id===id);
  if(idx<0) return;
  const it = items[idx];
  items.splice(idx,1);
  // 1回しか入れていない商品（打ちまちがい等）は候補からも外す
  const k = norm(it.name);
  const h = hist[k];
  if(h && h.count<=1){ delete hist[k]; saveHist(); }
  newItemId = null;
  saveItems(); renderAll();
  snack('「'+it.name+'」を消しました', ()=>{
    items.splice(Math.min(idx, items.length), 0, it);
    if(h && !hist[k]){ hist[k] = h; saveHist(); }
    saveItems(); renderAll();
  });
}

function clearDone(){
  const before = items.slice();
  const n = items.filter(i=>i.checked).length;
  if(!n) return;
  items = items.filter(i=>!i.checked);
  newItemId = null;
  saveItems(); renderAll();
  snack('買ったもの '+n+'こ を消しました', ()=>{
    items = before;
    saveItems(); renderAll();
  });
}

function itemRow(it){
  const div = document.createElement('div');
  div.className = 'item' + (it.checked ? ' done' : '') + (it.id===newItemId ? ' new' : '');
  div.innerHTML =
    '<button class="main-tap" aria-pressed="'+(it.checked?'true':'false')+'">' +
      '<span class="chk" aria-hidden="true">' + (it.checked?'✓':'') + '</span>' +
      '<span class="name">' + esc(it.name) + '</span>' +
    '</button>' +
    '<button class="del" aria-label="「'+esc(it.name)+'」を消す">🗑</button>';
  div.querySelector('.main-tap').onclick = ()=>toggleCheck(it.id);
  div.querySelector('.del').onclick = ()=>removeItem(it.id);
  return div;
}

function renderItems(){
  const todo = items.filter(i=>!i.checked);
  const done = items.filter(i=>i.checked);
  const todoWrap = document.getElementById('todoWrap');
  const doneWrap = document.getElementById('doneWrap');
  todoWrap.innerHTML = ''; doneWrap.innerHTML = '';
  todo.forEach(it=>todoWrap.appendChild(itemRow(it)));
  done.forEach(it=>doneWrap.appendChild(itemRow(it)));

  document.getElementById('todoTitle').textContent =
    todo.length ? '🛒 買うもの　あと '+todo.length+'こ' : (done.length ? '🎉 ぜんぶ買えました！' : '');
  document.getElementById('todoTitle').hidden = !items.length;
  document.getElementById('listEmpty').style.display = items.length ? 'none' : 'block';
  document.getElementById('doneArea').hidden = !done.length;
  document.getElementById('doneTitle').textContent = '✓ 買ったもの '+done.length+'こ';

}

/* ---------- 入力欄と候補 ---------- */
const entryInput = document.getElementById('entryInput');
let lastCompositionEnd = 0;
/* 漢字に変換する前の「ひらがな」をおぼえておく（読みで候補をさがすため） */
let yomiBuf = '', curKana = '';
const isKana = s=>/^[\u3041-\u309f\u30a0-\u30ffー]+$/.test(s||'');
entryInput.addEventListener('compositionupdate', e=>{ if(isKana(e.data)) curKana = e.data; });
entryInput.addEventListener('compositionend', e=>{
  yomiBuf += curKana || e.data || '';
  curKana = '';
  lastCompositionEnd = Date.now();
});
entryInput.addEventListener('input', e=>{
  if(!entryInput.value) yomiBuf = '';
  else if(!e.isComposing && e.inputType==='insertText' && e.data) yomiBuf += e.data;
  renderSuggest();
});
entryInput.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  // 漢字変換を決めるための「改行」では追加しない
  if(e.isComposing || e.keyCode===229 || Date.now()-lastCompositionEnd < 80) return;
  e.preventDefault();
  submitEntry();
});
document.getElementById('entryAdd').onclick = submitEntry;

function submitEntry(){
  const v = entryInput.value.trim();
  if(!v){ toast('買うものを書いてね 🌸'); return; }
  addItem(v, entryInput, yomiBuf);
  entryInput.value = '';
  yomiBuf = '';
  renderSuggest();
}

/* 候補・ボタンを押しても入力欄からカーソルが外れない（キーボードが出たまま）ようにする */
document.addEventListener('mousedown', e=>{
  if(e.target.closest('.keep-focus') && document.activeElement===entryInput) e.preventDefault();
});
document.addEventListener('pointerdown', e=>{
  if(e.target.closest('.keep-focus') && document.activeElement===entryInput) e.preventDefault();
});

function renderSuggest(){
  const area = document.getElementById('suggestArea');
  const chipsEl = document.getElementById('suggestChips');
  const q = norm(entryInput.value);
  const inList = new Set(items.filter(i=>!i.checked).map(i=>norm(i.name)));

  // 候補：これまでに入れた商品 ＋ おすすめ商品
  const pool = {};
  Object.keys(hist).forEach(k=>{ pool[k] = {name:hist[k].name, count:hist[k].count, last:hist[k].last, yomi:hist[k].yomi||''}; });
  recos.forEach(r=>{
    const k = norm(r.name);
    if(k && !pool[k]) pool[k] = {name:r.name, count:0, last:r.created||0, yomi:''};
  });
  let cands = Object.keys(pool).filter(k=>!inList.has(k)).map(k=>Object.assign({k}, pool[k]));

  if(q){
    cands = cands.filter(c=>c.k.includes(q) || c.yomi.includes(q));
    const head = c=>c.k.startsWith(q) || c.yomi.startsWith(q);
    cands.sort((a,b)=>(head(b)-head(a)) || (b.count-a.count) || (b.last-a.last));
    document.getElementById('suggestLabel').textContent = '👇 タップするだけで入ります';
  }else{
    cands = cands.filter(c=>c.count>0);
    cands.sort((a,b)=>(b.count-a.count) || (b.last-a.last));
    document.getElementById('suggestLabel').textContent = '⭐ よく買うもの（タップで入ります）';
  }
  cands = cands.slice(0, 8);

  chipsEl.innerHTML = '';
  cands.forEach(c=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip keep-focus';
    b.innerHTML = '<span class="plus">＋</span>' + esc(c.name);
    b.onclick = ()=>{
      if(addItem(c.name, b)){
        entryInput.value = '';
        yomiBuf = '';
        renderSuggest();
      }
    };
    chipsEl.appendChild(b);
  });
  area.hidden = !cands.length;
  document.getElementById('entryHelp').hidden = !!q || items.length > 2;
}

function renderAll(){
  renderItems();
  renderSuggest();
  if(document.getElementById('secReco').classList.contains('show')) renderRecos();
}

/* =========================================================
   ② おすすめ商品
========================================================= */
let editingRecoId = null;
let actRecoId = null;
let pickedImg = null;    // 圧縮後dataURL(拡大表示用)
let pickedThumb = null;  // サムネイル(カード用・軽量)
let favOnly = false;

function openRecoSheet(id){
  editingRecoId = id || null;
  pickedImg = null; pickedThumb = null;
  const r = id ? recos.find(x=>x.id===id) : null;
  document.getElementById('recoSheetTitle').textContent = id ? '✏️ おすすめ商品を書きなおす' : '🌸 おすすめ商品を登録';
  document.getElementById('recoNameInput').value = r ? r.name : '';
  document.getElementById('recoMemoInput').value = r ? (r.memo||'') : '';
  document.getElementById('photoInput').value = '';
  setPhotoPreview(r ? (r.thumb || r.img) : null);
  if(r){ pickedImg = r.img || null; pickedThumb = r.thumb || null; }
  openOv('ovReco');
}
function setPhotoPreview(dataUrl){
  const pick = document.getElementById('photoPick');
  pick.querySelectorAll('img').forEach(i=>i.remove());
  document.getElementById('photoPickLabel').textContent = dataUrl ? 'タップして写真を変更' : 'タップして写真を選ぶ';
  if(dataUrl){
    const img = document.createElement('img');
    img.src = dataUrl;
    pick.appendChild(img);
  }
}
/* 📸 画像圧縮：長辺1000pxのJPEG(拡大用) + 360pxサムネ(カード用) */
function onPhotoPicked(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      pickedImg = compressImage(img, 1000, .78);
      pickedThumb = compressImage(img, 360, .72);
      setPhotoPreview(pickedThumb);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function compressImage(img, maxSide, quality){
  let w = img.naturalWidth, h = img.naturalHeight;
  if(Math.max(w,h) > maxSide){
    const sc = maxSide / Math.max(w,h);
    w = Math.round(w*sc); h = Math.round(h*sc);
  }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', quality);
}
async function saveReco(e){
  const name = document.getElementById('recoNameInput').value.trim();
  const memo = document.getElementById('recoMemoInput').value.trim();
  if(!name){ toast('商品名を入れてね🌸'); return; }
  try{
    if(editingRecoId){
      const r = recos.find(x=>x.id===editingRecoId);
      if(r){
        r.name = name; r.memo = memo;
        r.img = pickedImg; r.thumb = pickedThumb;
        await dbPut(r);
      }
      toast('書きなおしました ✏️');
    }else{
      const rec = {id:uid(), name, memo, fav:false, img:pickedImg, thumb:pickedThumb, created:Date.now()};
      recos.unshift(rec);
      await dbPut(rec);
      toast('登録しました 🌸');
    }
    renderRecos(); renderSuggest();
    closeOv('ovReco'); sparkle(e.target);
  }catch(err){
    toast('保存に失敗しちゃった…もう一度試してね');
  }
}
async function toggleFav(id, ev){
  ev.stopPropagation();
  const r = recos.find(x=>x.id===id);
  if(!r) return;
  r.fav = !r.fav;
  const rect = ev.currentTarget.getBoundingClientRect();
  try{ await dbPut(r); }catch(e){}
  renderRecos();
  if(r.fav) sparkle(rect);
}
function toggleFavFilter(){
  favOnly = !favOnly;
  const b = document.getElementById('favFilter');
  b.classList.toggle('on', favOnly);
  b.textContent = favOnly ? '❤️' : '🤍';
  renderRecos();
}
function openRecoAct(id, ev){
  if(ev) ev.stopPropagation();
  actRecoId = id;
  const r = recos.find(x=>x.id===id);
  document.getElementById('recoActName').textContent = '「' + (r?.name||'') + '」';
  openOv('ovRecoAct');
}
function editRecoFromAct(){
  closeOv('ovRecoAct');
  openRecoSheet(actRecoId);
}
function askDeleteReco(){
  closeOv('ovRecoAct');
  const r = recos.find(x=>x.id===actRecoId);
  const delId = actRecoId;
  showConfirm('「'+ (r?.name||'') +'」を削除するよ。写真も消えちゃうけど、いいかな？', async ()=>{
    recos = recos.filter(x=>x.id!==delId);
    try{ await dbDelete(delId); }catch(e){}
    renderRecos(); renderSuggest();
    toast('削除しました 🗑');
  });
}
function showConfirm(msg, onYes){
  document.getElementById('confirmMsg').textContent = msg;
  const btn = document.getElementById('confirmYes');
  btn.onclick = ()=>{ closeOv('ovConfirm'); onYes(); };
  openOv('ovConfirm');
}
function openLightbox(id){
  const r = recos.find(x=>x.id===id);
  if(!r) return;
  if(!r.img){ openRecoAct(id); return; }
  document.getElementById('lbImg').src = r.img;
  document.getElementById('lbName').textContent = r.name;
  document.getElementById('lbMemo').textContent = r.memo || '';
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

function renderRecos(){
  const q = norm(document.getElementById('searchInput').value);
  const wrap = document.getElementById('cardsWrap');
  wrap.innerHTML = '';
  const inList = new Set(items.filter(i=>!i.checked).map(i=>norm(i.name)));
  let list = recos;
  if(favOnly) list = list.filter(r=>r.fav);
  if(q) list = list.filter(r=>norm(r.name).includes(q) || norm(r.memo).includes(q));
  document.getElementById('recoEmpty').style.display = list.length ? 'none' : 'block';
  document.getElementById('recoEmpty').innerHTML = recos.length && !list.length
    ? '<span class="big">🔍</span>見つからなかったよ🌸<br>ことばを変えてさがしてみてね'
    : '<span class="big">🌸</span>お気に入り商品を写真つきで<br>登録してみてね✨';
  list.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'card';
    const isIn = inList.has(norm(r.name));
    const imgHtml = r.thumb
      ? '<img class="ph" loading="lazy" src="'+r.thumb+'" alt="">'
      : '<div class="noimg">🍎</div>';
    card.innerHTML =
      imgHtml +
      '<button class="heart" aria-label="お気に入り">'+(r.fav?'❤️':'🤍')+'</button>' +
      '<button class="card-edit" aria-label="書きなおす・削除">✏️</button>' +
      '<div class="body"><div class="cname">'+esc(r.name)+'</div>' +
      (r.memo ? '<div class="cmemo">💕 '+esc(r.memo)+'</div>' : '') +
      '<div class="to-list"><button class="'+(isIn?'in':'')+'">' +
        (isIn ? '✓ 入っています' : '🛒 リストに入れる') +
      '</button></div>' +
      '</div>';
    card.querySelector('.heart').onclick = ev=>toggleFav(r.id, ev);
    card.querySelector('.card-edit').onclick = ev=>openRecoAct(r.id, ev);
    card.querySelector('.to-list button').onclick = ev=>{
      ev.stopPropagation();
      addItem(r.name, ev.currentTarget);
    };
    card.onclick = ()=>openLightbox(r.id);
    wrap.appendChild(card);
  });
}

/* ========================================================= 起動 */
(async function init(){
  loadItems();
  loadHist();
  renderItems();
  renderSuggest();
  try{
    db = await openDB();
    recos = (await dbGetAll()).sort((a,b)=>(b.created||0)-(a.created||0));
  }catch(e){ recos = []; }
  renderRecos();
  renderSuggest();
})();
</script>
