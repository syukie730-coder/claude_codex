<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>マネー手帳</title>
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マネー手帳">
<link rel="apple-touch-icon" href="money-icon.png">
<link rel="icon" href="money-icon.png">
<style>
/* ============================================================
   マネー手帳 — Black × Gold
   トークン
   ============================================================ */
:root{
  --obsidian:#08080A;
  --ink:#131317;
  --ink-2:#191920;
  --line:rgba(212,175,55,.20);
  --line-soft:rgba(255,255,255,.06);
  --gold:#D4AF37;
  --gold-lt:#F6E5A6;
  --gold-dp:#8A6C1C;
  --text:#F2EFE6;
  --muted:#8E8878;
  --plus:#7BD4A6;
  --minus:#E28C7C;

  --g-face:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --m-face:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --n-face:"SF Pro Display",-apple-system,"Helvetica Neue",var(--g-face);

  --pad:18px;
  --r:16px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(212,175,55,.10) 0%, rgba(8,8,10,0) 60%),
    var(--obsidian);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--g-face);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;}

/* ---------- ヘッダー ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(8,8,10,.96) 60%,rgba(8,8,10,.75));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
}
.brand{display:flex;align-items:center;gap:9px;}
.brand-mark{
  width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(140deg,var(--gold-lt),var(--gold) 45%,var(--gold-dp));
  box-shadow:0 0 12px rgba(212,175,55,.35);
}
.brand h1{
  margin:0;font-family:var(--m-face);font-weight:600;
  font-size:17px;letter-spacing:.16em;color:var(--gold-lt);
}
.monthbar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;}
.mo-btn{
  width:38px;height:32px;border:1px solid var(--line);border-radius:10px;
  background:var(--ink);color:var(--gold);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;
}
.mo-btn:active{transform:scale(.9);}
.mo-label{
  min-width:150px;text-align:center;font-family:var(--m-face);
  font-size:16px;letter-spacing:.10em;color:var(--text);
}
.mo-today{
  border:0;background:none;color:var(--muted);font-size:11px;
  letter-spacing:.08em;padding:2px 6px;cursor:pointer;
}

/* ---------- レイアウト ---------- */
main{padding:16px var(--pad) 8px;max-width:560px;margin:0 auto;}
.view{display:none;}
.view.on{display:block;}

.eyebrow{
  font-family:var(--m-face);font-size:11px;letter-spacing:.22em;
  color:var(--gold-dp);margin:26px 0 10px;display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
.eyebrow:first-child{margin-top:4px;}

.card{
  background:linear-gradient(165deg,var(--ink-2),var(--ink));
  border:1px solid var(--line-soft);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:12px;
  opacity:0;transform:translateY(10px);
  animation:rise .5s cubic-bezier(.22,.9,.3,1) forwards;
}
@keyframes rise{to{opacity:1;transform:none;}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid2 .card{margin-bottom:0;}

.lbl{font-size:11.5px;letter-spacing:.14em;color:var(--muted);}
.num{
  font-family:var(--n-face);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;line-height:1.15;
}

/* ---------- ヒーロー：総資産 ---------- */
.hero{
  position:relative;overflow:hidden;
  border:1px solid var(--line);
  background:
    radial-gradient(90% 120% at 12% 0%, rgba(212,175,55,.13), transparent 62%),
    linear-gradient(165deg,#1B1B22,#101015);
  padding:20px 18px 18px;
}
.hero .lbl{display:block;margin-bottom:6px;}
.hero-num{
  font-family:var(--n-face);font-variant-numeric:tabular-nums;
  font-size:38px;font-weight:600;letter-spacing:-.02em;
  background:linear-gradient(100deg,#FFF4CE,var(--gold) 42%,#B98F20);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{margin-top:4px;font-size:12.5px;color:var(--muted);}
.hero-sub b{font-family:var(--n-face);font-weight:600;font-variant-numeric:tabular-nums;}
.up{color:var(--plus);}.down{color:var(--minus);}

.goal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);}
.goal-row b{font-family:var(--n-face);color:var(--gold-lt);font-weight:600;}
.track{height:3px;border-radius:2px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden;}
.fill{
  height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--gold-dp),var(--gold),var(--gold-lt));
  transition:width 1.1s cubic-bezier(.22,.9,.3,1);
}
/* 目標達成 → 金色に光る */
.hero.achieved{border-color:rgba(212,175,55,.55);}
.hero.achieved::after{
  content:"";position:absolute;inset:-40%;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,238,180,.16) 50%,transparent 58%);
  animation:shine 3.6s ease-in-out infinite;
}
@keyframes shine{0%{transform:translateX(-45%);}55%,100%{transform:translateX(45%);}}

/* ---------- 小カード ---------- */
.stat .num{font-size:22px;font-weight:600;margin-top:5px;color:var(--text);}
.stat .num.gold{
  background:linear-gradient(100deg,#FFF4CE,var(--gold) 55%,#B98F20);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat .foot{font-size:11px;color:var(--muted);margin-top:2px;}

.rows{margin:0;}
.row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;
}
.row:last-child{border-bottom:0;}
.row span:first-child{color:var(--muted);letter-spacing:.04em;}
.row span:last-child{font-family:var(--n-face);font-variant-numeric:tabular-nums;}

.empty{
  text-align:center;color:var(--muted);font-size:13px;
  padding:34px 16px;line-height:2;
}
.empty .em{font-family:var(--m-face);color:var(--gold-dp);font-size:15px;letter-spacing:.14em;display:block;margin-bottom:6px;}

/* ---------- 入力 ---------- */
.field{
  display:flex;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--line-soft);
}
.field:last-of-type{border-bottom:0;}
.field label{flex:1;font-size:13.5px;color:var(--muted);letter-spacing:.04em;}
.field .yen{color:var(--gold-dp);font-size:13px;}
.field input{
  width:132px;text-align:right;
  background:transparent;border:0;border-bottom:1px solid transparent;
  padding:6px 2px;font-family:var(--n-face);font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:500;
}
.field input:focus{outline:none;border-bottom-color:var(--gold);}
.field input::placeholder{color:#3A3A42;}
.subtotal{
  display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted);
}
.subtotal b{font-family:var(--n-face);font-size:16px;color:var(--gold-lt);font-weight:600;}

.btn{
  width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);
  background:linear-gradient(165deg,var(--ink-2),var(--ink));
  color:var(--gold-lt);font-size:14.5px;letter-spacing:.14em;
  font-family:var(--m-face);cursor:pointer;transition:transform .1s;
}
.btn:active{animation:press .28s cubic-bezier(.3,1.5,.5,1);}
@keyframes press{0%{transform:scale(1);}35%{transform:scale(.955);}100%{transform:scale(1);}}
.btn.primary{
  background:linear-gradient(150deg,#F6E5A6,#D4AF37 48%,#9C7A1E);
  color:#17130A;border-color:transparent;font-weight:600;
  box-shadow:0 6px 22px -10px rgba(212,175,55,.8);
}
.btn.ghost{color:var(--muted);}
.btn.danger{color:var(--minus);}
.btn+.btn{margin-top:10px;}

/* ---------- グラフ ---------- */
.chart{width:100%;display:block;overflow:visible;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:14px;}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);}
.lg i{width:9px;height:9px;border-radius:3px;flex:none;}
.lg b{margin-left:auto;font-family:var(--n-face);font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;}
.keys{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;color:var(--muted);}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}

/* ---------- タブ ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(11,11,14,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  border:0;background:none;padding:10px 0 11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#5C5A54;transition:color .2s,transform .12s;
}
.tab:active{transform:scale(.92);}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:10px;letter-spacing:.10em;}
.tab.on{color:var(--gold);}

/* ---------- 紙吹雪 & トースト ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}
#toast{
  position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);z-index:70;
  background:rgba(24,24,29,.97);border:1px solid var(--line);
  color:var(--gold-lt);padding:11px 20px;border-radius:999px;
  font-size:12.5px;letter-spacing:.08em;opacity:0;transition:.3s;pointer-events:none;
  white-space:nowrap;
}
#toast.on{opacity:1;transform:translate(-50%,0);}

.note{font-size:11.5px;color:var(--muted);line-height:1.9;}

@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition:none!important;}
  .card{opacity:1;transform:none;}
}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-mark"></div><h1>マネー手帳</h1></div>
  <div class="monthbar">
    <button class="mo-btn" id="prev" aria-label="前の月">‹</button>
    <div class="mo-label" id="molabel">—</div>
    <button class="mo-btn" id="next" aria-label="次の月">›</button>
    <button class="mo-today" id="today">今月</button>
  </div>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-input"></section>
  <section class="view" id="v-chart"></section>
  <section class="view" id="v-set"></section>
</main>

<nav>
  <button class="tab on" data-v="home">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span>
  </button>
  <button class="tab" data-v="input">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>入力</span>
  </button>
  <button class="tab" data-v="chart">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/></svg><span>グラフ</span>
  </button>
  <button class="tab" data-v="set">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg><span>設定</span>
  </button>
</nav>

<canvas id="confetti"></canvas>
<div id="toast"></div>

<script>
/* ============================================================
   1. 設定（ここを増やすだけで項目を追加できます）
   ============================================================ */
const EXP = ['住宅','交際費','食費','衣服美容','通信費','自動車','交通費','光熱費','保険','医療費','特別支出','趣味娯楽','日用品','教養','その他'];
const INC = ['給与','年金','配当金','その他収入'];
const AST = ['iDeCo','証券口座','現金','生活防衛資金'];
const KEY = 'moneybook.v1';

/* ============================================================
   2. データ
   ============================================================ */
const blank = () => ({
  exp:Object.fromEntries(EXP.map(k=>[k,0])),
  inc:Object.fromEntries(INC.map(k=>[k,0])),
  ast:Object.fromEntries(AST.map(k=>[k,0]))
});

// スプレッドシートの2026年1〜6月を初期データとして収録
const SEED = (()=>{
  const e = {
    住宅:[74600,74600,74600,74600,74600,74600],
    交際費:[38065,82028,46416,130158,47974,39423],
    食費:[39524,39267,54269,38602,51338,43603],
    衣服美容:[4430,11910,12915,20411,8264,5707],
    通信費:[14284,12416,13136,12754,13526,13546],
    自動車:[20000,20000,20000,20000,20000,20000],
    交通費:[14410,14954,14410,14410,13540,15740],
    光熱費:[15527,9488,12287,9871,14460,10269],
    保険:[9122,9122,9122,9122,9122,9122],
    医療費:[16209,16108,33275,10000,26310,73983],
    特別支出:[20000,22000,20000,20000,20000,20000],
    趣味娯楽:[3500,4820,5927,8210,6732,3500],
    日用品:[18366,15999,16470,1724,20537,4019],
    教養:[3300,3300,3300,3300,3300,3300],
    その他:[5072,8909,22289,31584,21299,5448]
  };
  const i = {
    給与:[148078,188308,172992,216140,193950,222320],
    年金:[137470,137471,137471,137471,137470,140119],
    配当金:[900,996,45206,10380,16832,247381],
    その他収入:[75730,20000,14425,31070,12500,30000]
  };
  const a = {
    iDeCo:[3953321,4005245,3820620,4321498,4583477,4553653],
    証券口座:[34461229,36361228,34547252,37055085,38546923,39174973],
    現金:[3096746,2696850,1968949,1658860,899489,1371266],
    生活防衛資金:[5400000,5400000,5400000,5400000,5400000,5000000]
  };
  const out = {};
  for(let m=0;m<6;m++){
    const r = blank();
    for(const k in e) r.exp[k]=e[k][m];
    for(const k in i) r.inc[k]=i[k][m];
    for(const k in a) r.ast[k]=a[k][m];
    out['2026-'+String(m+1).padStart(2,'0')] = r;
  }
  return out;
})();

let DB;
try{ DB = JSON.parse(localStorage.getItem(KEY)) || null; }catch(_){ DB = null; }
if(!DB) DB = { goal:55000000, months:SEED };
if(!DB.goal) DB.goal = 55000000;
if(!DB.months) DB.months = {};

const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(_){ toast('保存できませんでした'); } };

/* ============================================================
   3. 計算
   ============================================================ */
const sum = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
function calc(m){
  if(!m) return null;
  const out = sum(m.exp), inn = sum(m.inc);
  const stock = (+m.ast['iDeCo']||0) + (+m.ast['証券口座']||0);
  const cash  = (+m.ast['現金']||0) + (+m.ast['生活防衛資金']||0);
  return {
    out, inn,
    saved: inn - out,
    rate: inn>0 ? (inn-out)/inn*100 : 0,
    stock, cash, total: stock+cash,
    dividend: +m.inc['配当金']||0
  };
}
const ymKey = (y,m) => y+'-'+String(m).padStart(2,'0');
const has = k => !!DB.months[k];
const sortedKeys = () => Object.keys(DB.months).sort();

/* ============================================================
   4. 表示ヘルパー
   ============================================================ */
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const signed = n => (n>=0?'+':'−') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function countUp(el, to, fmt){
  if(reduce){ el.textContent = fmt(to); return; }
  const from = 0, dur = 950, t0 = performance.now();
  (function step(t){
    const p = Math.min(1,(t-t0)/dur);
    const e = 1-Math.pow(1-p,3);
    el.textContent = fmt(from+(to-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function animateNums(root){
  root.querySelectorAll('[data-count]').forEach((el,i)=>{
    const to = +el.dataset.count, mode = el.dataset.fmt||'yen';
    const fmt = mode==='pct' ? v=>v.toFixed(1)+'%'
              : mode==='signed' ? v=>signed(v) : v=>yen(v);
    setTimeout(()=>countUp(el,to,fmt), 60+i*45);
  });
}
function stagger(root){
  root.querySelectorAll('.card').forEach((c,i)=>c.style.animationDelay=(i*55)+'ms');
}

/* ============================================================
   5. ホーム
   ============================================================ */
let cur = { y:new Date().getFullYear(), m:new Date().getMonth()+1 };

function renderHome(){
  const el = document.getElementById('v-home');
  const k = ymKey(cur.y,cur.m);
  const m = DB.months[k];
  if(!m){
    el.innerHTML = `<div class="card"><div class="empty">
      <span class="em">記録がありません</span>
      下の「入力」から${cur.m}月の数字を記録すると、<br>ここに今月のまとめが出ます。</div></div>`;
    stagger(el); return;
  }
  const c = calc(m);

  // 前月との比較
  const pm = cur.m===1 ? DB.months[ymKey(cur.y-1,12)] : DB.months[ymKey(cur.y,cur.m-1)];
  const diff = pm ? c.total - calc(pm).total : null;

  const pct = Math.max(0, Math.min(100, c.total/DB.goal*100));
  const done = c.total >= DB.goal;

  el.innerHTML = `
    <div class="card hero ${done?'achieved':''}">
      <span class="lbl">今月の総資産</span>
      <div class="hero-num num" data-count="${c.total}">¥0</div>
      <div class="hero-sub">${
        diff===null ? '前月のデータがありません'
        : `前月比 <b class="${diff>=0?'up':'down'}">${signed(diff)}</b>`
      }</div>
      <div class="goal">
        <div class="goal-row">
          <span>目標 ${yen(DB.goal)}</span>
          <span>${done ? '<b>達成 🎉</b>' : `あと <b>${yen(DB.goal-c.total)}</b>`}</span>
        </div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:12px">
      <div class="card stat"><span class="lbl">収入合計</span>
        <div class="num" data-count="${c.inn}">¥0</div></div>
      <div class="card stat"><span class="lbl">支出合計</span>
        <div class="num" data-count="${c.out}">¥0</div></div>
    </div>
    <div class="grid2">
      <div class="card stat"><span class="lbl">貯蓄率</span>
        <div class="num gold" data-count="${c.rate}" data-fmt="pct">0%</div>
        <div class="foot">貯蓄額 ${signed(c.saved)}</div></div>
      <div class="card stat"><span class="lbl">配当金</span>
        <div class="num gold" data-count="${c.dividend}">¥0</div>
        <div class="foot">今月の受取</div></div>
    </div>

    <div class="eyebrow">資産の内訳</div>
    <div class="card rows">
      <div class="row"><span>株式合計（iDeCo＋証券）</span><span>${yen(c.stock)}</span></div>
      <div class="row"><span>現金合計（現金＋生活防衛資金）</span><span>${yen(c.cash)}</span></div>
      <div class="row"><span>総資産</span><span style="color:var(--gold-lt)">${yen(c.total)}</span></div>
    </div>

    <div class="eyebrow">支出の多い順</div>
    <div class="card rows">
      ${EXP.map(k=>[k,+m.exp[k]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5)
        .map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${yen(v)}</span></div>`).join('')
        || '<div class="row"><span>支出の記録がありません</span><span></span></div>'}
    </div>`;

  stagger(el); animateNums(el);
  requestAnimationFrame(()=>{ const f=document.getElementById('fill'); if(f) f.style.width = pct+'%'; });
}

/* ============================================================
   6. 入力
   ============================================================ */
function fieldSet(title, keys, data, group){
  return `<div class="eyebrow">${title}</div><div class="card">
    ${keys.map(k=>`<div class="field">
      <label for="f-${group}-${k}">${esc(k)}</label><span class="yen">¥</span>
      <input id="f-${group}-${k}" type="text" inputmode="numeric" data-g="${group}" data-k="${esc(k)}"
             value="${data[k]?Number(data[k]).toLocaleString('ja-JP'):''}" placeholder="0">
    </div>`).join('')}
    <div class="subtotal"><span>${group==='ast'?'合計':'小計'}</span><b data-sub="${group}">¥0</b></div>
  </div>`;
}

function renderInput(){
  const el = document.getElementById('v-input');
  const k = ymKey(cur.y,cur.m);
  const m = DB.months[k] ? JSON.parse(JSON.stringify(DB.months[k])) : blank();

  el.innerHTML = `
    <div class="card" style="padding:13px 16px">
      <div class="lbl" style="letter-spacing:.16em">${cur.y}年 ${cur.m}月 の記録</div>
      <div class="note" style="margin-top:4px">数字だけ入れてね。空欄は 0 として計算します。</div>
    </div>
    <button class="btn ghost" id="copyPrev">前の月からコピーする</button>
    ${fieldSet('収入', INC, m.inc, 'inc')}
    ${fieldSet('支出', EXP, m.exp, 'exp')}
    ${fieldSet('資産（月末の残高）', AST, m.ast, 'ast')}
    <div style="height:6px"></div>
    <button class="btn primary" id="saveBtn">${cur.m}月を保存する</button>
    <div style="height:8px"></div>
    ${has(k)?'<button class="btn danger" id="delBtn">この月の記録を消す</button>':''}
    <div style="height:20px"></div>`;

  stagger(el);

  // 入力：3桁区切りを保ちながら入力
  el.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const raw = inp.value.replace(/[^\d-]/g,'');
      inp.value = raw==='' ? '' : Number(raw).toLocaleString('ja-JP');
      subtotals(el);
    });
    inp.addEventListener('focus', ()=>inp.select());
  });
  subtotals(el);

  el.querySelector('#copyPrev').onclick = ()=>{
    const pk = cur.m===1 ? ymKey(cur.y-1,12) : ymKey(cur.y,cur.m-1);
    if(!DB.months[pk]){ toast('前の月の記録がありません'); return; }
    const p = DB.months[pk];
    el.querySelectorAll('input').forEach(inp=>{
      const v = p[inp.dataset.g][inp.dataset.k]||0;
      inp.value = v ? Number(v).toLocaleString('ja-JP') : '';
    });
    subtotals(el); toast('前の月をコピーしました');
  };

  el.querySelector('#saveBtn').onclick = ()=>{
    const rec = blank();
    el.querySelectorAll('input').forEach(inp=>{
      rec[inp.dataset.g][inp.dataset.k] = +inp.value.replace(/[^\d-]/g,'') || 0;
    });
    DB.months[k] = rec; save();
    const c = calc(rec);
    toast(`${cur.m}月を保存しました`);
    if(c.saved > 0) confetti();
    go('home');
  };

  const del = el.querySelector('#delBtn');
  if(del) del.onclick = ()=>{
    if(!confirm(`${cur.y}年${cur.m}月の記録を消します。よろしいですか？`)) return;
    delete DB.months[k]; save(); toast('削除しました'); go('home');
  };
}

function subtotals(el){
  ['inc','exp','ast'].forEach(g=>{
    let t=0;
    el.querySelectorAll(`input[data-g="${g}"]`).forEach(i=>t += +i.value.replace(/[^\d-]/g,'')||0);
    const b = el.querySelector(`[data-sub="${g}"]`);
    if(b) b.textContent = yen(t);
  });
}

/* ============================================================
   7. グラフ（依存ライブラリなしの自作SVG）
   ============================================================ */
const GOLD_RAMP = i => `hsl(${44 - i*1.4} ${72 - i*2.6}% ${80 - i*4.6}%)`;

function lineChart(keys){
  const W=320,H=170,L=8,R=8,T=16,B=26;
  const vals = keys.map(k=>calc(DB.months[k]).total);
  if(vals.length<2) return `<div class="empty">2か月ぶんの記録がたまると<br>グラフが出ます。</div>`;
  const mx=Math.max(...vals), mn=Math.min(...vals);
  const pad=(mx-mn)*0.25 || mx*0.05 || 1;
  const hi=mx+pad, lo=Math.max(0,mn-pad);
  const X=i=>L+i*(W-L-R)/(vals.length-1);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${X(vals.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const gy=DB.goal>=lo&&DB.goal<=hi ? `<line x1="${L}" x2="${W-R}" y1="${Y(DB.goal).toFixed(1)}" y2="${Y(DB.goal).toFixed(1)}" stroke="rgba(212,175,55,.45)" stroke-width="1" stroke-dasharray="3 4"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8A6C1C"/><stop offset="55%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#F6E5A6"/>
      </linearGradient>
      <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(212,175,55,.28)"/><stop offset="1" stop-color="rgba(212,175,55,0)"/>
      </linearGradient>
    </defs>
    ${gy}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      pathLength="1" stroke-dasharray="1" stroke-dashoffset="${reduce?0:1}">
      ${reduce?'':'<animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.3 1" keyTimes="0;1"/>'}
    </path>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#0B0B0E" stroke="#F6E5A6" stroke-width="1.6"/>`).join('')}
    ${keys.map((k,i)=>`<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#8E8878" font-size="9" text-anchor="middle" font-family="sans-serif">${+k.slice(5)}月</text>`).join('')}
  </svg>`;
}

function barChart(keys){
  const ks=keys.slice(-6);
  if(!ks.length) return `<div class="empty">記録がまだありません。</div>`;
  const W=320,H=170,T=14,B=26,L=6,R=6;
  const data=ks.map(k=>{const c=calc(DB.months[k]);return {k,inn:c.inn,out:c.out};});
  const mx=Math.max(...data.flatMap(d=>[d.inn,d.out]))||1;
  const slot=(W-L-R)/ks.length, bw=Math.min(15,slot*0.30);
  const Y=v=>T+(1-v/mx)*(H-T-B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E5A6"/><stop offset="1" stop-color="#C39D2A"/></linearGradient></defs>
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="rgba(255,255,255,.10)"/>
    ${data.map((d,i)=>{
      const cx=L+slot*i+slot/2;
      const y1=Y(d.inn), y2=Y(d.out);
      return `<rect x="${(cx-bw-1.5).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw}" height="${(H-B-y1).toFixed(1)}" rx="2" fill="url(#bg1)">
        ${reduce?'':`<animate attributeName="height" from="0" to="${(H-B-y1).toFixed(1)}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${H-B}" to="${y1.toFixed(1)}" dur=".7s" fill="freeze"/>`}
      </rect>
      <rect x="${(cx+1.5).toFixed(1)}" y="${y2.toFixed(1)}" width="${bw}" height="${(H-B-y2).toFixed(1)}" rx="2" fill="#3E3524" stroke="rgba(212,175,55,.4)" stroke-width=".8">
        ${reduce?'':`<animate attributeName="height" from="0" to="${(H-B-y2).toFixed(1)}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${H-B}" to="${y2.toFixed(1)}" dur=".7s" fill="freeze"/>`}
      </rect>
      <text x="${cx.toFixed(1)}" y="${H-8}" fill="#8E8878" font-size="9" text-anchor="middle" font-family="sans-serif">${+d.k.slice(5)}月</text>`;
    }).join('')}
  </svg>
  <div class="keys"><span><i style="background:linear-gradient(180deg,#F6E5A6,#C39D2A)"></i>収入</span>
  <span><i style="background:#3E3524;border:1px solid rgba(212,175,55,.4)"></i>支出</span></div>`;
}

function pieChart(k){
  const m=DB.months[k];
  if(!m) return `<div class="empty">この月の記録がありません。</div>`;
  const items=EXP.map(c=>[c,+m.exp[c]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const tot=items.reduce((a,b)=>a+b[1],0);
  if(!tot) return `<div class="empty">支出の記録がありません。</div>`;
  const r=54, C=2*Math.PI*r; let off=0;
  const segs=items.map(([c,v],i)=>{
    const len=v/tot*C;
    const s=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${GOLD_RAMP(i)}" stroke-width="26"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 80 80)"/>`;
    off+=len; return s;
  }).join('');
  return `<svg class="chart" viewBox="0 0 160 160" style="height:180px;margin:0 auto;max-width:180px">
      ${segs}
      <text x="80" y="76" text-anchor="middle" fill="#8E8878" font-size="8.5" font-family="sans-serif">支出合計</text>
      <text x="80" y="90" text-anchor="middle" fill="#F6E5A6" font-size="13" font-family="sans-serif">${yen(tot)}</text>
    </svg>
    <div class="legend">${items.map(([c,v],i)=>
      `<div class="lg"><i style="background:${GOLD_RAMP(i)}"></i>${esc(c)}<b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div>`;
}

function renderChart(){
  const el=document.getElementById('v-chart');
  const keys=sortedKeys().filter(k=>k.startsWith(cur.y+'-'));
  el.innerHTML=`
    <div class="eyebrow">総資産の推移（${cur.y}年）</div>
    <div class="card">${lineChart(keys)}</div>
    <div class="eyebrow">収入と支出</div>
    <div class="card">${barChart(keys)}</div>
    <div class="eyebrow">支出の割合（${cur.m}月）</div>
    <div class="card">${pieChart(ymKey(cur.y,cur.m))}</div>
    <div style="height:16px"></div>`;
  stagger(el);
}

/* ============================================================
   8. 設定
   ============================================================ */
function renderSet(){
  const el=document.getElementById('v-set');
  el.innerHTML=`
    <div class="eyebrow">目標</div>
    <div class="card">
      <div class="field"><label for="goalI">目標の総資産</label><span class="yen">¥</span>
        <input id="goalI" type="text" inputmode="numeric" value="${Number(DB.goal).toLocaleString('ja-JP')}"></div>
      <div class="note" style="margin-top:10px">この金額に届くと、ホームの総資産が金色に光ります。</div>
    </div>
    <button class="btn primary" id="goalSave">目標を保存する</button>

    <div class="eyebrow">データ</div>
    <div class="card rows">
      <div class="row"><span>記録した月数</span><span>${Object.keys(DB.months).length} か月</span></div>
      <div class="row"><span>保存場所</span><span style="font-family:var(--g-face);font-size:12px">この iPhone の中</span></div>
    </div>
    <button class="btn" id="csv">CSVで書き出す</button>
    <button class="btn danger" id="wipe">すべてのデータを消す</button>

    <div class="eyebrow">使い方</div>
    <div class="card note">
      ・上の「‹ ›」で月を移動します。<br>
      ・「入力」で1か月ぶんの数字を入れて保存すれば完了です。<br>
      ・「前の月からコピーする」を使うと、住宅・保険などの固定費を打ち直さずに済みます。<br>
      ・数字はこの端末の中だけに保存されます。機種変更の前に CSV を書き出してください。
    </div>
    <div style="height:20px"></div>`;
  stagger(el);

  const gi=el.querySelector('#goalI');
  gi.addEventListener('input',()=>{
    const raw=gi.value.replace(/[^\d]/g,'');
    gi.value = raw==='' ? '' : Number(raw).toLocaleString('ja-JP');
  });
  el.querySelector('#goalSave').onclick=()=>{
    DB.goal = +gi.value.replace(/[^\d]/g,'')||1; save(); toast('目標を保存しました');
  };
  el.querySelector('#csv').onclick=exportCSV;
  el.querySelector('#wipe').onclick=()=>{
    if(!confirm('すべての記録を消します。元に戻せません。よろしいですか？')) return;
    DB={goal:55000000,months:{}}; save(); toast('すべて削除しました'); go('home');
  };
}

function exportCSV(){
  const head=['年月',...EXP,'支出合計',...INC,'収入合計','貯蓄額','貯蓄率(%)','iDeCo','証券口座','株式合計','現金','生活防衛資金','現金合計','総資産'];
  const rows=sortedKeys().map(k=>{
    const m=DB.months[k], c=calc(m);
    return [k,...EXP.map(x=>m.exp[x]||0),c.out,...INC.map(x=>m.inc[x]||0),c.inn,c.saved,c.rate.toFixed(2),
      m.ast['iDeCo']||0,m.ast['証券口座']||0,c.stock,m.ast['現金']||0,m.ast['生活防衛資金']||0,c.cash,c.total];
  });
  if(!rows.length){ toast('書き出すデータがありません'); return; }
  const csv='\uFEFF'+[head,...rows].map(r=>r.join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='マネー手帳.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('CSVを書き出しました');
}

/* ============================================================
   9. 演出
   ============================================================ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2000);
}

function confetti(){
  if(reduce) return;
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols=['#F6E5A6','#D4AF37','#B8912A','#FFF4CE'];
  const P=Array.from({length:34},()=>({
    x:innerWidth*(.25+Math.random()*.5), y:innerHeight*.30+Math.random()*40,
    vx:(Math.random()-.5)*3.2, vy:-2.4-Math.random()*3.2,
    w:3+Math.random()*4, h:5+Math.random()*6,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.22,
    c:cols[(Math.random()*cols.length)|0]
  }));
  const t0=performance.now();
  (function tick(t){
    const el=t-t0; ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{
      p.vy+=0.10; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-el/1800); ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(el<1800) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ============================================================
   10. 画面切り替え
   ============================================================ */
const R={home:renderHome,input:renderInput,chart:renderChart,set:renderSet};
let view='home';
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  R[v](); scrollTo({top:0,behavior:reduce?'auto':'smooth'});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.v));

function shift(d){
  let m=cur.m+d, y=cur.y;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  cur={y,m}; paintMonth(); R[view]();
}
function paintMonth(){ document.getElementById('molabel').textContent = `${cur.y}年 ${cur.m}月`; }
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>{
  const d=new Date(); cur={y:d.getFullYear(),m:d.getMonth()+1}; paintMonth(); R[view]();
};
