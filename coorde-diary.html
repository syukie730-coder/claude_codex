<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>幸恵ちゃんのコーディネート日記</title>

<!-- ホーム画面追加（iPhone） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="コーデ日記">
<meta name="theme-color" content="#FFE9A8">
<link rel="apple-touch-icon" href="coorde-diary-icon.png">
<link rel="icon" type="image/png" href="coorde-diary-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   1. デザイントークン（色・字・かたち）※前のままです
   ============================================================ */
:root{
  --cream:#FFFBF0;
  --cream-2:#FFF6E2;
  --butter:#FFE9A8;
  --gold:#E3AE3C;
  --gold-deep:#B98518;
  --ink:#6B5218;
  --ink-soft:#9C8449;
  --white:#FFFFFF;
  --blush:#F6B8C6;

  --bg1:#FFFCF3;
  --bg2:#FFEFCF;
  --tint:#FFE1EC;

  --r-lg:30px;
  --r-md:22px;
  --r-sm:16px;
  --shadow:0 10px 26px rgba(190,143,40,.16);
  --shadow-lift:0 16px 38px rgba(190,143,40,.26);

  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;

  --tab-h:calc(74px + env(safe-area-inset-bottom));
}
body.s-spring{--bg1:#FFFCF4;--bg2:#FFEDDB;--tint:#FFDCE8;}
body.s-summer{--bg1:#FFFEF6;--bg2:#FFF3C4;--tint:#D9F0FA;}
body.s-autumn{--bg1:#FFFBF0;--bg2:#FFE4BE;--tint:#FFD8B0;}
body.s-winter{--bg1:#FFFDF7;--bg2:#FBF1DC;--tint:#E4EFFA;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg1);
  min-height:100dvh;
  overflow-x:hidden;
  transition:background .8s ease;
  -webkit-text-size-adjust:100%;
  font-size:17px;
  line-height:1.7;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(120% 70% at 50% -10%, var(--white) 0%, transparent 55%),
    radial-gradient(90% 60% at 12% 8%, var(--tint) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
  transition:background .8s ease;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{border:none;background:none;cursor:pointer;}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.02em;}

/* ============================================================
   2. 背景を流れるモチーフ
   ============================================================ */
#ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
#ambient span{
  position:absolute;bottom:-14vh;opacity:0;
  animation-name:floatUp;animation-timing-function:linear;animation-iteration-count:infinite;
  will-change:transform,opacity;
}
@keyframes floatUp{
  0%  {transform:translate3d(0,0,0) rotate(0deg);opacity:0;}
  12% {opacity:.55;}
  25% {transform:translate3d(22px,-28vh,0) rotate(24deg);}
  50% {transform:translate3d(-18px,-56vh,0) rotate(-18deg);opacity:.5;}
  75% {transform:translate3d(20px,-84vh,0) rotate(20deg);}
  92% {opacity:0;}
  100%{transform:translate3d(0,-116vh,0) rotate(0deg);opacity:0;}
}

/* ============================================================
   3. オープニング
   ============================================================ */
#splash{
  position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:
    radial-gradient(80% 60% at 50% 34%, #FFFFFF 0%, transparent 62%),
    linear-gradient(180deg,#FFFDF6 0%, var(--butter) 100%);
  transition:opacity .6s ease, visibility .6s;
}
#splash.hide{opacity:0;visibility:hidden;}
.splash-inner{text-align:center;position:relative;}
.splash-dress{width:min(52vw,208px);animation:dressRise 1.5s cubic-bezier(.2,1.5,.35,1) both, dressSway 3.4s 1.5s ease-in-out infinite;}
@keyframes dressRise{
  0%  {transform:translateY(48px) scale(.55) rotate(-16deg);opacity:0;}
  55% {opacity:1;}
  70% {transform:translateY(-10px) scale(1.06) rotate(4deg);}
  100%{transform:translateY(0) scale(1) rotate(0);opacity:1;}
}
@keyframes dressSway{
  0%,100%{transform:rotate(-3.5deg) translateY(0);}
  50%    {transform:rotate(3.5deg) translateY(-6px);}
}
.splash-title{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(23px,7vw,30px);color:var(--gold-deep);
  margin-top:22px;letter-spacing:.06em;
  animation:fadeUp .9s .75s both;
}
.splash-sub{
  font-size:14px;color:var(--ink-soft);letter-spacing:.24em;
  margin-top:8px;animation:fadeUp .9s .95s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.burst{position:absolute;left:50%;top:38%;width:1px;height:1px;}
.burst i{
  position:absolute;font-size:16px;opacity:0;
  animation:burst 1.5s .35s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes burst{
  0%{opacity:0;transform:translate(0,0) scale(.2);}
  30%{opacity:1;}
  100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.15) rotate(140deg);}
}

/* ============================================================
   4. ヘッダー
   ============================================================ */
#topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;
  display:flex;align-items:center;gap:11px;
  background:linear-gradient(180deg, rgba(255,252,243,.94) 60%, rgba(255,252,243,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
#topbar .mark{width:30px;flex:none;animation:dressSway 4.6s ease-in-out infinite;}
.brand{font-family:var(--font-display);font-weight:900;font-size:19px;color:var(--gold-deep);letter-spacing:.03em;}
.season-badge{
  margin-left:auto;flex:none;font-size:13px;font-weight:700;color:var(--gold-deep);
  background:var(--white);border:2px solid var(--butter);border-radius:999px;
  padding:5px 14px;box-shadow:0 4px 12px rgba(190,143,40,.14);
}

/* ============================================================
   5. 画面共通
   ============================================================ */
main{padding:4px 16px calc(var(--tab-h) + 26px);max-width:620px;margin:0 auto;}
.view{display:none;}
.view.is-active{display:block;animation:viewIn .38s cubic-bezier(.22,.85,.28,1) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985);}to{opacity:1;transform:none;}}

.view-title{font-size:24px;font-weight:900;color:var(--gold-deep);margin:6px 0 4px;}
.view-lead{font-size:14px;color:var(--ink-soft);margin:0 0 18px;}

.card{
  background:var(--white);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:20px 18px;margin-bottom:16px;
  border:1.5px solid rgba(227,174,60,.16);
}
.field-label{
  display:flex;align-items:center;gap:7px;
  font-family:var(--font-display);font-weight:700;font-size:16px;
  color:var(--gold-deep);margin-bottom:9px;
}
.field-label small{font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-left:auto;}

.input, textarea.input{
  width:100%;background:var(--cream-2);border:2px solid rgba(227,174,60,.22);
  border-radius:var(--r-sm);padding:13px 15px;font-size:17px;color:var(--ink);
  outline:none;transition:border-color .2s, background .2s, box-shadow .2s;
  -webkit-appearance:none;appearance:none;
}
.input::placeholder{color:#C9B37E;}
.input:focus{border-color:var(--gold);background:var(--white);box-shadow:0 0 0 4px rgba(227,174,60,.14);}
textarea.input{resize:none;line-height:1.75;}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  font-size:14px;font-weight:500;color:var(--gold-deep);
  background:var(--white);border:2px solid var(--butter);border-radius:999px;
  padding:6px 13px;transition:transform .16s, background .16s;
}
.chip:active{transform:scale(.93);background:var(--butter);}

.date-pill{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,#FFF6DC,#FFE9A8);
  border:2px solid rgba(227,174,60,.34);border-radius:var(--r-md);
  padding:15px;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--gold-deep);
}
.date-pill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;}
.date-pill .tap{font-size:11.5px;font-weight:400;color:var(--ink-soft);letter-spacing:.08em;}

.photo-add{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--cream-2);border:2.5px dashed rgba(227,174,60,.5);
  border-radius:var(--r-md);padding:22px;color:var(--gold-deep);
  font-family:var(--font-display);font-weight:700;font-size:17px;
  transition:transform .16s, background .2s;
}
.photo-add:active{transform:scale(.97);background:var(--butter);}
.photo-add.is-full{opacity:.45;}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.thumbs::-webkit-scrollbar{display:none;}
.thumb{position:relative;flex:none;width:104px;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;scroll-snap-align:center;
  box-shadow:0 6px 16px rgba(190,143,40,.2);animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes popIn{from{opacity:0;transform:scale(.7) rotate(-6deg);}to{opacity:1;transform:none;}}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb .del{
  position:absolute;top:5px;right:5px;width:27px;height:27px;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--gold-deep);font-size:15px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 2px 7px rgba(0,0,0,.16);
}
.photo-count{font-size:13px;color:var(--ink-soft);text-align:right;margin-top:2px;}

.stars{display:flex;justify-content:center;gap:6px;padding:4px 0 2px;}
.stars button{
  font-size:38px;line-height:1;color:#EADCB6;transition:transform .18s cubic-bezier(.2,1.6,.4,1), color .18s;
}
.stars button.on{color:var(--gold);text-shadow:0 3px 10px rgba(227,174,60,.45);}
.stars button.pop{transform:scale(1.35) rotate(12deg);}
.stars-note{text-align:center;font-size:13.5px;color:var(--ink-soft);min-height:1.7em;}

.save-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#FFDF8E 0%,var(--gold) 55%,#D69A20 100%);
  color:#5A4210;font-family:var(--font-display);font-weight:900;font-size:20px;
  border-radius:999px;padding:18px;box-shadow:var(--shadow-lift);
  transition:transform .16s, box-shadow .2s;letter-spacing:.04em;
}
.save-btn:active{transform:scale(.965);box-shadow:0 8px 18px rgba(190,143,40,.3);}
.save-btn svg{width:26px;flex:none;}
.cancel-edit{display:block;width:100%;text-align:center;font-size:14px;color:var(--ink-soft);padding:14px 0 0;text-decoration:underline;}

/* ============================================================
   6. カレンダー（ここがホーム画面）
   ============================================================ */
.cal-head{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);
  border:1.5px solid rgba(227,174,60,.16);
  padding:10px 12px;margin-bottom:14px;
}
.cal-head .nav{
  width:46px;height:46px;flex:none;border-radius:50%;
  background:var(--cream-2);color:var(--gold-deep);font-size:22px;font-weight:700;
  display:grid;place-items:center;transition:transform .16s, background .2s;
}
.cal-head .nav:active{transform:scale(.9);background:var(--butter);}
.cal-title{
  flex:1;text-align:center;font-family:var(--font-display);font-weight:900;
  font-size:21px;color:var(--gold-deep);line-height:1.25;
}
.cal-title small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-soft);letter-spacing:.16em;}
.to-today{
  display:block;margin:-6px auto 14px;font-size:13.5px;color:var(--gold-deep);
  background:var(--white);border:2px solid var(--butter);border-radius:999px;
  padding:6px 18px;font-weight:700;box-shadow:0 4px 12px rgba(190,143,40,.14);
}

.cal-wrap{
  background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);
  border:1.5px solid rgba(227,174,60,.16);padding:12px 10px 14px;margin-bottom:16px;
}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.week-row span{
  text-align:center;font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--ink-soft);
}
.week-row span.sun{color:#D98A8A;}
.week-row span.sat{color:#8AA6C4;}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-grid .pad{aspect-ratio:3/4;}
.day{
  position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
  background:var(--cream-2);border:1.5px solid rgba(227,174,60,.14);
  display:block;padding:0;transition:transform .16s, box-shadow .2s;
  animation:popIn .34s cubic-bezier(.2,1.3,.4,1) both;
}
.day:active{transform:scale(.92);box-shadow:var(--shadow);}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.day .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.72) 0 34%, rgba(0,0,0,0) 62%);}
.day .dnum{
  position:absolute;top:2px;left:0;right:0;text-align:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink);
  text-shadow:0 1px 2px rgba(255,255,255,.9);
}
.day.sun .dnum{color:#C97878;}
.day.sat .dnum{color:#7F9CBC;}
.day .dress{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:64%;opacity:.85;}
.day .mk{
  position:absolute;bottom:2px;left:0;right:0;text-align:center;
  font-size:11px;color:var(--gold);line-height:1;text-shadow:0 1px 3px rgba(255,255,255,.95);
}
.day.has{background:linear-gradient(160deg,#FFF8E6,#FFE9A8);border-color:rgba(227,174,60,.34);}
.day.today{border:2.5px solid var(--gold);box-shadow:0 0 0 3px rgba(227,174,60,.18);}
.day.today .dnum{color:var(--gold-deep);font-weight:900;font-size:15px;}
.day.other{opacity:.34;}

/* 今月のまとめ */
.stat-card{
  background:linear-gradient(135deg,#FFF9EA,#FFEFC6);
  border:1.5px solid rgba(227,174,60,.26);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px 14px;margin-bottom:16px;
}
.stat-card h3{font-size:15px;color:var(--gold-deep);text-align:center;margin-bottom:10px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-row div{text-align:center;background:rgba(255,255,255,.72);border-radius:18px;padding:10px 4px;}
.stat-row b{display:block;font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--gold-deep);line-height:1.15;}
.stat-row small{font-size:12px;color:var(--ink-soft);}

/* 今日をきろく */
.today-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#FFDF8E 0%,var(--gold) 55%,#D69A20 100%);
  color:#5A4210;font-family:var(--font-display);font-weight:900;font-size:19px;
  border-radius:999px;padding:16px;box-shadow:var(--shadow-lift);margin-bottom:18px;
  transition:transform .16s;
}
.today-btn:active{transform:scale(.965);}
.today-btn svg{width:24px;flex:none;}

/* さがす */
.search-bar{
  background:var(--white);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:14px 16px;margin-bottom:18px;border:1.5px solid rgba(227,174,60,.16);
}
.result-note{font-size:13.5px;color:var(--ink-soft);margin:0 4px 12px;}
.cards{display:grid;gap:16px;}
.entry-card{
  position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--white);
  box-shadow:var(--shadow);border:1.5px solid rgba(227,174,60,.18);
  animation:cardIn .45s cubic-bezier(.22,.9,.28,1) both;
  transition:transform .2s, box-shadow .25s;text-align:left;width:100%;display:block;
}
.entry-card:active{transform:scale(.982);box-shadow:var(--shadow-lift);}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.entry-card .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#FFF8E6,#FFE9A8);overflow:hidden;}
.entry-card .ph img{width:100%;height:100%;object-fit:cover;display:block;}
.entry-card .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;}
.entry-card .ph .noimg svg{width:70px;opacity:.75;}
.entry-card .body{padding:13px 16px 15px;display:flex;align-items:flex-start;gap:12px;}
.entry-card .date{
  font-family:var(--font-display);font-weight:900;color:var(--gold-deep);
  font-size:15px;line-height:1.35;flex:none;text-align:center;
  background:var(--cream-2);border-radius:14px;padding:7px 11px;
}
.entry-card .date b{display:block;font-size:24px;line-height:1;}
.entry-card .meta{min-width:0;flex:1;}
.entry-card .place{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-card .who{font-size:13.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-card .rate{color:var(--gold);font-size:15px;letter-spacing:2px;margin-top:2px;}

.empty{text-align:center;padding:38px 20px 30px;}
.empty svg{width:118px;animation:dressSway 4s ease-in-out infinite;}
.empty p{font-family:var(--font-display);font-weight:700;color:var(--gold-deep);font-size:18px;margin:16px 0 6px;}
.empty small{color:var(--ink-soft);font-size:14px;}

.backup{text-align:center;margin:26px 0 6px;font-size:13px;color:var(--ink-soft);}
.backup button{text-decoration:underline;color:var(--ink-soft);font-size:13px;padding:6px 8px;}

/* ============================================================
   7. アルバム（そのまま）
   ============================================================ */
.mag{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.mag figure{
  position:relative;margin:0;border-radius:20px;overflow:hidden;background:var(--cream-2);
  box-shadow:0 8px 20px rgba(190,143,40,.16);animation:cardIn .5s cubic-bezier(.22,.9,.28,1) both;
}
.mag figure img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.8,.3,1);}
.mag figure:active img{transform:scale(1.06);}
.mag .hero{grid-column:1 / -1;aspect-ratio:3/2;}
.mag .tall{aspect-ratio:3/4;}
.mag .sq{aspect-ratio:1/1;}
.mag figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:22px 13px 11px;
  background:linear-gradient(180deg,transparent,rgba(76,56,10,.62));
  color:#FFF9E8;display:flex;align-items:baseline;gap:8px;
}
.mag figcaption .d{font-size:11px;letter-spacing:.2em;font-weight:700;opacity:.92;}
.mag figcaption .p{font-family:var(--font-display);font-weight:700;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mag-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 16px;}
.mag-head .n{font-family:var(--font-display);font-weight:900;font-size:34px;color:var(--gold);line-height:1;}
.mag-head .l{font-size:13px;color:var(--ink-soft);letter-spacing:.14em;}

/* ============================================================
   8. タブバー
   ============================================================ */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(255,252,243,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1.5px solid rgba(227,174,60,.2);
  display:flex;gap:6px;
}
#tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 5px;border-radius:18px;color:var(--ink-soft);
  font-family:var(--font-display);font-weight:700;font-size:12px;
  transition:color .22s, background .22s, transform .18s;
}
#tabbar button svg{width:26px;height:26px;transition:transform .3s cubic-bezier(.2,1.5,.4,1);}
#tabbar button.active{color:var(--gold-deep);background:var(--butter);}
#tabbar button.active svg{transform:translateY(-2px) scale(1.12);}
#tabbar button:active{transform:scale(.94);}

/* ============================================================

<script>
"use strict";
/* ============================================================
   A. 小さな道具たち
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const WEEK = ["日","月","火","水","木","金","土"];
const pad2 = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtLong  = s => { const d = parseDate(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WEEK[d.getDay()]}）`; };
const fmtShort = s => { const d = parseDate(s); return {my:`${d.getMonth()+1}月`, day:d.getDate(), w:WEEK[d.getDay()]}; };
const fmtMag   = s => { const d = parseDate(s); return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())}`; };
const escapeHtml = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ============================================================
   B. 季節の空気
   ============================================================ */
const SEASONS = {
  spring:{cls:"s-spring", badge:"🌸 春", motifs:["🌸","🌷","💛","✨","💗","⭐️"]},
  summer:{cls:"s-summer", badge:"🌻 夏", motifs:["🌻","🐚","💛","✨","💗","⭐️"]},
  autumn:{cls:"s-autumn", badge:"🍁 秋", motifs:["🍁","🌰","💛","✨","💗","⭐️"]},
  winter:{cls:"s-winter", badge:"❄️ 冬", motifs:["❄️","⛄️","💛","✨","💗","⭐️"]}
};
function seasonKey(m){ return m<=2||m===12 ? "winter" : m<=5 ? "spring" : m<=8 ? "summer" : "autumn"; }

function applySeason(){
  const s = SEASONS[seasonKey(new Date().getMonth()+1)];
  document.body.className = s.cls;
  $("#seasonBadge").textContent = s.badge;
  const box = $("#ambient");
  box.innerHTML = "";
  for(let i=0;i<18;i++){
    const el = document.createElement("span");
    el.textContent = s.motifs[i % s.motifs.length];
    el.style.left = (Math.random()*96+1).toFixed(1)+"%";
    el.style.fontSize = (11 + Math.random()*15).toFixed(0)+"px";
    el.style.animationDuration = (17 + Math.random()*16).toFixed(1)+"s";
    el.style.animationDelay = (-Math.random()*30).toFixed(1)+"s";
    box.appendChild(el);
  }
}
function buildBurst(){
  const box = $("#burst");
  const marks = ["✨","⭐️","💫","💗","✨","⭐️","💛","✨","💫","💗"];
  marks.forEach((m,i)=>{
    const ang = (i/marks.length)*Math.PI*2 + 0.3;
    const dist = 96 + Math.random()*74;
    const el = document.createElement("i");
    el.textContent = m;
    el.style.setProperty("--bx", (Math.cos(ang)*dist).toFixed(0)+"px");
    el.style.setProperty("--by", (Math.sin(ang)*dist).toFixed(0)+"px");
    el.style.animationDelay = (0.35 + i*0.045)+"s";
    box.appendChild(el);
  });
}

/* ============================================================
   C. データの保管（IndexedDB）
   ============================================================ */
const DB_NAME = "coordeDiary", STORE = "entries";
let db = null, entries = [], byDate = new Map();

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, {keyPath:"id"});
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function tx(mode){ return db.transaction(STORE, mode).objectStore(STORE); }
function dbAll(){
  return new Promise((res, rej)=>{ const r = tx("readonly").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
}
function dbPut(v){
  return new Promise((res, rej)=>{ const r = tx("readwrite").put(v); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
function dbDel(id){
  return new Promise((res, rej)=>{ const r = tx("readwrite").delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
}
async function reload(){
  entries = await dbAll();
  entries.sort((a,b)=> a.date === b.date ? (a.createdAt||0)-(b.createdAt||0) : (a.date < b.date ? 1 : -1));
  byDate = new Map();
  entries.forEach(e=>{
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
}

/* ============================================================
   D. 写真（自動で軽くする）
   ============================================================ */
const MAX_PHOTOS = 5, MAX_SIDE = 1280, TARGET_BYTES = 380000;

async function loadBitmap(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {imageOrientation:"from-image"}); }catch(e){}
  }
  return await new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("読み込めませんでした")); };
    img.src = url;
  });
}
async function compress(file){
  const src = await loadBitmap(file);
  const sw = src.width, sh = src.height;
  const scale = Math.min(1, MAX_SIDE / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*scale)), h = Math.max(1, Math.round(sh*scale));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(src, 0, 0, w, h);
  if(src.close) src.close();
  let q = 0.84, url = cv.toDataURL("image/jpeg", q);
  while(url.length > TARGET_BYTES && q > 0.46){ q -= 0.09; url = cv.toDataURL("image/jpeg", q); }
  return url;
}

/* ============================================================
   E. カレンダー（ホーム画面）
   ============================================================ */
let viewY, viewM;   // 表示している年・月（0はじまり）

function setMonth(y, m){
  viewY = y; viewM = m;
  renderCalendar();
}
function renderCalendar(){
  const now = new Date();
  const isThis = (viewY === now.getFullYear() && viewM === now.getMonth());
  $("#calTitle").innerHTML = `${viewY}年 ${viewM+1}月<small>${["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"][viewM]}</small>`;
  $("#toToday").hidden = isThis;

  const first = new Date(viewY, viewM, 1);
  const lead = first.getDay();
  const days = new Date(viewY, viewM+1, 0).getDate();
  const t = todayStr();

  let html = "";
  for(let i=0;i<lead;i++) html += `<div class="pad"></div>`;
  for(let d=1; d<=days; d++){
    const ds = `${viewY}-${pad2(viewM+1)}-${pad2(d)}`;
    const list = byDate.get(ds) || [];
    const wd = new Date(viewY, viewM, d).getDay();
    const photo = list.flatMap(e=>e.photos||[])[0];
    const maxStar = list.reduce((a,e)=>Math.max(a, e.stars||0), 0);
    const cls = ["day"];
    if(list.length) cls.push("has");
    if(ds === t) cls.push("today");
    if(wd === 0) cls.push("sun"); if(wd === 6) cls.push("sat");
    const mark = list.length ? (maxStar ? "★" : "•") : "";
    html += `<button class="${cls.join(" ")}" data-date="${ds}" style="animation-delay:${Math.min(d*10,260)}ms">
      ${photo ? `<img src="${photo}" alt=""><div class="veil"></div>` : ""}
      ${(!photo && list.length) ? `<svg class="dress" viewBox="0 0 200 240"><use href="#ico-dress"/></svg>` : ""}
      <span class="dnum">${d}</span>
      <span class="mk">${mark}</span>
    </button>`;
  }
  $("#calGrid").innerHTML = html;
  $$("#calGrid .day").forEach(b => b.onclick = ()=>onDayTap(b.dataset.date));

  renderStats(days);
}
function renderStats(daysInMonth){
  const pre = `${viewY}-${pad2(viewM+1)}-`;
  const list = entries.filter(e => e.date.startsWith(pre));
  const dayset = new Set(list.map(e=>e.date));
  const photos = list.reduce((a,e)=>a+(e.photos||[]).length, 0);
  const fav = list.filter(e=>(e.stars||0) === 5).length;
  $("#statTitle").textContent = `${viewM+1}月の記録`;
  $("#stDays").textContent = dayset.size;
  $("#stPhotos").textContent = photos;
  $("#stFav").textContent = fav;
}
function onDayTap(ds){
  const list = byDate.get(ds) || [];
  if(list.length) openSheet(ds);
  else openWrite(ds, null);
}

/* ============================================================
   F. 入力フォーム
   ============================================================ */
let draft = { id:null, photos:[], stars:0 };
const STAR_WORDS = ["タップで選べます","記録できたね😊","いい感じ🌼","お気に入り✨","とっても素敵💛","最高のコーデ🌟"];

function setDate(v){
  $("#fDate").value = v;
  $("#dateText").textContent = fmtLong(v);
}
function renderStars(){
  $$("#fStars button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) <= draft.stars));
  $("#starsNote").textContent = STAR_WORDS[draft.stars];
}
function renderThumbs(){
  const box = $("#thumbs"), n = draft.photos.length;
  box.hidden = n === 0;
  $("#photoCount").hidden = n === 0;
  $("#photoCount").textContent = `${n} / ${MAX_PHOTOS}枚`;
  $("#photoAdd").classList.toggle("is-full", n >= MAX_PHOTOS);
  box.innerHTML = draft.photos.map((src,i)=>
    `<div class="thumb"><img src="${src}" alt="コーデ写真${i+1}"><button class="del" data-i="${i}" aria-label="削除">✕</button></div>`
  ).join("");
}
/* 新規（e=null）でも 編集（e=記録）でも、この1つで開きます */
function openWrite(dateStr, e){
  if(e){
    draft = { id:e.id, photos:[...(e.photos||[])], stars:e.stars||0 };
    setDate(e.date);
    $("#fPlace").value = e.place || ""; $("#fWho").value = e.who || ""; $("#fMemo").value = e.memo || "";
    $("#writeTitle").textContent = "きろくをなおす";
    $("#writeLead").textContent = "この日の記録を直しています📝";
    $("#saveLabel").textContent = "この記録を上書きする";
  }else{
    draft = { id:null, photos:[], stars:0 };
    setDate(dateStr || todayStr());
    $("#fPlace").value = ""; $("#fWho").value = ""; $("#fMemo").value = "";
    const isToday = (dateStr || todayStr()) === todayStr();
    $("#writeTitle").textContent = isToday ? "今日のきろく" : "この日のきろく";
    $("#writeLead").textContent = "30秒でおしまい。気軽に残そう😊";
    $("#saveLabel").textContent = "この日を保存する";
  }
  renderStars(); renderThumbs(); renderSuggestChips();
  switchTab("write");
}

function renderSuggestChips(){
  const pick = key => {
    const seen = [];
    for(const e of entries){
      const v = (e[key]||"").trim();
      if(v && !seen.includes(v)) seen.push(v);
      if(seen.length >= 6) break;
    }
    return seen;
  };
  const fill = (boxSel, list, inputSel, fallback) => {
    const use = list.length ? list : fallback;
    $(boxSel).innerHTML = use.map(v=>`<button class="chip" type="button">${escapeHtml(v)}</button>`).join("");
    $$(boxSel + " .chip").forEach(b => b.onclick = () => { $(inputSel).value = b.textContent; });
  };
  fill("#placeChips", pick("place"), "#fPlace", ["おうち","お仕事","おでかけ","カフェ","お買い物"]);
  fill("#whoChips",   pick("who"),   "#fWho",   ["景一さん","ひとり","お友だち","家族"]);
}

async function save(){
  const date = $("#fDate").value || todayStr();
  const rec = {
    id: draft.id || ("e_" + Date.now() + "_" + Math.random().toString(36).slice(2,7)),
    date,
    place: $("#fPlace").value.trim(),
    who:   $("#fWho").value.trim(),
    memo:  $("#fMemo").value.trim(),
    stars: draft.stars,
    photos: draft.photos,
    createdAt: draft.id ? (entries.find(e=>e.id===draft.id)?.createdAt || Date.now()) : Date.now(),
    updatedAt: Date.now()
  };
  const wasEdit = !!draft.id;
  try{
    await dbPut(rec);
  }catch(err){
    toast("保存できませんでした。写真を減らしてみてね");
    return;
  }
  await reload();
  const d = parseDate(date);
  setMonth(d.getFullYear(), d.getMonth());
  renderAlbum(); renderSearch();
  celebrate(wasEdit);
}

/* ============================================================
   G. ごほうび演出
   ============================================================ */
const cv = $("#confetti"), cx = cv.getContext("2d");
let pieces = [], animId = null;

function sizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", sizeCanvas);

function drawStar(x,y,r,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.beginPath();
  for(let i=0;i<8;i++){
    const a = Math.PI/4*i - Math.PI/2, rad = i%2 ? r*0.34 : r;
    i ? cx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad) : cx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad);
  }
  cx.closePath(); cx.fill(); cx.restore();
}
function drawHeart(x,y,r,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot); cx.scale(r/12, r/12); cx.beginPath();
  cx.moveTo(0,4);
  cx.bezierCurveTo(-11,-5,-7,-13,0,-7);
  cx.bezierCurveTo(7,-13,11,-5,0,4);
  cx.closePath(); cx.fill(); cx.restore();
}
function celebrate(wasEdit){
  const p = $("#praise");
  $("#praiseSub").textContent = wasEdit ? "書き直せました✨" : "きろくできました✨";
  p.classList.add("on"); cv.classList.add("on");

  sizeCanvas();
  const colors = ["#E3AE3C","#FFDF8E","#FFFFFF","#F6B8C6","#FFE9A8","#D69A20"];
  pieces = [];
  for(let i=0;i<120;i++){
    pieces.push({
      x: innerWidth*(0.15+Math.random()*0.7),
      y: innerHeight*0.42 - Math.random()*40,
      vx: (Math.random()-0.5)*7.4,
      vy: -3.6 - Math.random()*8.6,
      g: 0.19 + Math.random()*0.09,
      r: 4 + Math.random()*7,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.28,
      c: colors[i % colors.length],
      shape: i%7===0 ? "heart" : i%3===0 ? "star" : "rect"
    });
  }
  cancelAnimationFrame(animId);
  const start = performance.now();
  (function loop(now){
    const t = now - start;
    cx.clearRect(0,0,innerWidth,innerHeight);
    pieces.forEach(o=>{
      o.vy += o.g; o.x += o.vx; o.y += o.vy; o.vx *= 0.995; o.rot += o.vr;
      cx.globalAlpha = Math.max(0, 1 - t/2400);
      cx.fillStyle = o.c;
      if(o.shape === "rect"){
        cx.save(); cx.translate(o.x,o.y); cx.rotate(o.rot);
        cx.fillRect(-o.r*0.6, -o.r*0.32, o.r*1.2, o.r*0.64); cx.restore();
      } else if(o.shape === "star"){ drawStar(o.x,o.y,o.r,o.rot); }
      else { drawHeart(o.x,o.y,o.r*1.25,o.rot*0.5); }
    });
    cx.globalAlpha = 1;
    if(t < 2400) animId = requestAnimationFrame(loop);
    else cx.clearRect(0,0,innerWidth,innerHeight);
  })(start);

  setTimeout(()=>{
    p.classList.remove("on"); cv.classList.remove("on");
    switchTab("cal");
  }, 2100);
}

/* ============================================================
   H. 場所でさがす
   ============================================================ */
let searchWord = "";
function renderSearch(){
  const box = $("#cards"), note = $("#resultNote");
  if(!searchWord){ box.innerHTML = ""; note.textContent = ""; return; }
  const list = entries.filter(e => (e.place||"").toLowerCase().includes(searchWord.toLowerCase()));
  note.textContent = `「${searchWord}」の記録 ${list.length}件`;
  if(!list.length){
    box.innerHTML = `<div class="empty"><svg viewBox="0 0 200 240"><use href="#ico-dress"/></svg>
      <p>見つかりませんでした</p><small>ちがう言葉でも さがしてみてね😊</small></div>`;
    return;
  }
  box.innerHTML = list.map((e,i)=>{
    const d = fmtShort(e.date);
    const n = (e.photos||[]).length;
    const ph = n
      ? `<img src="${e.photos[0]}" alt="${escapeHtml(e.place||"コーデ")}の写真" loading="lazy">`
      : `<div class="noimg"><svg viewBox="0 0 200 240"><use href="#ico-dress"/></svg></div>`;
    return `<button class="entry-card" data-date="${e.date}" style="animation-delay:${Math.min(i*45,420)}ms">
      <div class="ph">${ph}</div>
      <div class="body">
        <div class="date">${d.my}<b>${d.day}</b>${d.w}</div>
        <div class="meta">
          <div class="place">${escapeHtml(e.place || "おうち時間")}</div>
          <div class="who">${escapeHtml(e.who ? "😊 " + e.who : "　")}</div>
          <div class="rate">${e.stars ? "★".repeat(e.stars) : ""}</div>
        </div>
      </div>
    </button>`;
  }).join("");
  $$("#cards .entry-card").forEach(b => b.onclick = ()=>openSheet(b.dataset.date));
}

/* ============================================================
   I. アルバム
   ============================================================ */
function allPhotos(){
  const out = [];
  entries.forEach(e => (e.photos||[]).forEach((src,i)=> out.push({src, date:e.date, place:e.place, id:e.id, i})));
  return out;
}
function renderAlbum(){
  const photos = allPhotos(), box = $("#mag"), empty = $("#albumEmpty");
  $("#albumCount").textContent = photos.length ? photos.length : "";
  $("#albumLead").textContent = photos.length ? "写真をぜんぶ、雑誌みたいに" : "写真を入れると、ここに並びます";
  if(!photos.length){
    box.innerHTML = "";
    empty.innerHTML = `<div class="empty"><svg viewBox="0 0 200 240"><use href="#ico-dress"/></svg>
      <p>アルバムは まだ空っぽ</p><small>写真つきで記録すると、ここに並びます📷</small></div>`;
    return;
  }
  empty.innerHTML = "";
  const shape = i => { const m = i % 5; return m===0 ? "hero" : (m===1||m===2) ? "tall" : "sq"; };
  box.innerHTML = photos.map((p,i)=>`
    <figure class="${shape(i)}" data-id="${p.id}" data-i="${p.i}" style="animation-delay:${Math.min(i*40,500)}ms">
      <img src="${p.src}" alt="${escapeHtml(p.place||"コーデ")}の写真" loading="lazy">
      ${shape(i)==="sq" ? "" : `<figcaption><span class="d">${fmtMag(p.date)}</span><span class="p">${escapeHtml(p.place||"")}</span></figcaption>`}
    </figure>`).join("");
  $$("#mag figure").forEach(f => f.onclick = ()=> openLightbox(f.dataset.id, Number(f.dataset.i)));
}

/* ============================================================
   J. その日の詳細シート
   ============================================================ */
function openSheet(ds){
  const list = byDate.get(ds) || [];
  if(!list.length) return;

  const blocks = list.map((e, bi)=>{
    const photos = e.photos || [];
    return `<div class="entry-block">
      ${photos.length ? `
        <div class="swiper" id="sw${bi}">
          ${photos.map((s,i)=>`<div><img src="${s}" alt="コーデ写真${i+1}"></div>`).join("")}
        </div>
        ${photos.length>1 ? `<div class="dots" id="dt${bi}">${photos.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>` : `<div style="height:8px"></div>`}
      ` : ""}
      ${bi===0 ? `<h3>${fmtLong(e.date)}</h3>` : `<h3 style="font-size:17px">この日のもう1つの記録</h3>`}
      <div class="s-rate">${e.stars ? "★".repeat(e.stars) + "☆".repeat(5-e.stars) : "☆☆☆☆☆"}</div>
      <div class="s-row"><span>📍 場所</span><span>${escapeHtml(e.place || "—")}</span></div>
      <div class="s-row"><span>😊 会った人</span><span>${escapeHtml(e.who || "—")}</span></div>
      ${e.memo ? `<div class="s-memo">${escapeHtml(e.memo)}</div>` : ""}
      <div class="sheet-actions">
        <button class="btn-edit" data-edit="${e.id}">なおす</button>
        <button class="btn-del" data-del="${e.id}">削除する</button>
      </div>
    </div>`;
  }).join("");

  $("#sheet").innerHTML = `<div class="grip"></div>${blocks}
    <button class="sheet-add" data-add="${ds}">＋ この日にもう1つ記録する</button>`;
  $("#sheet").classList.add("open");
  $("#backdrop").classList.add("open");

  list.forEach((e, bi)=>{
    const sw = $("#sw"+bi); if(!sw) return;
    sw.onclick = () => openLightbox(e.id, Math.round(sw.scrollLeft / sw.clientWidth));
    const dots = $$("#dt"+bi+" i");
    if(dots.length){
      sw.onscroll = () => {
        const idx = Math.round(sw.scrollLeft / sw.clientWidth);
        dots.forEach((d,i)=> d.classList.toggle("on", i===idx));
      };
    }
  });
  $$("#sheet [data-edit]").forEach(b => b.onclick = ()=>{
    const e = entries.find(x=>x.id===b.dataset.edit);
    closeSheet(); if(e) openWrite(e.date, e);
  });
  $$("#sheet [data-del]").forEach(b => b.onclick = async ()=>{
    if(!confirm("この記録を削除します。よろしいですか？")) return;
    await dbDel(b.dataset.del); await reload();
    closeSheet(); renderCalendar(); renderAlbum(); renderSearch(); toast("削除しました");
  });
  $("#sheet [data-add]").onclick = ()=>{ closeSheet(); openWrite(ds, null); };
}
function closeSheet(){
  $("#sheet").classList.remove("open");
  $("#backdrop").classList.remove("open");
}

function openLightbox(id, index){
  const e = entries.find(x=>x.id===id); if(!e) return;
  const photos = e.photos || []; if(!photos.length) return;
  $("#lbSwiper").innerHTML = photos.map((s,i)=>`<div><img src="${s}" alt="コーデ写真${i+1}"></div>`).join("");
  $("#lbCap").textContent = `${fmtMag(e.date)}　${e.place||""}`;
  $("#lightbox").classList.add("open");
  requestAnimationFrame(()=>{
    const sw = $("#lbSwiper");
    sw.scrollLeft = sw.clientWidth * (index||0);
  });
}
$("#lbClose").onclick = ()=> $("#lightbox").classList.remove("open");

/* ============================================================
   K. バックアップ
   ============================================================ */
function exportJSON(){
  if(!entries.length){ toast("まだ記録がありません"); return; }
  const blob = new Blob([JSON.stringify({app:"coorde-diary", version:2, entries}, null, 0)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `コーデ日記_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("書き出しました💛");
}
async function importJSON(file){
  try{
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.entries;
    if(!Array.isArray(list)) throw new Error("形が違います");
    for(const e of list){
      if(!e || !e.id || !e.date) continue;
      await dbPut({photos:[], stars:0, ...e});
    }
    await reload(); renderCalendar(); renderAlbum(); renderSearch(); renderSuggestChips();
    toast(`${list.length}件 読み込みました✨`);
  }catch(err){
    toast("読み込めませんでした。ファイルを確かめてね");
  }
}

/* ============================================================
   L. 画面の切り替え
   ============================================================ */
function switchTab(name){
  $$("#tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  ["cal","write","album"].forEach(n => $("#view-"+n).classList.toggle("is-active", n === name));
  window.scrollTo({top:0, behavior:"instant"});
}

/* ============================================================
   M. 画面のイベント
   ============================================================ */
$$("#tabbar button").forEach(b => b.onclick = ()=>switchTab(b.dataset.tab));
$("#backdrop").onclick = closeSheet;

$("#prevM").onclick = ()=>{ const d = new Date(viewY, viewM-1, 1); setMonth(d.getFullYear(), d.getMonth()); };
$("#nextM").onclick = ()=>{ const d = new Date(viewY, viewM+1, 1); setMonth(d.getFullYear(), d.getMonth()); };
$("#toToday").onclick = ()=>{ const n = new Date(); setMonth(n.getFullYear(), n.getMonth()); };
$("#todayBtn").onclick = ()=>{
  const t = todayStr();
  const list = byDate.get(t) || [];
  if(list.length) openSheet(t); else openWrite(t, null);
};

const onDate = e => setDate(e.target.value || todayStr());
$("#fDate").onchange = onDate;
$("#fDate").oninput  = onDate;

$$("#fStars button").forEach(b => b.onclick = () => {
  const v = Number(b.dataset.v);
  draft.stars = (draft.stars === v) ? v-1 : v;
  renderStars();
  b.classList.add("pop");
  setTimeout(()=>b.classList.remove("pop"), 220);
});

$("#photoAdd").onclick = () => {
  if(draft.photos.length >= MAX_PHOTOS){ toast("写真は5枚までだよ😊"); return; }
  $("#fPhotos").click();
};
$("#fPhotos").onchange = async e => {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
  e.target.value = "";
  if(!files.length) return;
  const room = MAX_PHOTOS - draft.photos.length;
  if(files.length > room) toast(`あと${room}枚まで入ります`);
  const add = files.slice(0, room);
  $("#photoAdd").textContent = "軽くしています…";
  for(const f of add){
    try{ draft.photos.push(await compress(f)); }
    catch(err){ toast("この写真は読み込めませんでした"); }
  }
  $("#photoAdd").innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>写真をえらぶ`;
  renderThumbs();
};
$("#thumbs").onclick = e => {
  const btn = e.target.closest(".del"); if(!btn) return;
  draft.photos.splice(Number(btn.dataset.i), 1);
  renderThumbs();
};

$("#saveBtn").onclick = save;
$("#cancelEdit").onclick = () => switchTab("cal");

$("#sPlace").oninput = e => { searchWord = e.target.value.trim(); renderSearch(); };

$("#btnExport").onclick = exportJSON;
$("#btnImport").onclick = ()=> $("#fImport").click();
$("#fImport").onchange = e => { const f = e.target.files[0]; e.target.value=""; if(f) importJSON(f); };

/* ホーム画面追加のための manifest */
(function addManifest(){
  try{
    const base = location.href.split("?")[0].split("#")[0];
    const icon = new URL("coorde-diary-icon.png", base).href;
    const m = {
      name:"幸恵ちゃんのコーディネート日記", short_name:"コーデ日記",
      start_url: base, scope: base.replace(/[^/]*$/, ""), display:"standalone",
      background_color:"#FFFBF0", theme_color:"#FFE9A8", lang:"ja",
      icons:[
        {src:icon, sizes:"1024x1024", type:"image/png", purpose:"any"},
        {src:icon, sizes:"1024x1024", type:"image/png", purpose:"maskable"}
      ]
    };
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:"application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){}
})();

/* ============================================================
   N. はじまり
   ============================================================ */
(async function init(){
  applySeason();
  buildBurst();
  sizeCanvas();
  setDate(todayStr());
  renderStars();
  renderThumbs();

  try{
    db = await openDB();
    await reload();
  }catch(e){
    toast("データを開けませんでした");
  }
  const n = new Date();
  setMonth(n.getFullYear(), n.getMonth());
  renderSuggestChips();
  renderAlbum();

  const splash = $("#splash");
  const hide = ()=> splash.classList.add("hide");
  setTimeout(hide, 2400);
  splash.addEventListener("click", hide);
})();
</script>
