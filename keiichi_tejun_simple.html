<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>景一さん 11月18日の手順</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #f3f1ec; color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: 19px; line-height: 1.65;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 56px; }
  h1 { font-size: 26px; line-height: 1.35; margin: 0 0 4px; }
  .sub { font-size: 18px; color: #111; margin: 0 0 16px; }

  .tomaru {
    background: #fff; border: 5px solid #b3261e; border-radius: 16px;
    padding: 14px 16px; margin: 0 0 18px;
  }
  .tomaru .t1 { display: block; font-size: 22px; font-weight: 800; color: #8c1d18; line-height: 1.45; }
  .tomaru .t2 { display: block; font-size: 18px; font-weight: 700; margin-top: 6px; }

  .nokori { font-size: 19px; font-weight: 800; margin: 0 0 12px; }
  .kugiri { font-size: 19px; font-weight: 800; margin: 22px 0 8px; }

  .card {
    display: block; width: 100%; margin: 0 0 14px; padding: 16px;
    background: #fff; color: #111; border: 4px solid #111; border-radius: 18px;
    font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .card .ue { display: flex; align-items: center; gap: 14px; }
  .card .ban {
    flex: none; width: 64px; height: 64px; border-radius: 50%;
    background: #111; color: #fff; font-size: 36px; font-weight: 800; line-height: 64px; text-align: center;
  }
  .card .dai { flex: 1; min-width: 0; font-size: 23px; font-weight: 800; line-height: 1.4; }
  .card .naka { display: block; font-size: 19px; margin-top: 12px; line-height: 1.65; }
  .card .naka b { font-weight: 800; }
  .card .jotai {
    display: block; margin-top: 12px; padding-top: 10px; border-top: 2px dashed #555;
    font-size: 18px; font-weight: 700; color: #222;
  }

  /* ④ 売るカード */
  .card.uru { background: #fff1ee; border-color: #b3261e; border-width: 6px; }
  .card.uru .ban { background: #b3261e; }
  .card.uru .saki {
    display: block; background: #b3261e; color: #fff; font-size: 20px; font-weight: 800;
    border-radius: 12px; padding: 8px 12px; margin-bottom: 14px; text-align: center; line-height: 1.45;
  }

  /* ✓がついた時 */
  .card[aria-pressed="true"] { background: #cdebd8; border-color: #0b6b3a; }
  .card[aria-pressed="true"] .ban { background: #0b6b3a; color: #fff; }
  .card[aria-pressed="true"] .jotai { color: #0b4f2c; border-top-color: #0b6b3a; font-weight: 800; }
  .card.uru[aria-pressed="true"] .saki { background: #0b6b3a; }
  .card:focus-visible { outline: 4px solid #1a56c4; outline-offset: 3px; }

  .reset {
    display: block; margin: 22px auto 0; background: #fff; color: #111; font: inherit; font-size: 18px; font-weight: 700;
    border: 3px solid #111; border-radius: 999px; padding: 10px 22px; cursor: pointer;
  }
  .link { text-align: center; margin-top: 22px; }
  .link a { color: #0b4f2c; font-weight: 800; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>11月18日（水）の手順</h1>
  <p class="sub">景一さんの口座を、MacBookで。</p>

  <div class="tomaru">
    <span class="t1">設定がうまく出ない時は、売らずにやめてOK</span>
    <span class="t2">売ると税金が決まって、取り消せないからです。</span>
  </div>

  <p class="nokori" id="nokori" aria-live="polite"></p>

  <p class="kugiri">▼ 前の日までに</p>
  <button type="button" class="card" data-id="mae" data-n="前" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">前</span>
    <span class="dai">景一さんに伝えておく</span></span>
    <span class="naka">「水曜日に電話が来るよ」と伝える。</span>
    <span class="jotai"></span>
  </button>

  <p class="kugiri">▼ 11月18日（水）当日</p>

  <button type="button" class="card" data-id="s1" data-n="1" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">1</span>
    <span class="dai">ロックを解除する</span></span>
    <span class="naka">景一さんの携帯に電話が来る。<br>→ 6桁の数字を入れる。</span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="card" data-id="s2" data-n="2" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">2</span>
    <span class="dai">積立設定を作って、使い切り設定で 1,200,000円</span></span>
    <span class="naka">景一さんの口座に「毎月100円」などの小さな積立設定（NISAつみたて投資枠）を作る。<br>
    → 使い切り設定で <b>1,200,000円</b> を上乗せ。<br>
    <b>ボーナス設定は使わない。</b></span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="card" data-id="s3" data-n="3" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">3</span>
    <span class="dai">「変更」「解除」のボタンが出ているか確認</span></span>
    <span class="naka">設定ができたら画面で見る。<br>→ スクショをとる。</span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="card uru" data-id="s4" data-n="4" aria-pressed="false">
    <span class="saki">設定ができたのを確かめてから</span>
    <span class="ue"><span class="ban" aria-hidden="true">4</span>
    <span class="dai">特定口座のS&amp;P500を 約138万円分 売る</span></span>
    <span class="naka">「金額」で指定して売る。<br><b>注文は15時まで。</b></span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="card" data-id="s5" data-n="5" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">5</span>
    <span class="dai">注文が受け付けられたか確認</span></span>
    <span class="naka">「注文照会」の画面で見る。</span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="card" data-id="s6" data-n="6" aria-pressed="false">
    <span class="ue"><span class="ban" aria-hidden="true">6</span>
    <span class="dai">もう一度ロックする</span></span>
    <span class="naka">電話で6桁の数字。</span>
    <span class="jotai"></span>
  </button>

  <button type="button" class="reset" id="reset">チェックを全部はずす</button>

  <p class="link"><a href="keiichi_tsumitate_tejun.html">予定表や数字もあるページはこちら ▶</a></p>
</div>

<script>
(function () {
  var KEY = 'keiichi_tejun_simple_2026';
  var cards = document.querySelectorAll('.card');
  var nokori = document.getElementById('nokori');
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }
  function show(c, on) {
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
    c.querySelector('.ban').textContent = on ? '✓' : c.getAttribute('data-n');
    c.querySelector('.jotai').textContent = on ? '✓ おわり（もう一度タップで元にもどる）' : 'おわったら、ここをタップ';
  }
  function count() {
    var done = 0;
    for (var i = 0; i < cards.length; i++) if (cards[i].getAttribute('aria-pressed') === 'true') done++;
    nokori.textContent = done === cards.length
      ? '✓ 全部おわりました。おつかれさまでした。'
      : '✓ ' + done + ' / ' + cards.length + ' おわり';
  }
  for (var i = 0; i < cards.length; i++) {
    (function (c) {
      show(c, !!saved[c.getAttribute('data-id')]);
      c.addEventListener('click', function () {
        var on = c.getAttribute('aria-pressed') !== 'true';
        show(c, on);
        saved[c.getAttribute('data-id')] = on;
        save();
        count();
      });
    })(cards[i]);
  }
  count();
  document.getElementById('reset').addEventListener('click', function () {
    saved = {}; save();
    for (var i = 0; i < cards.length; i++) show(cards[i], false);
    count();
  });
})();
</script>
</body>
</html>
