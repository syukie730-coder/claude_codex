<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="経費精算">
<meta name="theme-color" content="#FFFFFF">
<title>経費精算</title>
<link rel="apple-touch-icon" href="keihi_seisan_icon.png">
<link rel="icon" type="image/png" href="keihi_seisan_favicon.png">
<style>
:root{
  --text:#111111;
  --sub:#222222;
  --line:#999999;
  --line-dark:#555555;
  --bg:#F4F5F7;
  --card:#FFFFFF;
  --main:#1F4E8C;
  --main-dark:#163A69;
  --danger:#B3261E;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  font-size:17px;
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
button, input, select{ font:inherit; color:var(--text); }

/* ===== 画面 ===== */
.top{
  background:#FFFFFF;
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
}
.top h1{ font-size:21px; font-weight:700; }
main{ max-width:640px; margin:0 auto; padding:16px; }
.box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px;
  margin-bottom:16px;
}
.box h2{ font-size:18px; font-weight:700; margin-bottom:10px; }
label.lbl{ display:block; font-size:16px; font-weight:700; margin-bottom:4px; }
input[type=text], input[type=date], input[type=month], input[type=tel], select{
  width:100%;
  min-height:48px;
  font-size:17px;
  padding:8px 10px;
  border:1px solid var(--line-dark);
  border-radius:6px;
  background:#FFFFFF;
  -webkit-appearance:none;
  appearance:none;
}
select{
  background-image:linear-gradient(45deg, transparent 50%, #111 50%), linear-gradient(135deg, #111 50%, transparent 50%);
  background-position:calc(100% - 18px) 50%, calc(100% - 12px) 50%;
  background-size:6px 6px, 6px 6px;
  background-repeat:no-repeat;
  padding-right:32px;
}
::placeholder{ color:#555555; opacity:1; }
input:focus, select:focus{ outline:3px solid #9DB8E0; outline-offset:0; }
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:52px;
  padding:10px 18px;
  font-size:17px; font-weight:700;
  border-radius:8px;
  border:1px solid var(--line-dark);
  background:#FFFFFF;
  cursor:pointer;
}
.btn:active{ background:#E6E8EC; }
.btn.main{ background:var(--main); border-color:var(--main); color:#FFFFFF; }
.btn.main:active{ background:var(--main-dark); }
.btn.danger{ color:var(--danger); border-color:var(--danger); }
.btn.wide{ width:100%; }
.btn:disabled{ background:#DDDDDD; border-color:#AAAAAA; color:#444444; }
.note{ font-size:16px; color:var(--sub); margin-top:8px; }

.month-row{ display:flex; gap:10px; align-items:flex-end; }
.month-row > div{ flex:1; }

/* 明細カード */
.row-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 14px 14px;
  margin-bottom:12px;
}
.row-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.row-no{ font-size:18px; font-weight:700; }
.row-head .btn{ min-height:44px; padding:6px 14px; font-size:16px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field{ margin-bottom:10px; }
.field:last-child{ margin-bottom:0; }
.yen-wrap{ position:relative; }
.yen-wrap input{ padding-right:34px; text-align:right; }
.yen-wrap span{ position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:17px; }
.pick{ margin-top:6px; }
.empty{ text-align:center; padding:24px 8px; font-size:17px; color:var(--sub); }
.count{ font-size:16px; color:var(--sub); text-align:right; margin:4px 0 10px; }

/* 精算表 */
.settle{ width:100%; border-collapse:collapse; font-size:17px; }
.settle th, .settle td{ border:1px solid var(--line-dark); padding:10px 10px; }
.settle thead th{ background:#EEF1F5; font-weight:700; text-align:center; }
.settle td.amt{ text-align:right; white-space:nowrap; width:9em; }
.settle tr.balance td{ font-weight:700; font-size:19px; background:#FFF8E1; border-top:2px solid var(--text); }

/* よく使う支払先 */
.fav-list{ list-style:none; margin-top:10px; }
.fav-list li{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; border-bottom:1px solid #DDDDDD; font-size:17px;
}
.fav-list li:last-child{ border-bottom:none; }
.fav-list .btn{ min-height:44px; padding:6px 14px; font-size:16px; }
.fav-add{ display:flex; gap:8px; }
.fav-add input{ flex:1; }

/* 保存した月 */
.saved-list{ list-style:none; }
.saved-list li{ border-bottom:1px solid #DDDDDD; }
.saved-list li:last-child{ border-bottom:none; }
.saved-list button{
  width:100%; min-height:52px; background:none; border:none; text-align:left;
  display:flex; justify-content:space-between; align-items:center;
  font-size:17px; padding:8px 4px; cursor:pointer;
}
.saved-list button:active{ background:#E6E8EC; }
.saved-list button span{ white-space:nowrap; }
.saved-list button{ flex-wrap:wrap; gap:0 12px; }
.saved-list .cur{ font-weight:700; }

/* 下の固定バー */
.bottom-bar{
  position:fixed; left:0; right:0; bottom:0;
  background:#FFFFFF;
  border-top:1px solid var(--line-dark);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bottom-inner{ max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
.total-area{ flex:1; }
.total-area .t-lbl{ font-size:16px; }
.total-area .t-val{ font-size:24px; font-weight:700; }
.bottom-inner .btn{ min-width:140px; }

/* ===== PDFができたときの画面 ===== */
#pdfPanel{
  display:none; position:fixed; inset:0; z-index:10;
  background:#FFFFFF; overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
#pdfPanel.show{ display:block; }
#pdfPanel .inner{ max-width:640px; margin:0 auto; }
#pdfPanel h2{ font-size:20px; font-weight:700; margin-bottom:8px; }
#pdfPanel .fname{ font-size:16px; margin-bottom:12px; word-break:break-all; }
#pdfPanel .btn{ margin-bottom:12px; text-decoration:none; color:var(--text); }
#pdfPanel .btn.main{ color:#FFFFFF; }
#pdfPanel .preview{ width:100%; border:1px solid var(--line-dark); margin:4px 0 16px; display:block; }
#pdfMsg{ font-size:16px; margin-bottom:12px; }
</style>
</head>
<body>

<div class="screen">
  <div class="top">
    <h1>経費精算請求書</h1>
  </div>

  <main>
    <!-- 月 -->
    <section class="box">
      <div class="month-row">
        <div>
          <label class="lbl" for="month">月</label>
          <input type="month" id="month">
        </div>
        <div style="flex:0 0 96px;">
          <label class="lbl" for="sheetNo">No.</label>
          <input type="tel" inputmode="numeric" id="sheetNo" maxlength="4">
        </div>
      </div>
      <p class="note">入力した内容は、この月の分として自動で保存されます。</p>
    </section>

    <!-- 明細 -->
    <section>
      <div class="count" id="count"></div>
      <div id="rows"></div>
      <button type="button" class="btn wide" id="addRow">＋ 行を追加する</button>
      <p class="note" id="maxNote" style="display:none;">行は50行までです。</p>
    </section>

    <div style="height:16px;"></div>

    <!-- 精算表 -->
    <section class="box">
      <h2>精算表</h2>
      <table class="settle">
        <thead><tr><th>項目</th><th>金額</th></tr></thead>
        <tbody>
          <tr><td>前渡金（院長からお預かり）</td><td class="amt" id="advView">10,000円</td></tr>
          <tr><td>経費合計</td><td class="amt" id="expView">0円</td></tr>
          <tr class="balance"><td>差引残高（院長へお返しする額）</td><td class="amt" id="balView">10,000円</td></tr>
        </tbody>
      </table>
    </section>

    <div style="height:16px;"></div>

    <!-- PDF -->
    <section class="box">
      <h2>PDF（ネットプリント用）</h2>
      <button type="button" class="btn main wide" id="pdfBtn2">PDFを作って共有する</button>
      <p class="note">A4縦1枚のPDFを作って、共有メニューを開きます。「ファイルに保存」や、ネットプリントのアプリを選んでください。</p>
    </section>

    <!-- よく使う支払先 -->
    <section class="box">
      <h2>よく使う支払先</h2>
      <div class="fav-add">
        <input type="text" id="favInput" placeholder="例：セブンイレブン" maxlength="30">
        <button type="button" class="btn" id="favAdd">登録</button>
      </div>
      <ul class="fav-list" id="favList"></ul>
    </section>

    <!-- 保存した月 -->
    <section class="box">
      <h2>保存した月</h2>
      <ul class="saved-list" id="savedList"></ul>
      <div style="height:12px;"></div>
      <button type="button" class="btn danger wide" id="clearMonth">表示中の月の内容をすべて消す</button>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <div class="total-area">
        <div class="t-lbl">合計</div>
        <div class="t-val" id="totalView">0円</div>
      </div>
      <button type="button" class="btn main" id="pdfBtn">PDFを作って<br>共有する</button>
    </div>
  </div>
</div>

<div id="pdfPanel" role="dialog" aria-label="PDF">
  <div class="inner">
    <h2>PDFができました</h2>
    <p class="fname" id="pdfName"></p>
    <p id="pdfMsg"></p>
    <button type="button" class="btn main wide" id="pdfShare">共有する（ファイルに保存・ネットプリント）</button>
    <a class="btn wide" id="pdfOpen" target="_blank" rel="noopener">PDFを新しいタブで開く</a>
    <a class="btn wide" id="pdfDownload">PDFをダウンロードする</a>
    <button type="button" class="btn wide" id="pdfClose">閉じる</button>
    <img class="preview" id="pdfPreview" alt="PDFの見本">
  </div>
</div>

<script>
(function(){
  'use strict';

  var STORE_KEY = 'keihi_seisan_v1';
  var MAX_ROWS = 50;
  var KAMOKU = ['消耗品費','会議費','旅費交通費','車両関係費','通信費','福利厚生費','交際費','租税公課',
                '支払手数料','諸会費','水道光熱費','図書研究費','広告宣伝費','衛生管理費','雑費','その他'];
  var ADVANCE = 10000;   // 前渡金（院長からお預かり）毎月固定
  var SETTLE = ['前渡金（院長からお預かり）', '経費合計', '差引残高（院長へお返しする額）'];
  var DEFAULT_FAVS = ['セブンイレブン','ローソン','ファミリーマート','Amazon','ダイソー','郵便局'];

  // ---------- 保存まわり ----------
  function load(){
    var data = null;
    try{ data = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
    if(!data || typeof data !== 'object') data = {};
    if(!data.months || typeof data.months !== 'object') data.months = {};
    if(!Array.isArray(data.favs)) data.favs = DEFAULT_FAVS.slice();
    return data;
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ alert('保存できませんでした。ブラウザの設定（プライベートブラウズなど）をご確認ください。'); }
  }

  var state = load();

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function thisMonth(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function lastDay(ym){ var p = ym.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }

  var month = state.current && /^\d{4}-\d{2}$/.test(state.current) ? state.current : thisMonth();

  function monthRows(){
    if(!state.months[month]) state.months[month] = { rows: [] };
    return state.months[month].rows;
  }

  // 全角数字やカンマを直して数字にする
  function toNumber(s){
    if(s === null || s === undefined) return 0;
    s = String(s).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
                 .replace(/[^0-9\-]/g, '');
    var n = parseInt(s, 10);
    return isNaN(n) ? 0 : n;
  }
  function yen(n){ return n.toLocaleString('ja-JP'); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function monthLabel(ym){ var p = ym.split('-'); return p[0] + '年' + (+p[1]) + '月'; }

  // ---------- 画面 ----------
  var $ = function(id){ return document.getElementById(id); };
  var rowsEl = $('rows');

  function total(){
    return monthRows().reduce(function(sum, r){ return sum + toNumber(r.amount); }, 0);
  }

  function updateTotal(){
    var t = total();
    $('totalView').textContent = yen(t) + '円';
    $('advView').textContent = yen(ADVANCE) + '円';
    $('expView').textContent = yen(t) + '円';
    $('balView').textContent = yen(ADVANCE - t) + '円';
    var n = monthRows().length;
    $('count').textContent = n + ' / ' + MAX_ROWS + ' 行';
    $('addRow').disabled = n >= MAX_ROWS;
    $('maxNote').style.display = n >= MAX_ROWS ? 'block' : 'none';
  }

  function favOptions(){
    var html = '<option value="">よく使う支払先から選ぶ</option>';
    state.favs.forEach(function(f){ html += '<option value="' + esc(f) + '">' + esc(f) + '</option>'; });
    return html;
  }

  function renderRows(){
    var rows = monthRows();
    var minD = month + '-01', maxD = month + '-' + pad(lastDay(month));
    if(rows.length === 0){
      rowsEl.innerHTML = '<div class="box empty">まだ入力がありません。<br>下の「＋ 行を追加する」を押してください。</div>';
      updateTotal();
      return;
    }
    var opts = favOptions();
    var html = '';
    rows.forEach(function(r, i){
      html +=
        '<div class="row-card" data-i="' + i + '">' +
          '<div class="row-head">' +
            '<span class="row-no">No.' + (i + 1) + '</span>' +
            '<button type="button" class="btn danger" data-act="del">この行を削除</button>' +
          '</div>' +
          '<div class="grid2 field">' +
            '<div><label class="lbl">日付</label>' +
              '<input type="date" data-k="date" value="' + esc(r.date) + '" min="' + minD + '" max="' + maxD + '"></div>' +
            '<div><label class="lbl">金額</label>' +
              '<div class="yen-wrap"><input type="tel" inputmode="numeric" data-k="amount" value="' + esc(r.amount ? yen(toNumber(r.amount)) : '') + '" placeholder="0"><span>円</span></div></div>' +
          '</div>' +
          '<div class="field"><label class="lbl">支払先</label>' +
            '<input type="text" data-k="payee" value="' + esc(r.payee) + '" maxlength="30">' +
            '<select class="pick" data-act="pick">' + opts + '</select></div>' +
          '<div class="field"><label class="lbl">内容・目的</label>' +
            '<input type="text" data-k="purpose" value="' + esc(r.purpose) + '" maxlength="50"></div>' +
        '</div>';
    });
    rowsEl.innerHTML = html;
    updateTotal();
  }

  function renderFavs(){
    var ul = $('favList');
    if(state.favs.length === 0){
      ul.innerHTML = '<li>登録はまだありません。</li>';
      return;
    }
    ul.innerHTML = state.favs.map(function(f, i){
      return '<li><span>' + esc(f) + '</span><button type="button" class="btn danger" data-fav="' + i + '">削除</button></li>';
    }).join('');
  }

  function renderSaved(){
    var keys = Object.keys(state.months).filter(function(k){
      return state.months[k].rows && state.months[k].rows.length > 0;
    });
    if(keys.indexOf(month) < 0) keys.push(month);
    keys.sort().reverse();
    $('savedList').innerHTML = keys.map(function(k){
      var rows = (state.months[k] && state.months[k].rows) || [];
      var t = rows.reduce(function(s, r){ return s + toNumber(r.amount); }, 0);
      return '<li><button type="button" data-month="' + k + '"' + (k === month ? ' class="cur"' : '') + '>' +
        '<span>' + monthLabel(k) + (k === month ? '（表示中）' : '') + '</span>' +
        '<span>' + rows.length + '件　' + yen(t) + '円</span></button></li>';
    }).join('');
  }

  function setMonth(ym){
    if(!/^\d{4}-\d{2}$/.test(ym)) return;
    // 空のまま離れた月は残さない
    if(state.months[month] && state.months[month].rows.length === 0) delete state.months[month];
    month = ym;
    state.current = ym;
    $('month').value = ym;
    $('sheetNo').value = (state.months[ym] && state.months[ym].no) || '1';
    save();
    renderRows();
    renderSaved();
    window.scrollTo(0, 0);
  }

  // ---------- 入力のできごと ----------
  rowsEl.addEventListener('input', function(e){
    var k = e.target.getAttribute('data-k');
    if(!k) return;
    var card = e.target.closest('.row-card');
    var i = +card.getAttribute('data-i');
    monthRows()[i][k] = e.target.value;
    save();
    if(k === 'amount') updateTotal();
  });

  // 金額はカンマ付きに整える
  rowsEl.addEventListener('blur', function(e){
    if(e.target.getAttribute('data-k') !== 'amount') return;
    var n = toNumber(e.target.value);
    var card = e.target.closest('.row-card');
    monthRows()[+card.getAttribute('data-i')].amount = n ? String(n) : '';
    e.target.value = n ? yen(n) : '';
    save();
    updateTotal();
    renderSaved();
  }, true);
  rowsEl.addEventListener('focus', function(e){
    if(e.target.getAttribute('data-k') !== 'amount') return;
    var n = toNumber(e.target.value);
    e.target.value = n ? String(n) : '';
  }, true);

  rowsEl.addEventListener('change', function(e){
    if(e.target.getAttribute('data-act') === 'pick'){
      var v = e.target.value;
      if(!v) return;
      var card = e.target.closest('.row-card');
      monthRows()[+card.getAttribute('data-i')].payee = v;
      card.querySelector('[data-k="payee"]').value = v;
      e.target.value = '';
      save();
    }
  });

  rowsEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-act="del"]');
    if(!b) return;
    var i = +b.closest('.row-card').getAttribute('data-i');
    var r = monthRows()[i];
    var hasData = r.date || r.amount || r.payee || r.purpose;
    if(hasData && !confirm('No.' + (i + 1) + ' の行を削除しますか？')) return;
    monthRows().splice(i, 1);
    save();
    renderRows();
    renderSaved();
  });

  $('addRow').addEventListener('click', function(){
    var rows = monthRows();
    if(rows.length >= MAX_ROWS) return;
    // 日付は、ひとつ前の行と同じ日を入れておく（今月なら今日）
    var d = '';
    if(rows.length > 0 && rows[rows.length - 1].date) d = rows[rows.length - 1].date;
    else if(todayStr().slice(0, 7) === month) d = todayStr();
    rows.push({ date: d, amount: '', payee: '', purpose: '' });
    save();
    renderRows();
    renderSaved();
    var cards = rowsEl.querySelectorAll('.row-card');
    var last = cards[cards.length - 1];
    if(last) last.scrollIntoView({ block: 'center' });
  });

  $('month').addEventListener('change', function(e){ setMonth(e.target.value); });
  $('sheetNo').addEventListener('input', function(e){
    if(!state.months[month]) state.months[month] = { rows: [] };
    state.months[month].no = e.target.value.replace(/[^0-9０-９]/g, '');
    save();
  });

  $('savedList').addEventListener('click', function(e){
    var b = e.target.closest('[data-month]');
    if(b) setMonth(b.getAttribute('data-month'));
  });

  $('clearMonth').addEventListener('click', function(){
    if(monthRows().length === 0) return;
    if(!confirm(monthLabel(month) + ' の内容をすべて消します。元には戻せません。よろしいですか？')) return;
    state.months[month].rows = [];
    save();
    renderRows();
    renderSaved();
  });

  // よく使う支払先
  $('favAdd').addEventListener('click', function(){
    var v = $('favInput').value.trim();
    if(!v) return;
    if(state.favs.indexOf(v) < 0) state.favs.push(v);
    $('favInput').value = '';
    save();
    renderFavs();
    renderRows();
  });
  $('favInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); $('favAdd').click(); }
  });
  $('favList').addEventListener('click', function(e){
    var b = e.target.closest('[data-fav]');
    if(!b) return;
    var i = +b.getAttribute('data-fav');
    if(!confirm('「' + state.favs[i] + '」を、よく使う支払先から外しますか？')) return;
    state.favs.splice(i, 1);
    save();
    renderFavs();
    renderRows();
  });

  // ---------- PDF ----------
  // 紙の用紙（A4縦）を、mm単位でキャンバスにかいて、1枚のPDFにする
  var DPI = 300;
  var MM = DPI / 25.4;                 // 1mmあたりの点の数
  var PT = 25.4 / 72;                  // 1ポイントは何mmか
  var FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","IPAGothic",sans-serif';

  // 紙の寸法（mm）
  var L = 11.5, R = 155;                                  // 明細の表の左右
  var COLS = [11.5, 18.1, 35.8, 56.8, 79.2, 115.4, 155];   // No｜日付｜科目｜金額｜支払先｜内容・目的
  var T_TOP = 32, H_BOTTOM = 38.5, ROW_H = 4.2;           // 表の上、見出しの下、1行の高さ（下に精算表を入れるため少しつめる）
  var ROWS_END = H_BOTTOM + ROW_H * MAX_ROWS;             // 50行目の下
  var T_BOTTOM = ROWS_END + 6.7;                           // 表の一番下
  var P_TOP = T_BOTTOM + 1.2, P_HEAD = 5, P_ROW = 5.2;    // 精算表（合計のすぐ下）の上、見出しの高さ、1行の高さ
  var P_K = 105;                                           // 精算表の項目と金額のさかい
  var S_L = 160.5, S_R = 197.5, S_K = 181.5;              // 右下の表の左・右・科目と金額のさかい
  var S_TOP = H_BOTTOM + ROW_H * 34;                      // 右下の表は35行目の高さから

  function drawSheet(){
    var cv = document.createElement('canvas');
    cv.width = Math.round(210 * MM);
    cv.height = Math.round(297 * MM);
    var c = cv.getContext('2d');
    c.fillStyle = '#FFFFFF';
    c.fillRect(0, 0, cv.width, cv.height);
    c.setTransform(MM, 0, 0, MM, 0, 0);   // ここから先は mm でかく
    c.fillStyle = '#000000';
    c.strokeStyle = '#000000';
    c.lineCap = 'butt';

    function font(pt, bold){ c.font = (bold ? 'bold ' : '') + (pt * PT).toFixed(3) + 'px ' + FONT; }
    function line(x1, y1, x2, y2, w){
      c.lineWidth = w || 0.25;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    }
    function rect(x1, y1, x2, y2, w){ c.lineWidth = w || 0.3; c.strokeRect(x1, y1, x2 - x1, y2 - y1); }
    function text(t, x, y, align, maxW){
      c.textAlign = align || 'left';
      c.textBaseline = 'middle';
      if(maxW) c.fillText(t, x, y, maxW); else c.fillText(t, x, y);
    }
    // 幅に入らない文は、まず1行のまま字を少し小さく（7ptまで）、それでも入らなければ横に少し縮める。
    // とても長い文だけ、2行に半分ずつ分ける
    function fitText(t, x, y, maxW){
      if(!t) return;
      for(var pt = 8.5; pt >= 7; pt -= 0.5){
        font(pt);
        if(c.measureText(t).width <= maxW){ text(t, x, y); return; }
      }
      if(c.measureText(t).width * 0.65 <= maxW){ text(t, x, y, 'left', maxW); return; }
      font(6.5);
      var half = c.measureText(t).width / 2, cut = 1;
      while(cut < t.length - 1 && c.measureText(t.slice(0, cut + 1)).width <= half) cut++;
      text(t.slice(0, cut), x, y - 1.05, 'left', maxW);
      text(t.slice(cut), x, y + 1.05, 'left', maxW);
    }
    // 文字を枠いっぱいに均等にならべる（消 耗 品 費 のように）
    function spread(t, x1, x2, y){
      var chars = t.split('');
      if(chars.length === 1){ text(t, (x1 + x2) / 2, y, 'center'); return; }
      var first = c.measureText(chars[0]).width / 2, last = c.measureText(chars[chars.length - 1]).width / 2;
      var step = (x2 - x1 - first - last) / (chars.length - 1);
      chars.forEach(function(ch, i){ text(ch, x1 + first + step * i, y, 'center'); });
    }

    var rows = monthRows();
    var mp = month.split('-');
    var no = (state.months[month] && state.months[month].no) || '1';

    // 上の段：左に年月、右に No.
    font(10.5);
    text(mp[0] + '. ' + (+mp[1]), (L + 35.5) / 2, 15.3, 'center');
    line(L, 17, 35.5, 17, 0.3);
    text('No. ' + no, R - 1, 15.3, 'right');
    line(116, 17, R, 17, 0.3);

    // 題名（文字の間をあけて、表のまん中に）
    font(15, true);
    var title = '経費精算請求書'.split('');
    var stepT = 15 * PT * 1.95;
    title.forEach(function(ch, i){ text(ch, (L + R) / 2 + (i - 3) * stepT, 22, 'center'); });

    // 【精算日】
    font(9);
    text('【精算日】', 114.5, 29.4, 'right');
    line(115, 31, R, 31, 0.3);

    // 明細の表：外わく、上は二重線（合計の行では、支払先と内容・目的は1つの枠）
    rect(L, T_TOP, R, T_BOTTOM, 0.45);
    line(L, T_TOP + 0.8, R, T_TOP + 0.8, 0.3);
    line(L, H_BOTTOM, R, H_BOTTOM, 0.3);
    for(var k = 1; k < COLS.length - 1; k++) line(COLS[k], T_TOP + 0.8, COLS[k], k < 5 ? T_BOTTOM : ROWS_END, 0.25);

    font(9);
    var heads = ['No', '日 付', '科 目', '金 額', '支払先', '内容・目的'];
    var hy = (T_TOP + 0.8 + H_BOTTOM) / 2;
    heads.forEach(function(h, i){ text(h, (COLS[i] + COLS[i + 1]) / 2, hy, 'center'); });

    // 50行
    var shownMonth = false;
    for(var i = 0; i < MAX_ROWS; i++){
      var r = rows[i] || {};
      var y = H_BOTTOM + ROW_H * i + ROW_H / 2;
      font(7.5);
      text(String(i + 1), (COLS[0] + COLS[1]) / 2, y, 'center');
      font(8.5);
      if(r.date){
        var dp = r.date.split('-');
        text((shownMonth ? '' : (+dp[1]) + '月') + (+dp[2]) + '日', COLS[2] - 1.5, y, 'right');
        shownMonth = true;
      }
      var amt = toNumber(r.amount);
      if(amt) text(yen(amt), COLS[4] - 4.8, y, 'right');
      text('円', COLS[4] - 0.8, y, 'right');
      fitText(r.payee || '', COLS[4] + 0.8, y, COLS[5] - COLS[4] - 1.6);
      fitText(r.purpose || '', COLS[5] + 0.8, y, COLS[6] - COLS[5] - 1.6);
    }

    // 左下の合計の行（上下とも二重線、斜めの線）
    line(L, ROWS_END, R, ROWS_END, 0.3);
    line(L, ROWS_END + 0.8, R, ROWS_END + 0.8, 0.3);
    line(L, T_BOTTOM - 0.8, R, T_BOTTOM - 0.8, 0.3);
    var fTop = ROWS_END + 0.8, fBot = T_BOTTOM - 0.8, fy = (fTop + fBot) / 2;
    line(COLS[0], fBot, COLS[1], fTop, 0.2);
    line(COLS[2], fBot, COLS[3], fTop, 0.2);
    line(COLS[4], fBot, COLS[6], fTop, 0.2);
    font(8.5);
    text('合計', (COLS[1] + COLS[2]) / 2, fy, 'center');
    text(yen(total()), COLS[4] - 5.8, fy, 'right');
    text('円', COLS[4] - 0.8, fy, 'right');

    // 右下の科目別の表
    rect(S_L, S_TOP, S_R, T_BOTTOM, 0.45);
    line(S_K, S_TOP, S_K, T_BOTTOM, 0.25);
    font(8);
    KAMOKU.forEach(function(kname, j){
      var top = S_TOP + ROW_H * j, cy = top + ROW_H / 2;
      if(j > 0) line(S_L, top, S_R, top, 0.2);
      spread(kname, S_L + 1, S_K - 1, cy);
    });
    line(S_L, ROWS_END, S_R, ROWS_END, 0.3);
    line(S_L, ROWS_END + 0.8, S_R, ROWS_END + 0.8, 0.3);
    font(9);
    spread('合計', S_L + 4, S_K - 4, (ROWS_END + 0.8 + T_BOTTOM) / 2);
    text('差額', (S_L + S_K) / 2, P_TOP + 2.2, 'center');

    // 精算表（項目｜金額、差引残高は太字）
    var t = total();
    var pVals = [ADVANCE, t, ADVANCE - t];
    var pEnd = P_TOP + P_HEAD + P_ROW * 3;
    rect(L, P_TOP, R, pEnd, 0.45);
    line(L, P_TOP + P_HEAD, R, P_TOP + P_HEAD, 0.3);
    line(P_K, P_TOP, P_K, pEnd, 0.25);
    font(9);
    text('項 目', (L + P_K) / 2, P_TOP + P_HEAD / 2, 'center');
    text('金 額', (P_K + R) / 2, P_TOP + P_HEAD / 2, 'center');
    SETTLE.forEach(function(name, j){
      var top = P_TOP + P_HEAD + P_ROW * j, cy = top + P_ROW / 2;
      var last = j === SETTLE.length - 1;
      if(j > 0) line(L, top, R, top, last ? 0.45 : 0.2);
      font(last ? 10 : 9, last);
      text(name, L + 2, cy, 'left');
      text(yen(pVals[j]) + '円', R - 2, cy, 'right');
    });

    return cv;
  }

  // JPEGの絵を1枚だけのせたA4のPDFを組み立てる
  function makePdf(jpeg, wPx, hPx, title){
    var enc = function(str){
      var out = new Uint8Array(str.length);
      for(var i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xFF;
      return out;
    };
    var hex16 = function(str){
      var h = 'FEFF';
      for(var i = 0; i < str.length; i++) h += ('000' + str.charCodeAt(i).toString(16).toUpperCase()).slice(-4);
      return '<' + h + '>';
    };
    var W = '595.28', H = '841.89';
    var content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
    var parts = [], offsets = [], len = 0;
    var push = function(u8){ parts.push(u8); len += u8.length; };
    var obj = function(n, body){ offsets[n] = len; push(enc(n + ' 0 obj\n' + body + '\nendobj\n')); };

    push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] ' +
           '/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4] = len;
    push(enc('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx +
             ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>\nstream\n'));
    push(jpeg);
    push(enc('\nendstream\nendobj\n'));
    obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
    obj(6, '<< /Title ' + hex16(title) + ' /Producer (keihi_seisan) >>');
    var xref = len, x = 'xref\n0 7\n0000000000 65535 f \n';
    for(var n = 1; n <= 6; n++) x += ('000000000' + offsets[n]).slice(-10) + ' 00000 n \n';
    push(enc(x + 'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF\n'));

    var all = new Uint8Array(len), pos = 0;
    parts.forEach(function(u8){ all.set(u8, pos); pos += u8.length; });
    return all;
  }

  var pdfFile = null, pdfUrl = null;

  function buildPdf(){
    var cv = drawSheet();
    var dataUrl = cv.toDataURL('image/jpeg', 0.92);
    var bin = atob(dataUrl.split(',')[1]);
    var jpeg = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) jpeg[i] = bin.charCodeAt(i);
    var name = '経費精算請求書_' + month;
    var bytes = makePdf(jpeg, cv.width, cv.height, name);
    cv.width = cv.height = 1;   // メモリをすぐ返す
    var blob = new Blob([bytes], { type: 'application/pdf' });
    try{ pdfFile = new File([blob], name + '.pdf', { type: 'application/pdf' }); }
    catch(e){ pdfFile = blob; pdfFile.name = name + '.pdf'; }
    if(pdfUrl) URL.revokeObjectURL(pdfUrl);
    pdfUrl = URL.createObjectURL(blob);
    return { name: name + '.pdf', preview: dataUrl };
  }

  function canShareFile(){
    try{
      return !!(navigator.share && navigator.canShare && pdfFile instanceof File &&
                navigator.canShare({ files: [pdfFile] }));
    }catch(e){ return false; }
  }

  function sharePdf(){
    if(!canShareFile()) return Promise.reject(new Error('cannot-share'));
    return navigator.share({ files: [pdfFile], title: pdfFile.name });
  }

  function showPanel(info){
    $('pdfName').textContent = 'ファイル名：' + info.name;
    $('pdfPreview').src = info.preview;
    $('pdfOpen').href = pdfUrl;
    $('pdfDownload').href = pdfUrl;
    $('pdfDownload').setAttribute('download', info.name);
    var ok = canShareFile();
    $('pdfShare').style.display = ok ? '' : 'none';
    $('pdfMsg').textContent = ok
      ? '共有メニューが出なかったときは、下の「共有する」を押してください。'
      : 'この画面では共有メニューが使えません。「PDFを新しいタブで開く」を押して、開いたPDFの共有ボタン（□に↑）から保存してください。';
    $('pdfPanel').classList.add('show');
    $('pdfPanel').scrollTop = 0;
  }

  function onMakePdf(){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    var info;
    try{ info = buildPdf(); }
    catch(e){ alert('PDFを作れませんでした。もう一度お試しください。'); return; }
    showPanel(info);
    // ボタンを押した流れのまま、すぐに共有メニューを開く
    if(canShareFile()){
      sharePdf().catch(function(err){
        if(err && err.name === 'AbortError') return;   // 自分で閉じたとき
        $('pdfMsg').textContent = '共有メニューを開けませんでした。下の「共有する」をもう一度押してください。';
      });
    }
  }

  $('pdfBtn').addEventListener('click', onMakePdf);
  $('pdfBtn2').addEventListener('click', onMakePdf);
  $('pdfShare').addEventListener('click', function(){
    sharePdf().catch(function(err){
      if(err && err.name === 'AbortError') return;
      $('pdfMsg').textContent = '共有メニューを開けませんでした。「PDFを新しいタブで開く」を使ってください。';
    });
  });
  $('pdfClose').addEventListener('click', function(){ $('pdfPanel').classList.remove('show'); });

  // ---------- はじめ ----------
  state.current = month;
  $('month').value = month;
  $('sheetNo').value = (state.months[month] && state.months[month].no) || '1';
  renderRows();
  renderFavs();
  renderSaved();
})();
</script>
</body>
</html>
