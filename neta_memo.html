<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ノートネタ帳">
<link rel="apple-touch-icon" sizes="180x180" href="neta-techo-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="neta-techo-icon-512.png">
<title>ノートネタ帳</title>
<style>
  :root{
    --bg:#FBF5EA;
    --card:#FFFDF8;
    --line:#EFE3D0;
    --text:#4A3B32;
    --sub:#8C7A6B;
    --terra:#D9825B;
    --terra-dark:#B9653F;
    --terra-pale:#F8E3D7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:17px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px)}
  header{text-align:center;margin:8px 0 20px}
  header .app{font-size:14px;color:var(--terra-dark);font-weight:700;letter-spacing:.1em}
  header h1{font-size:22px;margin:6px 0 0;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:20px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(150,110,80,.07)}
  .card h2{font-size:17px;margin:0 0 12px;color:var(--terra-dark)}
  label.lb{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
  label.lb:first-child{margin-top:0}
  input[type=text],textarea{width:100%;font-size:17px;font-family:inherit;color:var(--text);
    background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;
    -webkit-appearance:none}
  input[type=text]:focus,textarea:focus{border-color:var(--terra)}
  textarea{min-height:96px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--text);border-radius:999px;
    padding:9px 14px;font-size:15px;font-family:inherit;cursor:pointer}
  .chip.on{background:var(--terra);border-color:var(--terra);color:#fff;font-weight:700}
  .btn{display:block;width:100%;border:none;border-radius:16px;background:var(--terra);color:#fff;
    font-size:18px;font-weight:700;font-family:inherit;padding:15px;margin-top:18px;cursor:pointer;
    box-shadow:0 3px 0 var(--terra-dark)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--terra-dark)}
  .btn.sub{background:#fff;color:var(--terra-dark);border:1.5px solid var(--terra);box-shadow:none;
    font-size:16px;padding:13px;margin-top:10px}
  .hints{display:flex;flex-direction:column;gap:8px}
  .hint{text-align:left;border:none;background:var(--terra-pale);color:var(--text);border-radius:14px;
    padding:12px 14px;font-size:16px;font-family:inherit;cursor:pointer}
  .hint::before{content:"💡 "}
  .hint:active{background:#F2CDB8}
  .note{font-size:14px;color:var(--sub);margin:6px 0 0}
  .filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .filter .chip{flex:0 0 auto;font-size:14px;padding:7px 12px}
  .empty{text-align:center;color:var(--sub);padding:26px 0 18px}
  .empty .big{font-size:36px;display:block;margin-bottom:4px}
  .item{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .item .top{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
  .item .ttl{flex:1;font-weight:700;font-size:17px;word-break:break-word}
  .item .arrow{color:var(--terra-dark);font-size:13px;margin-top:3px;white-space:nowrap}
  .item .arrow::after{content:"ひらく"}
  .item.open .arrow::after{content:"とじる"}
  .meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:13px;color:var(--sub)}
  .tag{background:var(--terra-pale);color:var(--terra-dark);border-radius:999px;padding:1px 10px;font-weight:700}
  .body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .item.open .body{display:block}
  .memo{white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
  .memo.none{color:var(--sub)}
  .acts{display:flex;gap:8px}
  .acts button{flex:1;border-radius:12px;font-size:15px;font-family:inherit;padding:10px;cursor:pointer}
  .copy{background:#fff;border:1.5px solid var(--terra);color:var(--terra-dark)}
  .del{background:#fff;border:1.5px solid #D8B4A8;color:#A2523E}
  .count{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%) translateY(20px);
    background:var(--text);color:#fff;border-radius:999px;padding:10px 20px;font-size:15px;opacity:0;
    transition:all .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:.93;transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="app">📝 ノートのネタメモ</div>
    <h1>思いついたら、<br>ここにポンと残しておこう</h1>
  </header>

  <section class="card">
    <label class="lb" for="title">新しいネタ（タイトル）</label>
    <input type="text" id="title" placeholder="例：夜勤明けに見た朝焼け" autocomplete="off">

    <label class="lb" for="memo">メモ（あとで思い出すための一言でもOK）</label>
    <textarea id="memo" placeholder="そのとき感じたこと、ひとことでも大丈夫"></textarea>

    <label class="lb">カテゴリー（1つ選ぶ）</label>
    <div class="chips" id="cats"></div>

    <button class="btn" id="save">メモを保存する</button>
  </section>

  <section class="card">
    <h2>思いつかない時は、ここを押してみてね</h2>
    <div class="hints" id="hints"></div>
    <p class="note">押すと、タイトルに入ります。</p>
  </section>

  <section class="card">
    <h2>ためたネタ<span class="count" id="count"></span></h2>
    <div class="filter" id="filter"></div>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2>バックアップ</h2>
    <p class="note" style="margin-top:0">メモはこのiPhoneの中に保存されます。<br>ときどき「書き出す」で控えをとっておくと安心です。</p>
    <button class="btn sub" id="exportBtn">📤 バックアップを書き出す</button>
    <button class="btn sub" id="importBtn">📥 バックアップを読み込む</button>
    <input type="file" id="fileIn" accept=".json,application/json,text/plain">
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = "netaMemo_v1";
const CATS = ["日常・暮らし","仕事・病院","家族","お金・投資","簿記勉強","節約・家計","健康・自分磨き","その他"];
const HINTS = ["今日うれしかった小さなこと","仕事で感じたこと","家族との何気ない会話","お金で学んだこと","簿記の勉強でつまずいたところ","節約で工夫したこと","体や気持ちの変化"];

let memos = load();
let cat = CATS[0];
let filter = "すべて";
const $ = id => document.getElementById(id);

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
  catch(e){ return []; }
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(memos)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove("show"), 1800);
}
function fmt(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function renderCats(){
  $("cats").innerHTML = CATS.map(c =>
    `<button type="button" class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
$("cats").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c; renderCats();
});

$("hints").innerHTML = HINTS.map(h => `<button type="button" class="hint">${esc(h)}</button>`).join("");
$("hints").addEventListener("click", e => {
  const b = e.target.closest(".hint"); if(!b) return;
  $("title").value = b.textContent;
  $("title").scrollIntoView({behavior:"smooth", block:"center"});
  toast("タイトルに入れたよ");
});

$("save").addEventListener("click", () => {
  const title = $("title").value.trim();
  const memo = $("memo").value.trim();
  if(!title){ toast("タイトルを入れてね"); $("title").focus(); return; }
  memos.unshift({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), title, memo, cat, at: Date.now() });
  persist();
  $("title").value = ""; $("memo").value = "";
  filter = "すべて";
  render();
  toast("保存したよ");
});

function renderFilter(){
  const opts = ["すべて", ...CATS];
  $("filter").innerHTML = opts.map(c =>
    `<button type="button" class="chip${c===filter?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
$("filter").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  filter = b.dataset.c; render();
});

function render(){
  renderFilter();
  $("count").textContent = memos.length ? `${memos.length}こ` : "";
  const shown = filter === "すべて" ? memos : memos.filter(m => m.cat === filter);
  if(!shown.length){
    $("list").innerHTML = `<div class="empty"><span class="big">🌱</span>まだメモはないよ</div>`;
    return;
  }
  $("list").innerHTML = shown.map(m => `
    <div class="item" data-id="${esc(m.id)}">
      <div class="top">
        <div style="flex:1">
          <div class="ttl">${esc(m.title)}</div>
          <div class="meta"><span class="tag">${esc(m.cat)}</span><span>${fmt(m.at)}</span></div>
        </div>
        <span class="arrow"></span>
      </div>
      <div class="body">
        <p class="memo${m.memo?"":" none"}">${m.memo ? esc(m.memo) : "（メモはありません）"}</p>
        <div class="acts">
          <button type="button" class="copy">📋 コピー</button>
          <button type="button" class="del">🗑 消す</button>
        </div>
      </div>
    </div>`).join("");
}
$("list").addEventListener("click", async e => {
  const item = e.target.closest(".item"); if(!item) return;
  const m = memos.find(x => x.id === item.dataset.id); if(!m) return;
  if(e.target.closest(".del")){
    if(confirm(`「${m.title}」を消しますか？`)){
      memos = memos.filter(x => x.id !== m.id); persist(); render(); toast("消しました");
    }
    return;
  }
  if(e.target.closest(".copy")){
    const text = m.memo ? `${m.title}\n${m.memo}` : m.title;
    try{ await navigator.clipboard.writeText(text); toast("コピーしたよ"); }
    catch(err){ toast("コピーできませんでした"); }
    return;
  }
  if(e.target.closest(".top")) item.classList.toggle("open");
});

/* バックアップ */
$("exportBtn").addEventListener("click", async () => {
  if(!memos.length){ toast("まだメモがないよ"); return; }
  const d = new Date();
  const name = `neta_memo_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  const text = JSON.stringify({ app:"neta_memo", savedAt: d.toISOString(), memos }, null, 2);
  const file = new File([text], name, { type:"application/json" });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:"ネタメモのバックアップ" }); return; }
    catch(err){ if(err.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("書き出したよ");
});
$("importBtn").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.memos;
    if(!Array.isArray(list)) throw new Error();
    const have = new Set(memos.map(m => m.id));
    let added = 0;
    list.forEach(m => {
      if(!m || !m.title) return;
      const item = {
        id: m.id || (Date.now() + "-" + Math.random().toString(36).slice(2,7)),
        title: String(m.title), memo: String(m.memo || ""),
        cat: CATS.includes(m.cat) ? m.cat : "その他", at: Number(m.at) || Date.now()
      };
      if(have.has(item.id)) return;
      have.add(item.id); memos.push(item); added++;
    });
    memos.sort((a,b) => b.at - a.at);
    persist(); filter = "すべて"; render();
    toast(added ? `${added}こ読み込んだよ` : "新しいメモはなかったよ");
  }catch(err){
    toast("このファイルは読み込めませんでした");
  }
});

renderCats();
render();
</script>
</body>
</html>
