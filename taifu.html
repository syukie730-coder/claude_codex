<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台風記録</title>
<meta name="theme-color" content="#eaf6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台風記録">
<link rel="apple-touch-icon" href="taifu-icon.png">
<link rel="icon" href="taifu-icon.png">
<style>
  :root{
    --sky:#4aa8dd;
    --deep:#2b6a94;
    --ink:#3b4a55;
    --pink:#ff9dc0;
    --sun:#ffd66b;
    --line:#dcecf6;
    --card:#ffffff;
    --shadow:0 6px 18px rgba(88,150,190,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100%;
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro",-apple-system,
                BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    font-size:18px;line-height:1.75;
    background:linear-gradient(180deg,#eaf6fd 0%,#f4fbff 45%,#fff9f2 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }

  /* ---- ふんわり流れる雲 ---- */
  .clouds{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .cloud{
    position:absolute;background:#fff;opacity:.75;border-radius:100px;
    filter:blur(.4px);
    animation:drift linear infinite;
  }
  .cloud::before,.cloud::after{
    content:"";position:absolute;background:#fff;border-radius:50%;
  }
  .c1{width:120px;height:38px;top:14%;left:-160px;animation-duration:64s;}
  .c1::before{width:56px;height:56px;top:-24px;left:22px;}
  .c1::after{width:40px;height:40px;top:-16px;left:64px;}
  .c2{width:90px;height:30px;top:44%;left:-140px;animation-duration:88s;animation-delay:-20s;opacity:.6;}
  .c2::before{width:44px;height:44px;top:-20px;left:16px;}
  .c2::after{width:32px;height:32px;top:-12px;left:50px;}
  .c3{width:150px;height:44px;top:72%;left:-200px;animation-duration:104s;animation-delay:-52s;opacity:.55;}
  .c3::before{width:66px;height:66px;top:-30px;left:28px;}
  .c3::after{width:48px;height:48px;top:-20px;left:82px;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(120vw);}}

  /* ---- ヘッダー ---- */
  header{
    position:sticky;top:0;z-index:5;
    background:rgba(255,255,255,.82);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:2px dotted var(--line);
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .swirl{width:36px;height:36px;flex:none;animation:spin 16s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{margin:0;font-size:26px;font-weight:800;color:var(--deep);letter-spacing:.08em;}

  /* ---- 一覧 ---- */
  main{position:relative;z-index:1;padding:20px 16px 140px;max-width:640px;margin:0 auto;}
  .card{
    position:relative;width:100%;text-align:left;display:block;
    background:var(--card);border:none;border-radius:24px;
    box-shadow:var(--shadow);
    padding:20px 22px 22px;margin-bottom:16px;
    font:inherit;color:inherit;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease;
    animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .card:active{transform:scale(.975);box-shadow:0 3px 10px rgba(88,150,190,.18);}
  .card .year{
    display:inline-block;font-size:27px;font-weight:800;color:var(--sky);line-height:1.25;
  }
  .card .year::after{
    content:"";display:block;height:7px;margin-top:-6px;border-radius:7px;
    background:rgba(255,214,107,.55);
  }
  .card .memo{display:block;margin-top:8px;white-space:pre-wrap;word-break:break-word;}
  .card .tag{
    position:absolute;top:18px;right:20px;font-size:20px;opacity:.5;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}

  .empty{
    background:rgba(255,255,255,.7);border:2px dashed var(--line);border-radius:24px;
    padding:34px 24px 30px;text-align:center;color:#6d8496;
  }
  .empty .big{display:block;font-size:56px;line-height:1;margin-bottom:14px;animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-8px) rotate(8deg);}}

  /* ---- 下部ボタン ---- */
  .addbar{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    background:linear-gradient(to top,#fff8f0 62%,rgba(255,248,240,0));
    padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .addbar .inner{max-width:640px;margin:0 auto;}

  button{font:inherit;font-family:inherit;}
  .btn{
    display:block;width:100%;min-height:64px;
    border:none;border-radius:999px;
    font-size:21px;font-weight:800;cursor:pointer;
    transition:transform .14s ease,filter .14s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-main{
    background:linear-gradient(180deg,#68c0ea,#3f9fd6);color:#fff;
    box-shadow:0 6px 0 #2f85b8,0 10px 18px rgba(63,159,214,.3);
  }
  .btn-main:active{box-shadow:0 3px 0 #2f85b8,0 6px 12px rgba(63,159,214,.28);}
  .btn-danger{
    background:#fff;color:#e0728f;border:2px solid #ffd9e5;margin-top:14px;
    box-shadow:0 4px 0 #ffe6ee;
  }

  /* ---- 記録画面 ---- */
  .screen{
    position:fixed;inset:0;z-index:10;
    background:linear-gradient(180deg,#f4fbff,#fff9f2);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.8,.3,1);
    visibility:hidden;
  }
  .screen.open{transform:none;visibility:visible;}
  .screen-bar{
    position:sticky;top:0;z-index:2;
    background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    border-bottom:2px dotted var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .back{background:none;border:none;color:var(--sky);font-size:19px;font-weight:800;padding:10px 8px;cursor:pointer;}
  .screen-title{font-size:19px;font-weight:800;color:var(--deep);}
  .spacer{width:78px;}
  .form{padding:24px 20px 46px;max-width:640px;margin:0 auto;}
  label{display:block;font-size:18px;font-weight:800;color:var(--deep);margin-bottom:8px;}
  .hint{font-weight:400;color:#7d92a1;font-size:15px;margin:-4px 0 10px;}
  input[type="number"],textarea{
    width:100%;font:inherit;color:var(--ink);background:#fff;
    border:2px solid var(--line);border-radius:18px;padding:14px 16px;
    box-shadow:0 3px 10px rgba(88,150,190,.08);
  }
  input[type="number"]{font-size:25px;font-weight:800;color:var(--sky);}
  textarea{font-size:19px;line-height:1.85;min-height:210px;resize:vertical;}
  input:focus,textarea:focus{outline:none;border-color:#8fd0ef;box-shadow:0 0 0 4px rgba(143,208,239,.3);}
  button:focus-visible{outline:3px solid #8fd0ef;outline-offset:3px;}
  .field{margin-bottom:26px;}
  .note{color:#8aa0ae;font-size:15px;text-align:center;margin-top:22px;}

  /* ---- 保存演出・トースト ---- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden;}
  .fx-item{position:absolute;bottom:22%;will-change:transform,opacity;animation:floatUp ease-out forwards;}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(20px) scale(.6) rotate(0);}
    18%{opacity:1;}
    100%{opacity:0;transform:translateY(-300px) scale(1.1) rotate(320deg);}
  }
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);
    transform:translateX(-50%) translateY(12px);z-index:31;
    background:#fff;color:var(--deep);font-size:17px;font-weight:800;
    padding:13px 26px;border-radius:999px;border:2px solid var(--line);
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .screen{transform:none;}
    .screen:not(.open){display:none;}
  }
</style>
</head>
<body>

<div class="clouds" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<header>
  <svg class="swirl" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#8fd3f4"/>
    <g fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round">
      <path id="arm" d="M50 24 A26 26 0 0 1 74 48"/>
      <use href="#arm" transform="rotate(120 50 50)"/>
      <use href="#arm" transform="rotate(240 50 50)"/>
    </g>
  </svg>
  <h1>台風記録</h1>
</header>

<main>
  <div id="list"></div>
</main>

<div class="addbar">
  <div class="inner">
    <button class="btn btn-main" id="addBtn">＋ 記録する</button>
  </div>
</div>

<!-- 記録画面 -->
<section class="screen" id="editor" aria-hidden="true">
  <div class="screen-bar">
    <button class="back" id="backBtn">‹ もどる</button>
    <span class="screen-title" id="editorTitle">記録する</span>
    <span class="spacer"></span>
  </div>
  <div class="form">
    <div class="field">
      <label for="yearInput">🗓 年度</label>
      <input type="number" id="yearInput" inputmode="numeric" min="1900" max="2100" step="1">
    </div>
    <div class="field">
      <label for="memoInput">🌀 今年の台風の感想</label>
      <p class="hint">思ったことを、そのまま書いてくださいね。</p>
      <textarea id="memoInput" placeholder="例：今年は台風が少なくてよかった。8月に一度大きな台風が来た。"></textarea>
    </div>
    <button class="btn btn-main" id="saveBtn">保存する</button>
    <button class="btn btn-danger" id="deleteBtn">この記録を削除</button>
    <p class="note" id="savedAt"></p>
  </div>
</section>

<div id="fx" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var KEY = "taifu-kiroku-v1";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* 保存先。localStorage が使えないときは一時保存に切り替える */
  var store = (function () {
    try {
      localStorage.setItem("__t", "1");
      localStorage.removeItem("__t");
      return localStorage;
    } catch (e) {
      var mem = {};
      return {
        getItem: function (k) { return k in mem ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; }
      };
    }
  })();

  var records = [];
  var editingId = null;

  var $list = document.getElementById("list");
  var $editor = document.getElementById("editor");
  var $year = document.getElementById("yearInput");
  var $memo = document.getElementById("memoInput");
  var $deleteBtn = document.getElementById("deleteBtn");
  var $editorTitle = document.getElementById("editorTitle");
  var $savedAt = document.getElementById("savedAt");
  var $toast = document.getElementById("toast");
  var $fx = document.getElementById("fx");

  function load() {
    try {
      var raw = store.getItem(KEY);
      records = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(records)) records = [];
    } catch (e) { records = []; }
  }

  function save() {
    try {
      store.setItem(KEY, JSON.stringify(records));
      return true;
    } catch (e) {
      alert("保存できませんでした。端末の空き容量をご確認ください。");
      return false;
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    if (records.length === 0) {
      $list.innerHTML =
        '<div class="empty"><span class="big">🌀</span>' +
        "まだ記録がありません。<br>下の「＋ 記録する」から、<br>今年の台風の感想を残しましょう。</div>";
      return;
    }
    var sorted = records.slice().sort(function (a, b) { return b.year - a.year; });
    $list.innerHTML = sorted.map(function (r, i) {
      return '<button class="card" data-id="' + r.id + '" style="animation-delay:' +
               (reduce ? 0 : i * 0.07) + 's">' +
               '<span class="tag">🌀</span>' +
               '<span class="year">' + r.year + "年</span>" +
               '<span class="memo">' + esc(r.memo) + "</span>" +
             "</button>";
    }).join("");
  }

  /* 保存したときに、渦と雨つぶがふわっと舞う */
  function celebrate() {
    if (reduce) return;
    var marks = ["🌀", "🌀", "🌀", "💧", "☁️"];
    for (var i = 0; i < 14; i++) {
      var s = document.createElement("span");
      s.className = "fx-item";
      s.textContent = marks[Math.floor(Math.random() * marks.length)];
      s.style.left = (8 + Math.random() * 84) + "%";
      s.style.fontSize = (18 + Math.random() * 20) + "px";
      s.style.animationDelay = (Math.random() * 0.35) + "s";
      s.style.animationDuration = (1.5 + Math.random() * 0.9) + "s";
      $fx.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 3000); })(s);
    }
  }

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    setTimeout(function () { $toast.classList.remove("show"); }, 1800);
  }

  function openEditor(id) {
    editingId = id || null;
    if (editingId) {
      var r = records.filter(function (x) { return x.id === editingId; })[0];
      $year.value = r.year;
      $memo.value = r.memo;
      $editorTitle.textContent = "記録を見る・直す";
      $deleteBtn.style.display = "block";
      $savedAt.textContent = r.updatedAt ? "最終更新：" + r.updatedAt : "";
    } else {
      $year.value = new Date().getFullYear();
      $memo.value = "";
      $editorTitle.textContent = "記録する";
      $deleteBtn.style.display = "none";
      $savedAt.textContent = "";
    }
    $editor.classList.add("open");
    $editor.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    $editor.scrollTop = 0;
  }

  function closeEditor() {
    $editor.classList.remove("open");
    $editor.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    editingId = null;
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  document.getElementById("addBtn").addEventListener("click", function () { openEditor(null); });
  document.getElementById("backBtn").addEventListener("click", closeEditor);

  $list.addEventListener("click", function (e) {
    var card = e.target.closest(".card");
    if (card) openEditor(card.getAttribute("data-id"));
  });

  document.getElementById("saveBtn").addEventListener("click", function () {
    var year = parseInt($year.value, 10);
    var memo = $memo.value.trim();

    if (!year || year < 1900 || year > 2100) {
      alert("年度を4けたの数字で入力してください。（例：2026）");
      $year.focus();
      return;
    }
    if (memo === "") {
      alert("今年の台風の感想を入力してください。");
      $memo.focus();
      return;
    }

    if (editingId) {
      records.forEach(function (r) {
        if (r.id === editingId) { r.year = year; r.memo = memo; r.updatedAt = stamp(); }
      });
    } else {
      var same = records.filter(function (r) { return r.year === year; })[0];
      if (same) {
        if (!confirm(year + "年の記録はすでにあります。上書きしますか？")) return;
        same.memo = memo;
        same.updatedAt = stamp();
      } else {
        records.push({
          id: String(Date.now()) + Math.random().toString(16).slice(2, 6),
          year: year,
          memo: memo,
          updatedAt: stamp()
        });
      }
    }

    if (!save()) return;
    render();
    closeEditor();
    celebrate();
    toast("保存しました 🌀");
  });

  $deleteBtn.addEventListener("click", function () {
    if (!editingId) return;
    var r = records.filter(function (x) { return x.id === editingId; })[0];
    if (!confirm(r.year + "年の記録を削除します。よろしいですか？")) return;
    records = records.filter(function (x) { return x.id !== editingId; });
    save();
    render();
    closeEditor();
    toast("削除しました");
  });

  load();
  render();
})();
</script>
</body>
</html>
