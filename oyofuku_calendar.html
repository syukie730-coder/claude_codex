<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>わたしのお洋服ノート</title>
<link rel="apple-touch-icon" sizes="180x180" href="oyofuku-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="oyofuku-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="oyofuku-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="わたしのお洋服ノート">
<meta name="theme-color" content="#FFF3EE">
<style>
  :root {
    --berry: #C9356B;
    --berry-deep: #A8275A;
    --berry-soft: #F7C9D8;
    --pink-bg: #FDE6EE;
    --cream: #FFF8EC;
    --gold: #D9AE52;
    --gold-soft: #F6E3B4;
    --ink: #5A3443;
    --ink-soft: #8E6575;
    --card: #FFFFFF;
    --line: #F5D6E0;
    --sun: #D2456E;
    --sat: #5B7FB8;
    --shadow: 0 6px 18px rgba(201, 53, 107, 0.13);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.6;
    color: var(--ink);
    background: linear-gradient(170deg, #FFF8EC 0%, #FFF1EC 40%, #FDE3EC 100%) fixed;
    background-color: #FFF4EE;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px);
    overscroll-behavior-y: none;
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ===== タイトル ===== */
  header { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
  .icon-btn {
    width: 64px; height: 64px; flex: none; border-radius: 18px; position: relative;
    box-shadow: var(--shadow); overflow: visible;
  }
  .icon-btn img { width: 100%; height: 100%; border-radius: 18px; display: block; transform-origin: 50% 8%; }
  .icon-btn.swing img { animation: swing 1.3s ease-in-out; }
  @keyframes swing {
    0% { transform: rotate(0); } 15% { transform: rotate(14deg); } 32% { transform: rotate(-11deg); }
    48% { transform: rotate(7deg); } 64% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } 100% { transform: rotate(0); }
  }
  header h1 { font-size: 25px; color: var(--berry); letter-spacing: 0.03em; line-height: 1.3; }
  header p { font-size: 15px; color: var(--ink-soft); }
  .spark {
    position: fixed; pointer-events: none; z-index: 60; font-size: 22px; color: var(--gold);
    animation: fly 1s ease-out forwards; text-shadow: 0 0 6px rgba(255, 220, 140, .9);
  }
  @keyframes fly {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot)); opacity: 0; }
  }

  /* ===== 月の切り替え ===== */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border-radius: 22px; padding: 8px; box-shadow: var(--shadow);
  }
  .nav-btn {
    width: 56px; height: 56px; border-radius: 16px; font-size: 26px; color: var(--berry);
    background: var(--pink-bg); font-weight: bold;
  }
  .nav-btn:active { transform: scale(.92); }
  .month-title { text-align: center; }
  .month-title .ym { font-size: 24px; font-weight: bold; color: var(--ink); }
  .today-btn {
    font-size: 15px; color: var(--berry); padding: 2px 14px; border-radius: 99px;
    border: 1.5px solid var(--berry-soft); margin-top: 2px; min-height: 32px;
  }

  /* ===== カレンダー ===== */
  .cal-card {
    background: var(--card); border-radius: 22px; padding: 12px 8px 10px; margin-top: 12px;
    box-shadow: var(--shadow); overflow: hidden; touch-action: pan-y;
  }
  .weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .weekdays div { text-align: center; font-size: 15px; font-weight: bold; color: var(--ink-soft); padding-bottom: 6px; }
  .weekdays div:first-child { color: var(--sun); }
  .weekdays div:last-child { color: var(--sat); }
  .grid.slide-l { animation: slideL .35s ease-out; }
  .grid.slide-r { animation: slideR .35s ease-out; }
  @keyframes slideL { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideR { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .day {
    position: relative; min-width: 0; aspect-ratio: 1 / 1.22; border-radius: 14px; background: #FFFBF6;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 3px; font-size: 17px; font-weight: bold; color: var(--ink);
    border: 1.5px solid transparent;
  }
  .day:active { transform: scale(.93); background: var(--pink-bg); }
  .day.empty { background: transparent; pointer-events: none; }
  .day.sun { color: var(--sun); }
  .day.sat { color: var(--sat); }
  .day.today { border-color: var(--gold); background: #FFF6DF; }
  .day.today::after {
    content: "きょう"; position: absolute; bottom: 1px; font-size: 10px; color: #B88A2E; font-weight: bold;
  }
  .day.has { background: #FFF0F4; }
  .day.has.today::after { content: none; }
  .mark {
    position: relative; margin-top: 2px; width: 72%; aspect-ratio: 1; max-width: 32px;
    display: flex; align-items: center; justify-content: center;
    animation: pop .65s cubic-bezier(.34, 1.9, .5, 1) both;
    animation-delay: calc(var(--i, 0) * 35ms + 120ms);
  }
  .mark.big-pop { animation: bigPop 1s cubic-bezier(.34, 1.9, .5, 1) both; }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes bigPop {
    0% { transform: scale(0); } 40% { transform: scale(1.7); } 60% { transform: scale(.85); }
    80% { transform: scale(1.15); } 100% { transform: scale(1); }
  }
  .mark img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    border: 2px solid var(--berry-soft); background: #fff;
  }
  .mark svg { width: 88%; height: 88%; filter: drop-shadow(0 1px 1.5px rgba(201, 53, 107, .35)); }
  .mark .mini-heart {
    position: absolute; right: -5px; bottom: -3px; width: 14px; height: 14px;
  }
  .badge {
    position: absolute; top: 1px; right: 1px; min-width: 17px; height: 17px; border-radius: 9px;
    background: var(--berry); color: #fff; font-size: 11px; line-height: 17px; padding: 0 4px;
  }

  /* ===== 合計 ===== */
  .total-card {
    margin-top: 14px; border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow);
    background: linear-gradient(135deg, #fff 0%, #FFF3F6 60%, #FFF4DD 100%);
    border: 1.5px solid var(--gold-soft); text-align: center;
  }
  .total-card .label { font-size: 17px; color: var(--ink-soft); }
  .total-card .amount { font-size: 38px; font-weight: bold; color: var(--berry); letter-spacing: .02em; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .total-card .amount small { font-size: 22px; margin-left: 2px; }
  .total-card .count { font-size: 16px; color: var(--ink-soft); }
  .kind-word {
    margin-top: 12px; background: #FFFBEF; border-radius: 16px; padding: 10px 14px; font-size: 17px;
    color: #8A6420; border: 1.5px dashed var(--gold); animation: fadeUp .7s ease-out both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===== 大きいボタン ===== */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 60px; border-radius: 20px; font-size: 20px; font-weight: bold;
    margin-top: 12px; transition: transform .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn-main { background: linear-gradient(135deg, #D94A7E, var(--berry-deep)); color: #fff; box-shadow: 0 6px 16px rgba(168, 39, 90, .3); }
  .btn-gold { background: linear-gradient(135deg, #FFF3D2, #F4DC9E); color: #7A5715; border: 1.5px solid var(--gold); }
  .btn-soft { background: var(--card); color: var(--berry); border: 1.5px solid var(--berry-soft); }
  .btn-plain { background: #F4EEF0; color: var(--ink); }
  .btn-danger { background: #fff; color: #C0392B; border: 1.5px solid #F0B8B0; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }

  .section-title { font-size: 18px; font-weight: bold; color: var(--ink-soft); margin: 26px 4px 2px; }
  .storage-info { font-size: 15px; color: var(--ink-soft); margin: 6px 4px 0; }

  /* ===== 下から出るシート ===== */
  .backdrop {
    position: fixed; inset: 0; background: rgba(90, 40, 60, .35); z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 560px;
    max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #FFFDF8, #FFF5F7); border-radius: 28px 28px 0 0;
    box-shadow: 0 -8px 30px rgba(120, 40, 70, .2);
    transform: translateY(110%); visibility: hidden;
    transition: transform .3s cubic-bezier(.55, 0, .8, .2), visibility 0s linear .3s;
  }
  .sheet.open {
    transform: none; visibility: visible; transition: none;
    animation: springUp .75s linear both;
  }
  /* ばねのように：少し行きすぎて、戻って、落ち着く */
  @keyframes springUp {
    0% { transform: translateY(100%); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
    45% { transform: translateY(-4%); animation-timing-function: ease-in-out; }
    65% { transform: translateY(1.6%); animation-timing-function: ease-in-out; }
    82% { transform: translateY(-.6%); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0); }
  }
  .sheet.dragging { animation: none; transition: none; }
  #formSheet { z-index: 31; max-height: 94vh; max-height: 94dvh; }
  #formBackdrop { z-index: 30; }
  .sheet-head { padding: 10px 18px 6px; flex: none; touch-action: none; }
  .grabber { width: 54px; height: 6px; border-radius: 3px; background: #EBC3D0; margin: 0 auto 10px; }
  .sheet-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet-title { font-size: 22px; font-weight: bold; color: var(--berry); }
  .sheet-sub { font-size: 16px; color: var(--ink-soft); }
  .close-x {
    width: 52px; height: 52px; border-radius: 50%; font-size: 26px; background: #F6E8EC; color: var(--ink-soft); flex: none;
  }
  .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px calc(env(safe-area-inset-bottom) + 22px); }

  .item {
    background: var(--card); border-radius: 20px; padding: 14px; margin-top: 12px; box-shadow: var(--shadow);
    animation: fadeUp .45s ease-out both; animation-delay: calc(var(--i, 0) * 70ms + 150ms);
  }
  .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .item-shop { font-size: 20px; font-weight: bold; word-break: break-all; }
  .item-price { font-size: 22px; font-weight: bold; color: var(--berry); white-space: nowrap; }
  .item-memo { margin-top: 6px; font-size: 17px; white-space: pre-wrap; word-break: break-all; color: var(--ink); background: #FFF9F3; border-radius: 12px; padding: 8px 10px; }
  .item-photos { display: flex; gap: 8px; margin-top: 10px; }
  .item-photos img { width: calc((100% - 16px) / 3); aspect-ratio: 1; object-fit: cover; border-radius: 14px; background: #f6eef0; }
  .item .row .btn { min-height: 52px; font-size: 18px; margin-top: 10px; }
  .no-item { text-align: center; color: var(--ink-soft); padding: 26px 0 8px; font-size: 18px; }

  /* ===== 入力フォーム ===== */
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 17px; font-weight: bold; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; font-size: 19px; font-family: inherit; color: var(--ink); padding: 12px 14px; min-height: 56px;
    border-radius: 16px; border: 2px solid var(--line); background: #fff; -webkit-appearance: none; appearance: none;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--berry); }
  .field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
  .price-wrap { position: relative; }
  .price-wrap input { padding-right: 44px; }
  .price-wrap span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 19px; color: var(--ink-soft); }
  .photo-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: visible; }
  .slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; animation: pop .5s cubic-bezier(.34, 1.7, .5, 1) both; }
  .slot .size { position: absolute; left: 6px; bottom: 6px; font-size: 12px; background: rgba(255, 255, 255, .9); color: var(--ink); padding: 0 6px; border-radius: 8px; }
  .slot .del {
    position: absolute; top: -8px; right: -8px; width: 36px; height: 36px; border-radius: 50%;
    background: #fff; color: #C0392B; font-size: 20px; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); line-height: 36px;
  }
  .slot.add {
    border: 2.5px dashed var(--berry-soft); background: #FFF6F9; color: var(--berry);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: bold;
  }
  .slot.add b { font-size: 34px; line-height: 1; }
  .hint { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  /* ===== 写真を大きく見る ===== */
  .viewer {
    position: fixed; inset: 0; z-index: 50; background: rgba(40, 20, 30, .92); display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  .viewer.show { display: flex; animation: fadeIn .25s; }
  .viewer img { max-width: 100%; max-height: 85vh; border-radius: 14px; }
  .viewer .close-x { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; background: rgba(255, 255, 255, .9); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== スライドショー ===== */
  .show-wrap {
    position: fixed; inset: 0; z-index: 55; background: #2B1520; display: none; overflow: hidden;
  }
  .show-wrap.show { display: block; animation: fadeIn .5s; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .slide.on { opacity: 1; }
  .slide .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.55); }
  .slide img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; transform: scale(1); }
  .slide.on img.zoom { animation: kenburns var(--dur, 5.5s) ease-out forwards; }
  @keyframes kenburns { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.16) translate(var(--zx, 0), var(--zy, 0)); } }
  .show-caption {
    position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 28px); z-index: 3;
    color: #fff; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, .7);
  }
  .show-caption .d { font-size: 18px; opacity: .9; }
  .show-caption .s { font-size: 24px; font-weight: bold; }
  .show-top {
    position: absolute; top: calc(env(safe-area-inset-top) + 14px); left: 16px; right: 16px; z-index: 3;
    display: flex; justify-content: space-between; align-items: center; color: #fff;
  }
  .show-top .ttl { font-size: 18px; font-weight: bold; text-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
  .show-top .close-x { background: rgba(255, 255, 255, .9); }
  .show-bar { position: absolute; top: calc(env(safe-area-inset-top) + 4px); left: 16px; right: 16px; height: 4px; display: flex; gap: 3px; z-index: 3; }
  .show-bar i { flex: 1; background: rgba(255, 255, 255, .3); border-radius: 2px; overflow: hidden; }
  .show-bar i.done { background: rgba(255, 255, 255, .9); }
  .show-end {
    position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 30px; background: radial-gradient(circle, rgba(201, 53, 107, .55), rgba(43, 21, 32, .95));
  }
  .show-end.show { display: flex; animation: fadeIn .8s; }
  .show-end .big { font-size: 26px; font-weight: bold; line-height: 1.5; }
  .show-end .btn { max-width: 320px; }

  /* ===== お知らせ・紙ふぶき ===== */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 30px); z-index: 70;
    transform: translate(-50%, 30px); opacity: 0; transition: all .35s;
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 99px; font-size: 18px; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 65; }
  .busy {
    position: fixed; inset: 0; z-index: 80; background: rgba(255, 248, 240, .8); display: none;
    align-items: center; justify-content: center; font-size: 20px; color: var(--berry); font-weight: bold;
  }
  .busy.show { display: flex; }
  .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ===== 動きを減らす設定のとき ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
    }
    .sheet { transition: visibility 0s linear .2s, opacity .2s; transform: none; opacity: 0; }
    .sheet.open { opacity: 1; transition: opacity .2s; }
    .slide { transition: opacity .6s; }
    .slide.on img.zoom { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="icon-btn" id="iconBtn" aria-label="アイコン"><img src="icon.png" alt=""></button>
    <div>
      <h1>わたしのお洋服ノート</h1>
      <p>お買い物の思い出を、カレンダーに</p>
    </div>
  </header>

  <div class="month-nav">
    <button class="nav-btn" id="prevBtn" aria-label="前の月">‹</button>
    <div class="month-title">
      <div class="ym" id="ymLabel"></div>
      <button class="today-btn" id="todayBtn">今月にもどる</button>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="次の月">›</button>
  </div>

  <div class="cal-card" id="calCard">
    <div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="total-card">
    <div class="label" id="totalLabel">今月の合計</div>
    <div class="amount"><span id="totalNum">0</span><small>円</small></div>
    <div class="count" id="countLabel"></div>
  </div>
  <div class="kind-word" id="kindWord" hidden></div>

  <button class="btn btn-main" id="addBtn">＋ お買い物を記録する</button>
  <button class="btn btn-gold" id="showBtn">🎞 今月のふり返りスライドショー</button>

  <div class="section-title">🔒 データを守る</div>
  <div class="row">
    <button class="btn btn-soft" id="exportBtn">バックアップを<br>書き出す</button>
    <button class="btn btn-soft" id="importBtn">バックアップを<br>読み込む</button>
  </div>
  <div class="storage-info" id="storageInfo"></div>
  <input type="file" id="importFile" class="hidden-input" accept="application/json,.json">
</div>

<!-- 日付のシート -->
<div class="backdrop" id="dayBackdrop"></div>
<section class="sheet" id="daySheet" aria-modal="true" role="dialog">
  <div class="sheet-head">
    <div class="grabber"></div>
    <div class="sheet-title-row">
      <div>
        <div class="sheet-title" id="dayTitle"></div>
        <div class="sheet-sub" id="daySub"></div>
      </div>
      <button class="close-x" data-close="day" aria-label="とじる">×</button>
    </div>
  </div>
  <div class="sheet-body">
    <div id="dayList"></div>
    <button class="btn btn-main" id="dayAddBtn">＋ この日にお買い物を追加</button>
  </div>
</section>

<!-- 入力のシート -->
<div class="backdrop" id="formBackdrop"></div>
<section class="sheet" id="formSheet" aria-modal="true" role="dialog">
  <div class="sheet-head">
    <div class="grabber"></div>
    <div class="sheet-title-row">
      <div class="sheet-title" id="formTitle">お買い物を記録</div>
      <button class="close-x" data-close="form" aria-label="とじる">×</button>
    </div>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label for="fDate">📅 買った日</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label for="fShop">🏬 お店</label>
      <input type="text" id="fShop" placeholder="例：〇〇デパート" autocomplete="off">
    </div>
    <div class="field">
      <label for="fPrice">💴 値段</label>
      <div class="price-wrap">
        <input type="text" id="fPrice" inputmode="numeric" placeholder="例：5980" autocomplete="off">
        <span>円</span>
      </div>
    </div>
    <div class="field">
      <label for="fMemo">📝 感想・メモ</label>
      <textarea id="fMemo" placeholder="例：色がきれいで、ひとめぼれ"></textarea>
    </div>
    <div class="field">
      <label>📷 お洋服の写真（3枚まで）</label>
      <div class="photo-slots" id="slots"></div>
      <div class="hint" id="photoHint">写真は小さくしてから保存するので、スマホの容量にやさしいです。</div>
      <input type="file" id="photoFile" class="hidden-input" accept="image/*" multiple>
    </div>
    <button class="btn btn-main" id="saveBtn">♡ 保存する</button>
    <button class="btn btn-plain" data-close="form">やめる</button>
  </div>
</section>

<div class="viewer" id="viewer"><button class="close-x" aria-label="とじる">×</button><img id="viewerImg" alt=""></div>

<div class="show-wrap" id="showWrap">
  <div id="slideA" class="slide"><div class="bg"></div><img alt=""></div>
  <div id="slideB" class="slide"><div class="bg"></div><img alt=""></div>
  <div class="show-bar" id="showBar"></div>
  <div class="show-top">
    <div class="ttl" id="showTitle"></div>
    <button class="close-x" id="showClose" aria-label="とじる">×</button>
  </div>
  <div class="show-caption"><div class="d" id="capDate"></div><div class="s" id="capShop"></div></div>
  <div class="show-end" id="showEnd">
    <div class="big" id="showEndText"></div>
    <button class="btn btn-gold" id="showAgain">もう一度みる</button>
    <button class="btn btn-soft" id="showEndClose">とじる</button>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">少し待ってね…</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const MAX_PHOTOS = 3;
  const MAX_SIDE = 800;
  const JPEG_QUALITY = 0.6;

  /* ========== IndexedDB（写真もここに保存） ========== */
  const DB_NAME = 'oyofukuNote';
  const STORE = 'items';
  let dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const st = db.createObjectStore(STORE, { keyPath: 'id' });
          st.createIndex('date', 'date');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function tx(mode, fn) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const st = t.objectStore(STORE);
      let result;
      Promise.resolve(fn(st)).then((r) => { result = r; });
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  const dbAll = () => tx('readonly', (st) => new Promise((res) => { const r = st.getAll(); r.onsuccess = () => res(r.result); }));
  const dbPut = (item) => tx('readwrite', (st) => { st.put(item); });
  const dbDelete = (id) => tx('readwrite', (st) => { st.delete(id); });
  const dbPutMany = (items) => tx('readwrite', (st) => { items.forEach((it) => st.put(it)); });

  /* ========== 状態 ========== */
  let items = [];
  const today = new Date();
  let viewY = today.getFullYear();
  let viewM = today.getMonth(); // 0-11
  let selectedDate = null;
  let editingId = null;
  let formPhotos = []; // Blob の配列
  let shownTotal = 0;
  let popDate = null; // 保存直後に大きく弾ませる日

  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };
  const yen = (n) => Math.round(n).toLocaleString('ja-JP');
  const kb = (bytes) => bytes >= 1024 * 1024 ? `約${(bytes / 1024 / 1024).toFixed(1)}MB` : `約${Math.max(1, Math.round(bytes / 1024))}KB`;
  function jpDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    const w = WEEK[new Date(y, m - 1, d).getDay()];
    return `${m}月${d}日（${w}）`;
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // 同じ Blob にはいつも同じ URL を使う
  const urlCache = new WeakMap();
  function blobURL(b) {
    if (!b) return '';
    let u = urlCache.get(b);
    if (!u) { u = URL.createObjectURL(b); urlCache.set(b, u); }
    return u;
  }

  const itemsOn = (date) => items.filter((it) => it.date === date).sort((a, b) => a.createdAt - b.createdAt);
  const monthPrefix = () => `${viewY}-${pad(viewM + 1)}-`;
  const itemsInMonth = () => items.filter((it) => it.date.startsWith(monthPrefix())).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt);

  /* ========== ハートの絵 ========== */
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F27BA3"/><stop offset="1" stop-color="#C9356B"/></linearGradient></defs><path fill="url(#hg)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/><circle cx="8" cy="9" r="1.6" fill="#fff" opacity=".7"/></svg>';
  const MINI_HEART = HEART.replace('<svg ', '<svg class="mini-heart" ').replace('id="hg"', 'id="hg2"').replace('url(#hg)', 'url(#hg2)');

  /* ========== カレンダー ========== */
  function renderCalendar(dir) {
    $('ymLabel').textContent = `${viewY}年 ${viewM + 1}月`;
    const isThisMonth = viewY === today.getFullYear() && viewM === today.getMonth();
    $('todayBtn').style.visibility = isThisMonth ? 'hidden' : 'visible';

    const grid = $('grid');
    grid.innerHTML = '';
    const first = new Date(viewY, viewM, 1).getDay();
    const days = new Date(viewY, viewM + 1, 0).getDate();
    const tStr = todayStr();
    let markIndex = 0;
    for (let i = 0; i < first; i++) {
      const e = document.createElement('div');
      e.className = 'day empty';
      grid.appendChild(e);
    }
    for (let d = 1; d <= days; d++) {
      const date = ymd(viewY, viewM, d);
      const dow = (first + d - 1) % 7;
      const list = itemsOn(date);
      const cell = document.createElement('button');
      cell.className = 'day' + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '') + (date === tStr ? ' today' : '') + (list.length ? ' has' : '');
      cell.setAttribute('aria-label', `${viewM + 1}月${d}日` + (list.length ? `、お買い物${list.length}件` : ''));
      cell.dataset.date = date;
      const num = document.createElement('span');
      num.textContent = d;
      cell.appendChild(num);
      if (list.length) {
        const mark = document.createElement('span');
        mark.className = 'mark' + (date === popDate ? ' big-pop' : '');
        mark.style.setProperty('--i', markIndex++);
        const photoItem = list.find((it) => it.photos && it.photos.length);
        if (photoItem) {
          const img = document.createElement('img');
          img.src = blobURL(photoItem.photos[0]);
          img.alt = '';
          mark.appendChild(img);
          mark.insertAdjacentHTML('beforeend', MINI_HEART);
        } else {
          mark.innerHTML = HEART;
        }
        cell.appendChild(mark);
        if (list.length > 1) {
          const b = document.createElement('span');
          b.className = 'badge';
          b.textContent = list.length;
          cell.appendChild(b);
        }
      }
      grid.appendChild(cell);
    }
    popDate = null;
    if (dir) {
      grid.classList.remove('slide-l', 'slide-r');
      void grid.offsetWidth;
      grid.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
    }
    renderTotal();
  }

  function renderTotal() {
    const list = itemsInMonth();
    const total = list.reduce((s, it) => s + (Number(it.price) || 0), 0);
    const isThisMonth = viewY === today.getFullYear() && viewM === today.getMonth();
    $('totalLabel').textContent = isThisMonth ? '今月の合計' : `${viewM + 1}月の合計`;
    $('countLabel').textContent = list.length ? `お買い物 ${list.length}回` : 'まだ記録はありません';
    countUp(total);
    renderKindWord(list);
    $('showBtn').textContent = isThisMonth ? '🎞 今月のふり返りスライドショー' : `🎞 ${viewM + 1}月のふり返りスライドショー`;
  }

  // 合計金額のカウントアップ
  let countRaf = 0;
  function countUp(target) {
    cancelAnimationFrame(countRaf);
    const el = $('totalNum');
    if (reduceMotion.matches) { el.textContent = yen(target); shownTotal = target; return; }
    const from = shownTotal === target ? 0 : shownTotal;
    const start = performance.now();
    const dur = 1100;
    const step = (now) => {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = yen(from + (target - from) * e);
      if (p < 1) countRaf = requestAnimationFrame(step);
      else shownTotal = target;
    };
    countRaf = requestAnimationFrame(step);
  }

  // やさしい一言
  function renderKindWord(list) {
    const box = $('kindWord');
    const nowY = today.getFullYear(), nowM = today.getMonth();
    const isThis = viewY === nowY && viewM === nowM;
    const isFuture = viewY > nowY || (viewY === nowY && viewM > nowM);
    let msg = '';
    if (isFuture) {
      msg = '';
    } else if (isThis) {
      const tDay = today.getDate();
      const past = list.filter((it) => it.date <= todayStr());
      let lastDay = 0;
      past.forEach((it) => { lastDay = Math.max(lastDay, Number(it.date.slice(8))); });
      const quietDays = lastDay ? tDay - lastDay : tDay; // お買い物のない日が続いている日数
      if (!past.length && tDay >= 2) {
        msg = `🌷 今月はまだ節約上手だね。${tDay}日間、お買い物なしです`;
      } else if (lastDay && quietDays >= 5) {
        const words = [
          `🍀 ${quietDays}日間お買い物なし。今月はまだ節約上手だね`,
          `☕ ${quietDays}日間お財布おやすみ中。えらいね`,
          `🌙 ${quietDays}日間お買い物なし。手持ちのお洋服で楽しめてるね`,
        ];
        msg = words[quietDays % words.length];
      } else if (past.length) {
        msg = `✨ 今月は${past.length}回、すてきなお洋服に出会えたね`;
      }
    } else {
      msg = list.length
        ? `✨ この月は${list.length}回、すてきなお買い物をしたね`
        : '🌷 この月はお買い物なし。節約上手だったね';
    }
    if (msg) {
      box.textContent = msg;
      box.hidden = false;
      box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    } else {
      box.hidden = true;
    }
  }

  function changeMonth(diff) {
    viewM += diff;
    if (viewM < 0) { viewM = 11; viewY--; }
    if (viewM > 11) { viewM = 0; viewY++; }
    shownTotal = 0;
    renderCalendar(diff);
  }
  $('prevBtn').onclick = () => changeMonth(-1);
  $('nextBtn').onclick = () => changeMonth(1);
  $('todayBtn').onclick = () => {
    const diff = (today.getFullYear() - viewY) * 12 + (today.getMonth() - viewM);
    viewY = today.getFullYear(); viewM = today.getMonth(); shownTotal = 0;
    renderCalendar(diff > 0 ? 1 : -1);
  };
  $('grid').addEventListener('click', (e) => {
    const cell = e.target.closest('.day');
    if (cell && cell.dataset.date) openDay(cell.dataset.date);
  });

  // カレンダーを左右になぞっても月が変わる
  (() => {
    let sx = 0, sy = 0, moving = false;
    const card = $('calCard');
    card.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; moving = true; }, { passive: true });
    card.addEventListener('touchend', (e) => {
      if (!moving) return;
      moving = false;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) changeMonth(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  /* ========== シート（下からふわっと） ========== */
  const sheets = {
    day: { sheet: $('daySheet'), back: $('dayBackdrop') },
    form: { sheet: $('formSheet'), back: $('formBackdrop') },
  };
  function openSheet(name) {
    const s = sheets[name];
    s.sheet.style.transform = '';
    s.back.classList.add('show');
    s.sheet.classList.remove('open');
    void s.sheet.offsetWidth;
    s.sheet.classList.add('open');
    s.sheet.querySelector('.sheet-body').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closeSheet(name) {
    const s = sheets[name];
    s.sheet.classList.remove('open', 'dragging');
    s.sheet.style.transform = '';
    s.back.classList.remove('show');
    if (!sheets.day.sheet.classList.contains('open') && !sheets.form.sheet.classList.contains('open')) {
      document.body.style.overflow = '';
    }
  }
  document.querySelectorAll('[data-close]').forEach((b) => { b.addEventListener('click', () => closeSheet(b.dataset.close)); });
  sheets.day.back.onclick = () => closeSheet('day');
  sheets.form.back.onclick = () => closeSheet('form');

  // つまみを下になぞると閉じる
  Object.keys(sheets).forEach((name) => {
    const sheet = sheets[name].sheet;
    const head = sheet.querySelector('.sheet-head');
    let sy = 0, dy = 0, drag = false;
    head.addEventListener('touchstart', (e) => {
      if (e.target.closest('button')) return;
      sy = e.touches[0].clientY; dy = 0; drag = true;
      sheet.classList.add('dragging');
    }, { passive: true });
    head.addEventListener('touchmove', (e) => {
      if (!drag) return;
      dy = Math.max(0, e.touches[0].clientY - sy);
      sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    head.addEventListener('touchend', () => {
      if (!drag) return;
      drag = false;
      sheet.classList.remove('dragging');
      if (dy > 90) closeSheet(name);
      else { sheet.style.transition = 'transform .35s cubic-bezier(.34,1.56,.64,1)'; sheet.style.transform = 'translateY(0)'; setTimeout(() => { sheet.style.transition = ''; sheet.style.transform = ''; }, 360); }
    });
  });

  /* ========== その日のお買い物 ========== */
  function openDay(date) {
    selectedDate = date;
    renderDay();
    openSheet('day');
  }
  function renderDay() {
    const date = selectedDate;
    const list = itemsOn(date);
    $('dayTitle').textContent = jpDate(date);
    const sum = list.reduce((s, it) => s + (Number(it.price) || 0), 0);
    $('daySub').textContent = list.length ? `${list.length}件 ・ 合計 ${yen(sum)}円` : 'お買い物の記録はありません';
    const box = $('dayList');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<div class="no-item">🛍️<br>この日の記録はまだないよ</div>';
    }
    list.forEach((it, i) => {
      const card = document.createElement('div');
      card.className = 'item';
      card.style.setProperty('--i', i);
      const top = document.createElement('div');
      top.className = 'item-top';
      const shop = document.createElement('div');
      shop.className = 'item-shop';
      shop.textContent = it.shop || '（お店の名前なし）';
      const price = document.createElement('div');
      price.className = 'item-price';
      price.textContent = `${yen(it.price || 0)}円`;
      top.append(shop, price);
      card.appendChild(top);
      if (it.photos && it.photos.length) {
        const ph = document.createElement('div');
        ph.className = 'item-photos';
        it.photos.forEach((b) => {
          const img = document.createElement('img');
          img.src = blobURL(b);
          img.alt = 'お洋服の写真';
          img.onclick = () => openViewer(blobURL(b));
          ph.appendChild(img);
        });
        card.appendChild(ph);
      }
      if (it.memo) {
        const memo = document.createElement('div');
        memo.className = 'item-memo';
        memo.textContent = it.memo;
        card.appendChild(memo);
      }
      const row = document.createElement('div');
      row.className = 'row';
      const eb = document.createElement('button');
      eb.className = 'btn btn-soft';
      eb.textContent = '✏️ なおす';
      eb.onclick = () => openForm(it);
      const db = document.createElement('button');
      db.className = 'btn btn-danger';
      db.textContent = '🗑 けす';
      db.onclick = () => removeItem(it);
      row.append(eb, db);
      card.appendChild(row);
      box.appendChild(card);
    });
  }
  async function removeItem(it) {
    if (!confirm(`「${it.shop || 'この記録'}」を消しますか？\n写真もいっしょに消えます。`)) return;
    try {
      await dbDelete(it.id);
      items = items.filter((x) => x.id !== it.id);
      renderDay();
      renderCalendar();
      updateStorageInfo();
      toast('消しました');
    } catch (err) {
      alert('消せませんでした。もう一度ためしてね。');
    }
  }
  $('dayAddBtn').onclick = () => openForm(null, selectedDate);
  $('addBtn').onclick = () => {
    const isThis = viewY === today.getFullYear() && viewM === today.getMonth();
    openForm(null, isThis ? todayStr() : ymd(viewY, viewM, 1));
  };

  /* ========== 入力フォーム ========== */
  function openForm(item, date) {
    editingId = item ? item.id : null;
    $('formTitle').textContent = item ? '記録をなおす' : 'お買い物を記録';
    $('fDate').value = item ? item.date : (date || todayStr());
    $('fShop').value = item ? item.shop || '' : '';
    $('fPrice').value = item && item.price ? String(item.price) : '';
    $('fMemo').value = item ? item.memo || '' : '';
    formPhotos = item && item.photos ? item.photos.slice() : [];
    renderSlots();
    openSheet('form');
  }
  function renderSlots() {
    const box = $('slots');
    box.innerHTML = '';
    formPhotos.forEach((b, i) => {
      const s = document.createElement('div');
      s.className = 'slot';
      const img = document.createElement('img');
      img.src = blobURL(b);
      img.alt = '';
      img.onclick = () => openViewer(blobURL(b));
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = kb(b.size);
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', '写真をはずす');
      del.onclick = () => { formPhotos.splice(i, 1); renderSlots(); };
      s.append(img, size, del);
      box.appendChild(s);
    });
    if (formPhotos.length < MAX_PHOTOS) {
      const add = document.createElement('button');
      add.className = 'slot add';
      add.innerHTML = '<b>＋</b>写真';
      add.onclick = () => $('photoFile').click();
      box.appendChild(add);
    }
    const total = formPhotos.reduce((s, b) => s + b.size, 0);
    $('photoHint').textContent = formPhotos.length
      ? `写真 ${formPhotos.length}枚 ・ 合わせて${kb(total)}（小さくしてあります）`
      : '写真は小さくしてから保存するので、スマホの容量にやさしいです。';
  }

  // 写真を長い辺800pxまで縮めて、JPEG（画質0.6）にする
  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  async function shrinkPhoto(file) {
    const img = await loadImage(file);
    const w = img.naturalWidth, h = img.naturalHeight;
    const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    return new Promise((resolve, reject) => {
      c.toBlob((b) => (b ? resolve(b) : reject(new Error('blob'))), 'image/jpeg', JPEG_QUALITY);
    });
  }
  $('photoFile').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    const room = MAX_PHOTOS - formPhotos.length;
    if (files.length > room) toast(`写真は3枚までなので、${room}枚だけ入れました`);
    busy(true, '写真を小さくしています…');
    try {
      for (const f of files.slice(0, room)) {
        formPhotos.push(await shrinkPhoto(f));
      }
    } catch (err) {
      alert('写真を読み込めませんでした。別の写真でためしてね。');
    }
    busy(false);
    renderSlots();
  });

  // 値段：全角の数字も OK にして、数字だけ残す
  $('fPrice').addEventListener('input', (e) => {
    const v = e.target.value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
    e.target.value = v ? Number(v).toLocaleString('ja-JP') : '';
  });

  $('saveBtn').onclick = async () => {
    const date = $('fDate').value;
    if (!date) { alert('買った日を入れてね'); return; }
    const price = Number($('fPrice').value.replace(/[^0-9]/g, '')) || 0;
    const shop = $('fShop').value.trim();
    const memo = $('fMemo').value.trim();
    if (!shop && !price && !memo && !formPhotos.length) { alert('お店や値段など、どれか1つは入れてね'); return; }
    const old = editingId ? items.find((x) => x.id === editingId) : null;
    const item = {
      id: old ? old.id : newId(),
      date, shop, price, memo,
      photos: formPhotos.slice(),
      createdAt: old ? old.createdAt : Date.now(),
      updatedAt: Date.now(),
    };
    try {
      await dbPut(item);
    } catch (err) {
      alert('保存できませんでした。スマホの空き容量を確認してね。');
      return;
    }
    items = items.filter((x) => x.id !== item.id).concat(item);
    closeSheet('form');
    // 保存した日の月を表示する
    const [y, m] = date.split('-').map(Number);
    const monthChanged = y !== viewY || m - 1 !== viewM;
    viewY = y; viewM = m - 1;
    if (monthChanged) shownTotal = 0;
    popDate = date;
    renderCalendar();
    if (sheets.day.sheet.classList.contains('open')) {
      selectedDate = date;
      renderDay();
    }
    updateStorageInfo();
    celebrate();
    toast(old ? 'なおしました ♡' : '保存しました ♡');
  };

  /* ========== 写真を大きく ========== */
  function openViewer(src) { $('viewerImg').src = src; $('viewer').classList.add('show'); }
  $('viewer').onclick = () => $('viewer').classList.remove('show');

  /* ========== 紙ふぶきとキラキラ ========== */
  const cv = $('confetti');
  const cx = cv.getContext('2d');
  let parts = [], confRaf = 0;
  const COLORS = ['#F27BA3', '#C9356B', '#FFC2D6', '#E8C066', '#F6E3B4', '#FFFFFF', '#F9A8C4'];
  function celebrate() {
    if (reduceMotion.matches) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = [];
    const W = innerWidth, H = innerHeight;
    for (let i = 0; i < 130; i++) {
      const kind = i % 6 === 0 ? 'star' : i % 5 === 0 ? 'heart' : 'paper';
      parts.push({
        kind, x: W / 2 + (Math.random() - .5) * 80, y: H * .55,
        vx: (Math.random() - .5) * 13, vy: -Math.random() * 15 - 6,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        size: kind === 'paper' ? 7 + Math.random() * 6 : 9 + Math.random() * 8,
        color: kind === 'star' ? '#E8B847' : COLORS[i % COLORS.length],
        life: 0, max: 130 + Math.random() * 60, tw: Math.random() * 6,
      });
    }
    // 上からもキラキラ
    for (let i = 0; i < 26; i++) {
      parts.push({ kind: 'star', x: Math.random() * W, y: -20 - Math.random() * 200, vx: (Math.random() - .5), vy: 1.5 + Math.random() * 2,
        rot: 0, vr: .05, size: 8 + Math.random() * 10, color: '#F0C75E', life: 0, max: 200, tw: Math.random() * 6 });
    }
    cancelAnimationFrame(confRaf);
    const tick = () => {
      cx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.life++;
        p.vy += p.kind === 'paper' ? .28 : .2;
        p.vx *= .985; p.vy = Math.min(p.vy, p.kind === 'paper' ? 4.2 : 3.4);
        p.x += p.vx + Math.sin(p.life / 12 + p.tw) * .6; p.y += p.vy; p.rot += p.vr;
        const a = Math.max(0, 1 - p.life / p.max);
        cx.save(); cx.globalAlpha = a; cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.color;
        if (p.kind === 'paper') {
          cx.scale(1, Math.abs(Math.cos(p.life / 8 + p.tw)) + .2);
          cx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .66);
        } else if (p.kind === 'heart') {
          drawHeart(p.size);
        } else {
          const s = p.size * (.7 + .3 * Math.abs(Math.sin(p.life / 6 + p.tw)));
          cx.shadowColor = 'rgba(255,215,120,.9)'; cx.shadowBlur = 8;
          drawStar(s);
        }
        cx.restore();
      });
      parts = parts.filter((p) => p.life < p.max && p.y < H + 40);
      if (parts.length) confRaf = requestAnimationFrame(tick);
      else cx.clearRect(0, 0, W, H);
    };
    confRaf = requestAnimationFrame(tick);
  }
  function drawStar(s) {
    cx.beginPath();
    cx.moveTo(0, -s);
    cx.quadraticCurveTo(s * .15, -s * .15, s, 0);
    cx.quadraticCurveTo(s * .15, s * .15, 0, s);
    cx.quadraticCurveTo(-s * .15, s * .15, -s, 0);
    cx.quadraticCurveTo(-s * .15, -s * .15, 0, -s);
    cx.fill();
  }
  function drawHeart(s) {
    const k = s / 16;
    cx.beginPath();
    cx.moveTo(0, 5 * k);
    cx.bezierCurveTo(-9 * k, -2 * k, -5 * k, -10 * k, 0, -5 * k);
    cx.bezierCurveTo(5 * k, -10 * k, 9 * k, -2 * k, 0, 5 * k);
    cx.fill();
  }

  /* ========== タイトル横のアイコン ========== */
  $('iconBtn').onclick = () => {
    const btn = $('iconBtn');
    btn.classList.remove('swing'); void btn.offsetWidth; btn.classList.add('swing');
    if (reduceMotion.matches) return;
    const r = btn.getBoundingClientRect();
    const marks = ['✦', '✧', '♡', '✦', '★', '♥'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.textContent = marks[i % marks.length];
      if (i % 3 === 2) s.style.color = '#E25C8C';
      const ang = (Math.PI * 2 * i) / 12 + Math.random() * .4;
      const dist = 55 + Math.random() * 45;
      s.style.left = r.left + r.width / 2 + 'px';
      s.style.top = r.top + r.height / 2 + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      s.style.setProperty('--rot', (Math.random() * 200 - 100) + 'deg');
      s.style.fontSize = 16 + Math.random() * 14 + 'px';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }
  };

  /* ========== ふり返りスライドショー（保存済みの写真で動かす） ========== */
  let showList = [], showIdx = 0, showTimer = 0, showFlip = false;
  const SLIDE_MS = 5500;
  function startShow() {
    const list = itemsInMonth();
    showList = [];
    list.forEach((it) => (it.photos || []).forEach((b) => showList.push({ b, it })));
    if (!showList.length) {
      alert(`${viewM + 1}月の写真はまだありません。\nお買い物の記録に写真を入れると、ここで見られます。`);
      return;
    }
    $('showTitle').textContent = `${viewY}年${viewM + 1}月のお洋服`;
    const bar = $('showBar');
    bar.innerHTML = showList.map(() => '<i></i>').join('');
    $('showEnd').classList.remove('show');
    $('slideA').classList.remove('on');
    $('slideB').classList.remove('on');
    $('showWrap').classList.add('show');
    document.body.style.overflow = 'hidden';
    showIdx = 0;
    nextSlide();
  }
  function nextSlide() {
    clearTimeout(showTimer);
    if (showIdx >= showList.length) { endShow(); return; }
    const { b, it } = showList[showIdx];
    const url = blobURL(b);
    showFlip = !showFlip;
    const on = $(showFlip ? 'slideA' : 'slideB');
    const off = $(showFlip ? 'slideB' : 'slideA');
    const img = on.querySelector('img');
    on.querySelector('.bg').style.backgroundImage = `url("${url}")`;
    img.classList.remove('zoom');
    img.style.setProperty('--zx', (Math.random() * 6 - 3) + '%');
    img.style.setProperty('--zy', (Math.random() * 6 - 3) + '%');
    img.style.setProperty('--dur', (SLIDE_MS + 1500) / 1000 + 's');
    img.src = url;
    void img.offsetWidth;
    img.classList.add('zoom');
    on.classList.add('on');
    off.classList.remove('on');
    $('capDate').textContent = jpDate(it.date);
    $('capShop').textContent = [it.shop, it.price ? `${yen(it.price)}円` : ''].filter(Boolean).join('　');
    const bars = $('showBar').children;
    for (let i = 0; i < bars.length; i++) bars[i].classList.toggle('done', i <= showIdx);
    showIdx++;
    showTimer = setTimeout(nextSlide, SLIDE_MS);
  }
  function endShow() {
    const list = itemsInMonth();
    const total = list.reduce((s, it) => s + (Number(it.price) || 0), 0);
    $('showEndText').innerHTML = '';
    const t = document.createElement('div');
    t.textContent = `${viewM + 1}月は ${list.length}回のお買い物`;
    const t2 = document.createElement('div');
    t2.textContent = `合計 ${yen(total)}円`;
    t2.style.color = '#F6E3B4';
    const t3 = document.createElement('div');
    t3.textContent = '今月もおしゃれを楽しめたね ♡';
    t3.style.fontSize = '20px';
    t3.style.marginTop = '8px';
    $('showEndText').append(t, t2, t3);
    $('showEnd').classList.add('show');
  }
  function closeShow() {
    clearTimeout(showTimer);
    $('showWrap').classList.remove('show');
    document.body.style.overflow = '';
  }
  $('showBtn').onclick = startShow;
  $('showClose').onclick = closeShow;
  $('showEndClose').onclick = closeShow;
  $('showAgain').onclick = startShow;

  /* ========== バックアップ ========== */
  function blobToDataURL(b) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(b);
    });
  }
  function dataURLToBlob(s) {
    const [head, body] = s.split(',');
    const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
    const bin = atob(body);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  $('exportBtn').onclick = async () => {
    if (!items.length) { alert('まだ記録がないので、書き出すものがありません。'); return; }
    busy(true, 'バックアップを作っています…');
    try {
      const out = [];
      for (const it of items) {
        const photos = [];
        for (const b of it.photos || []) photos.push(await blobToDataURL(b));
        out.push({ ...it, photos });
      }
      const json = JSON.stringify({ app: 'oyofuku-note', version: 1, exportedAt: new Date().toISOString(), items: out });
      const t = new Date();
      const name = `oyofuku_backup_${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}.json`;
      const file = new File([json], name, { type: 'application/json' });
      busy(false);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'お洋服ノートのバックアップ' });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      toast('バックアップを書き出しました');
    } catch (err) {
      busy(false);
      alert('バックアップを作れませんでした。');
    }
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let data;
    try {
      data = JSON.parse(await f.text());
    } catch (err) {
      alert('このファイルは読み込めませんでした。お洋服ノートのバックアップを選んでね。');
      return;
    }
    if (!data || data.app !== 'oyofuku-note' || !Array.isArray(data.items)) {
      alert('お洋服ノートのバックアップではないようです。');
      return;
    }
    if (!confirm(`${data.items.length}件の記録を読み込みます。\n今の記録は消えずに、そのまま残ります。\n（同じ記録は新しいほうに置きかわります）`)) return;
    busy(true, '読み込んでいます…');
    try {
      const list = data.items
        .filter((it) => it && it.id && /^\d{4}-\d{2}-\d{2}$/.test(it.date))
        .map((it) => ({
          id: String(it.id), date: it.date, shop: String(it.shop || ''), price: Number(it.price) || 0, memo: String(it.memo || ''),
          photos: (it.photos || []).slice(0, MAX_PHOTOS).filter((p) => typeof p === 'string' && p.startsWith('data:image/')).map(dataURLToBlob),
          createdAt: Number(it.createdAt) || Date.now(), updatedAt: Number(it.updatedAt) || Date.now(),
        }));
      await dbPutMany(list);
      items = await dbAll();
      busy(false);
      shownTotal = 0;
      renderCalendar();
      updateStorageInfo();
      celebrate();
      toast(`${list.length}件を読み込みました`);
    } catch (err) {
      busy(false);
      alert('読み込みのとちゅうで止まりました。スマホの空き容量を確認してね。');
    }
  });

  function updateStorageInfo() {
    let n = 0, bytes = 0;
    items.forEach((it) => (it.photos || []).forEach((b) => { n++; bytes += b.size || 0; }));
    $('storageInfo').textContent = `記録 ${items.length}件 ・ 写真 ${n}枚（${n ? kb(bytes) : '0KB'}）を、このスマホの中に保存しています。ときどきバックアップしておくと安心です。`;
  }

  /* ========== 小さなお知らせ ========== */
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function busy(on, msg) {
    $('busy').textContent = msg || '少し待ってね…';
    $('busy').classList.toggle('show', on);
  }

  /* ========== はじめに ========== */
  (async () => {
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      items = await dbAll();
    } catch (err) {
      alert('記録を読み込めませんでした。プライベートブラウズでは使えないことがあります。');
    }
    renderCalendar();
    updateStorageInfo();
  })();

  // 日付がかわったら「きょう」も更新
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const n = new Date();
    if (n.toDateString() !== today.toDateString()) {
      today.setTime(n.getTime());
      renderCalendar();
    }
  });
})();
</script>
</body>
