<title>簿記タワー のぼり隊</title>
<style>
:root{
  --ink:#1F2A33;
  --ink-soft:#3A4753;
  --rule:#9FB6C4;
  --ledger:#EDF3E9;
  --ledger-line:#C6DAC9;
  --paper:#FFFFFF;
  --seal:#B23A2E;
  --ok:#1E6B4E;
  --gold:#A87B23;
  --shadow:0 2px 0 rgba(31,42,51,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans","メイリオ",sans-serif;
  background:var(--ledger);
  color:var(--ink);
  font-size:17px;
  font-weight:500;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

/* ============ 上部：タワーの窓 ============ */
#tower{
  position:relative;
  height:34vh;
  min-height:190px;
  max-height:260px;
  overflow:hidden;
  flex:none;
  border-bottom:3px solid var(--ink);
  transition:background .8s ease;
  padding-top:env(safe-area-inset-top);
}
/* 階の目盛りが流れる層 */
#floors{
  position:absolute;
  left:0; right:0;
  top:0;
  transition:transform .45s cubic-bezier(.34,1.3,.5,1);
  will-change:transform;
}
.floorline{
  height:56px;
  border-top:2px dashed rgba(31,42,51,.28);
  position:relative;
}
.floorline span{
  position:absolute;
  left:14px; top:-13px;
  background:rgba(255,255,255,.85);
  border:2px solid rgba(31,42,51,.35);
  border-radius:6px;
  padding:1px 8px;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:.02em;
}

/* ゾーン名 */
#zoneName{
  position:absolute;
  right:12px; top:calc(10px + env(safe-area-inset-top));
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:700;
  padding:4px 12px;
  border-radius:999px;
  letter-spacing:.06em;
  z-index:5;
}

/* 現在階の大きい数字 */
#bigFloor{
  position:absolute;
  left:14px; top:calc(8px + env(safe-area-inset-top));
  z-index:5;
  line-height:1;
  color:var(--ink);
  text-shadow:0 2px 0 rgba(255,255,255,.7);
}
#bigFloor b{font-size:52px;font-weight:800;letter-spacing:-.03em;}
#bigFloor i{font-size:20px;font-style:normal;font-weight:700;margin-left:2px;}
#best{
  position:absolute;
  left:16px; top:calc(66px + env(safe-area-inset-top));
  z-index:5;
  font-size:14px;
  font-weight:700;
  color:var(--ink-soft);
}

/* ============ ねこ ============ */
#cat{
  position:absolute;
  left:50%;
  bottom:26px;
  width:96px;height:104px;
  margin-left:-48px;
  z-index:4;
}
.cat-body{
  position:absolute;
  left:14px; bottom:0;
  width:68px;height:62px;
  background:#F6EDDF;
  border:3px solid var(--ink);
  border-radius:34px 34px 26px 26px;
}
.cat-head{
  position:absolute;
  left:16px; bottom:38px;
  width:64px;height:54px;
  background:#F6EDDF;
  border:3px solid var(--ink);
  border-radius:30px 30px 26px 26px;
}
.ear{
  position:absolute;
  width:0;height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-bottom:18px solid var(--ink);
  bottom:84px;
}
.ear.l{left:20px;transform:rotate(-14deg);}
.ear.r{right:20px;transform:rotate(14deg);}
.eye{
  position:absolute;
  width:8px;height:9px;
  background:var(--ink);
  border-radius:50%;
  bottom:62px;
  transition:height .15s, border-radius .15s;
}
.eye.l{left:31px;}
.eye.r{right:31px;}
.nose{
  position:absolute;
  left:50%;margin-left:-4px;bottom:55px;
  width:8px;height:6px;
  background:#D98C86;
  border-radius:0 0 6px 6px;
}
.cheek{
  position:absolute;
  width:11px;height:7px;
  background:#F0B7AE;
  border-radius:50%;
  bottom:53px;
  opacity:.85;
}
.cheek.l{left:20px;}
.cheek.r{right:20px;}
.tail{
  position:absolute;
  right:4px;bottom:10px;
  width:26px;height:26px;
  border:3px solid var(--ink);
  border-color:var(--ink) var(--ink) transparent transparent;
  border-radius:50%;
  transform:rotate(28deg);
  transform-origin:left bottom;
  animation:tail 1.8s ease-in-out infinite;
}
@keyframes tail{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-6deg)}}

/* 賢くなる装備 */
.glasses,.tie,.hat,.pen{display:none;}
#cat.lv2 .glasses,#cat.lv3 .glasses,#cat.lv4 .glasses,#cat.lv5 .glasses{display:block;}
#cat.lv3 .tie,#cat.lv4 .tie,#cat.lv5 .tie{display:block;}
#cat.lv4 .hat,#cat.lv5 .hat{display:block;}
#cat.lv5 .pen{display:block;}
.glasses{
  position:absolute;bottom:57px;left:22px;
  width:52px;height:20px;
}
.glasses::before,.glasses::after{
  content:"";position:absolute;top:0;
  width:19px;height:19px;
  border:3px solid var(--ink);
  border-radius:50%;
  background:rgba(255,255,255,.45);
}
.glasses::before{left:0;}
.glasses::after{right:0;}
.tie{
  position:absolute;
  left:50%;margin-left:-11px;bottom:26px;
  width:22px;height:14px;
  background:var(--seal);
  border:2px solid var(--ink);
  border-radius:4px;
  clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%,28% 50%);
}
.hat{
  position:absolute;
  left:50%;margin-left:-27px;bottom:92px;
  width:54px;height:8px;
  background:var(--ink);
  border-radius:3px;
}
.hat::after{
  content:"";position:absolute;
  left:12px;bottom:6px;
  width:30px;height:16px;
  background:var(--ink);
  border-radius:4px 4px 0 0;
}
.pen{
  position:absolute;
  right:-2px;bottom:44px;
  width:8px;height:32px;
  background:var(--gold);
  border:2px solid var(--ink);
  border-radius:2px;
  transform:rotate(18deg);
}

/* ねこの動き */
#cat.hop{animation:hop .5s cubic-bezier(.3,1.5,.5,1);}
@keyframes hop{
  0%{transform:translateY(0) scaleY(1)}
  25%{transform:translateY(4px) scaleY(.86)}
  55%{transform:translateY(-26px) scaleY(1.06)}
  100%{transform:translateY(0) scaleY(1)}
}
#cat.sad{animation:sad .6s ease;}
@keyframes sad{
  0%{transform:translateY(0)}
  30%{transform:translateY(7px) rotate(-4deg)}
  70%{transform:translateY(7px) rotate(4deg)}
  100%{transform:translateY(0)}
}
#cat.sad .eye{height:3px;border-radius:2px;}

/* キラキラ */
.spark{
  position:absolute;
  width:9px;height:9px;
  background:var(--gold);
  z-index:6;
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  animation:spark .75s ease-out forwards;
  pointer-events:none;
}
@keyframes spark{
  0%{transform:translate(0,0) scale(.3);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}
}

/* ============ 下部：問題 ============ */
#panel{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#tag{
  align-self:flex-start;
  font-size:13px;
  font-weight:700;
  color:#fff;
  background:var(--ink-soft);
  padding:3px 10px;
  border-radius:4px;
  letter-spacing:.08em;
  margin-bottom:8px;
}
#q{
  font-size:19px;
  font-weight:700;
  line-height:1.55;
  color:var(--ink);
  margin:0 0 14px;
  letter-spacing:.01em;
}
#choices{display:flex;flex-direction:column;gap:9px;}
.choice{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  font-family:inherit;
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  background:#FBFCFA;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:13px 14px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .08s, background .15s;
  line-height:1.4;
}
.choice:active{transform:translateY(2px);box-shadow:none;}
.choice .no{
  flex:none;
  width:26px;height:26px;
  border-radius:50%;
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.choice.right{background:#DFF2E7;border-color:var(--ok);}
.choice.right .no{background:var(--ok);}
.choice.wrong{background:#FBE4E1;border-color:var(--seal);}
.choice.wrong .no{background:var(--seal);}
.choice:disabled{cursor:default;opacity:1;}

/* 解説 */
#exp{
  margin-top:14px;
  border:2.5px solid var(--ink);
  border-radius:12px;
  padding:13px 14px;
  background:#FFFDF5;
  display:none;
}
#exp.show{display:block;animation:pop .25s ease;}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#expHead{font-size:16px;font-weight:800;margin-bottom:6px;}
#expBody{font-size:16px;font-weight:500;line-height:1.65;color:var(--ink);}
#next{
  margin-top:12px;
  width:100%;
  font-family:inherit;
  font-size:18px;
  font-weight:800;
  color:#fff;
  background:var(--ink);
  border:none;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
  letter-spacing:.06em;
}
#next:active{transform:translateY(2px);}

/* 到達おめでとうバナー */
#banner{
  position:fixed;
  left:0;right:0;top:40%;
  z-index:20;
  text-align:center;
  pointer-events:none;
  opacity:0;
}
#banner.show{animation:banner 1.9s ease forwards;}
@keyframes banner{
  0%{opacity:0;transform:scale(.7)}
  15%{opacity:1;transform:scale(1.05)}
  75%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1)}
}
#banner div{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  font-size:22px;
  font-weight:800;
  padding:14px 26px;
  border-radius:14px;
  letter-spacing:.08em;
  box-shadow:0 8px 24px rgba(31,42,51,.3);
}

/* 保存（GitHub Pagesでは動く。動かない環境でも落ちないようにガード） */
function load(){
  try{
    const v = localStorage.getItem("bokiTowerBest");
    if(v) best = parseInt(v,10) || 1;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem("bokiTowerBest", String(best)); }catch(e){}
}

/* ================= 初期化 ================= */
const elFloors=document.getElementById("floors");
const elTower =document.getElementById("tower");
const elZone  =document.getElementById("zoneName");
const elFnum  =document.getElementById("fnum");
const elBest  =document.getElementById("best");
const elCat   =document.getElementById("cat");
const elTag   =document.getElementById("tag");
const elQ     =document.getElementById("q");
const elCh    =document.getElementById("choices");
const elExp   =document.getElementById("exp");
const elExpH  =document.getElementById("expHead");
const elExpB  =document.getElementById("expBody");
const elNext  =document.getElementById("next");
const elBanner=document.getElementById("banner");

function buildFloors(){
  let html="";
  for(let i=0;i<40;i++) html+='<div class="floorline"><span></span></div>';
  elFloors.innerHTML=html;
}
function paintFloors(){
  const lines=elFloors.children;
  // 画面の真ん中あたりが現在階になるように番号をふる
  for(let i=0;i<lines.length;i++){
    const n = floor + (20 - i);
    lines[i].firstElementChild.textContent = n>0 ? n+"F" : "";
  }
}
function zoneOf(f){ return Math.min(Math.floor((f-1)/10), ZONES.length-1); }

function render(){
  elFnum.textContent = floor;
  elBest.textContent = "さいこう記録 " + best + "階";
  const z = zoneOf(floor);
  elZone.textContent = ZONES[z].name;
  elTower.style.background = ZONES[z].bg;
  elCat.className = z>0 ? ("lv"+Math.min(z+1,5)) : "";
  paintFloors();
}

/* ================= 出題 ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function refillDeck(){ deck = shuffle(QUESTIONS.map((_,i)=>i)); }

function nextQuestion(){
  if(deck.length===0) refillDeck();
  const src = QUESTIONS[deck.pop()];
  const correctText = src.c[src.a];
  const opts = shuffle(src.c);
  cur = {t:src.t, q:src.q, e:src.e, opts:opts, correct:correctText};
  answered=false;

  elTag.textContent = cur.t;
  elQ.textContent   = cur.q;
  elExp.className   = "";
  elNext.style.display="none";
  elCh.innerHTML="";
  const marks=["1","2","3","4"];
  cur.opts.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML='<span class="no">'+marks[i]+'</span><span>'+text+'</span>';
    b.addEventListener("click",()=>pick(b,text));
    elCh.appendChild(b);
  });
  document.getElementById("panel").scrollTop=0;
}

function pick(btn,text){
  if(answered) return;
  answered=true;
  const buttons=[...elCh.querySelectorAll(".choice")];
  buttons.forEach(b=>b.disabled=true);

  const ok = (text===cur.correct);
  if(ok){
    btn.classList.add("right");
    elExpH.textContent="せいかい！ 1階のぼったよ";
    climb(1);
    sparkle();
    hop();
  }else{
    btn.classList.add("wrong");
    buttons.forEach(b=>{
      if(b.textContent.includes(cur.correct) && b.querySelector("span:last-child").textContent===cur.correct){
        b.classList.add("right");
      }
    });
    elExpH.textContent="こたえは「"+cur.correct+"」";
    climb(-1);
    droop();
  }
  elExpB.textContent=cur.e;
  elExp.className="show";
  elNext.style.display="block";
}

function climb(n){
  const before=floor;
  floor = Math.max(1, floor + n);
  if(floor>best){ best=floor; save(); }
  // 目盛りを1階分ずらしてから戻す（のぼった感じ）
  elFloors.style.transition="none";
  elFloors.style.transform="translateY("+(n>0? -FLOOR_H : FLOOR_H)+"px)";
  requestAnimationFrame(()=>{
    elFloors.style.transition="";
    elFloors.style.transform="translateY(0)";
  });
  render();
  if(n>0 && Math.floor((floor-1)/10) > Math.floor((before-1)/10)){
    const z=zoneOf(floor);
    showBanner(floor+"階とうたつ！", ZONE_MSG[Math.min(z,5)] + "　" + ZONES[z].name + "へ");
  }
}

function hop(){ elCat.classList.remove("hop"); void elCat.offsetWidth; elCat.classList.add("hop"); }
function droop(){ elCat.classList.remove("sad"); void elCat.offsetWidth; elCat.classList.add("sad"); }

function sparkle(){
  const r=elCat.getBoundingClientRect();
  const t=elTower.getBoundingClientRect();
  for(let i=0;i<7;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.left=(r.left-t.left+40+(Math.random()*30-15))+"px";
    s.style.top =(r.top-t.top+18+(Math.random()*30-15))+"px";
    s.style.setProperty("--dx",(Math.random()*90-45)+"px");
    s.style.setProperty("--dy",(-30-Math.random()*45)+"px");
    elTower.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
}

function showBanner(main,sub){
  document.getElementById("bannerText").textContent=main;
  document.getElementById("bannerSub").textContent=sub;
  elBanner.className="";
  void elBanner.offsetWidth;
  elBanner.className="show";
}

elNext.addEventListener("click",nextQuestion);

/* start */
load();
buildFloors();
render();
refillDeck();
nextQuestion();
</script>
</body>
</html>
