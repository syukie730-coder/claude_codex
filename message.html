<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Maru Gothic",sans-serif;color:#5A452F;overflow-x:hidden;-webkit-text-size-adjust:100%;background:linear-gradient(180deg,#A8E4F7 0%,#DFF3FB 42%,#FFF6DC 78%,#FFEFC0 100%);background-attachment:fixed;min-height:100%}
.glow{position:fixed;top:-160px;left:50%;transform:translateX(-50%);width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(255,244,190,.9) 0%,rgba(255,244,190,.45) 35%,rgba(255,244,190,0) 70%);animation:br 7s ease-in-out infinite}
@keyframes br{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(1.12);opacity:1}}
#sp{position:fixed;inset:0;z-index:1;pointer-events:none}
.fly{position:fixed;z-index:2;pointer-events:none;will-change:transform;top:110vh}
.wrap{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:46px 22px 210px}
.eyebrow{font-family:"Yomogi",cursive;text-align:center;letter-spacing:.3em;font-size:13px;color:#F2960C;text-shadow:0 1px 0 #fff}
h1{font-family:"Yomogi",cursive;text-align:center;font-size:clamp(27px,8.2vw,38px);line-height:1.5;margin:10px 0 4px;font-weight:500;color:#3F6E8C;text-shadow:0 2px 0 #fff,0 6px 16px rgba(120,120,120,.18)}
h1 .to{display:block;font-size:.62em;color:#F2960C;margin-bottom:4px}
.date{font-family:"Yomogi",cursive;text-align:center;font-size:13px;color:#8A745A;letter-spacing:.14em;margin-top:10px}
.pola{margin:32px auto 8px;width:min(100%,340px);background:#fff;padding:14px 14px 56px;border-radius:6px;position:relative;box-shadow:0 18px 38px rgba(60,60,60,.3);transform:rotate(-2.2deg);animation:sw 9s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(1.4deg)}}
.stack{position:relative;line-height:0}
.stack img{width:100%;display:block;border-radius:2px;background:#eee;transition:opacity 1.6s ease}
.stack .pn{position:absolute;inset:0;height:100%;object-fit:cover}
.pola figcaption{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:"Yomogi",cursive;font-size:14.5px;color:#8A7A6A;line-height:1.4;padding:0 10px}
.tape{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-3deg);width:110px;height:30px;border-radius:2px;background:linear-gradient(180deg,rgba(255,214,79,.85),rgba(255,214,79,.65));box-shadow:0 2px 6px rgba(0,0,0,.1)}
.letter{margin:34px auto 0;width:min(100%,420px);background:rgba(255,255,255,.74);backdrop-filter:blur(4px);border:1.5px dashed rgba(0,0,0,.12);border-radius:22px;padding:30px 24px 26px;box-shadow:0 14px 34px rgba(80,80,80,.16)}
.letter p{font-size:16.5px;line-height:2.05;margin-bottom:20px}
.letter p:last-child{margin-bottom:0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.3,1)}
.rv.on{opacity:1;transform:none}
.sign{font-family:"Yomogi",cursive;text-align:right;font-size:16px;color:#F2960C;margin-top:26px}
.field{position:fixed;left:0;right:0;bottom:0;height:170px;z-index:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.field .st{transform-origin:bottom center;text-align:center}
.field .st:nth-child(odd){animation:wd 4.6s ease-in-out infinite}
.field .st:nth-child(even){animation:wd 5.9s ease-in-out infinite reverse}
@keyframes wd{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
.field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,rgba(255,255,255,0),#FFEFC0)}
.ab{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:20;width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:#F2960C;font-size:21px;cursor:pointer;box-shadow:0 6px 16px rgba(60,60,60,.28)}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#A8E4F7,#FFF6DC);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px;transition:opacity .9s ease}
#gate.hide{opacity:0;pointer-events:none}
#gate .gi{width:110px;height:110px;animation:sp 22s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#gate h2{font-family:"Yomogi",cursive;font-size:22px;color:#3F6E8C;font-weight:500;line-height:1.75}
#gate button{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:.06em;border:none;border-radius:999px;padding:16px 34px;cursor:pointer;background:#F2960C;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#gate small{color:#8A745A;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

var MU=(function(){var ax=null,ms=null,tm=null,nt=0,on=false,SPB=60/C.bpm;

function tone(f,t,du,g,ty){var o=ax.createOscillator(),o2=ax.createOscillator(),gn=ax.createGain(),g2=ax.createGain();
o.type=ty;o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2.005;g2.gain.value=.26;
o.connect(gn);o2.connect(g2);g2.connect(gn);gn.connect(ms);
gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.014);
gn.gain.exponentialRampToValueAtTime(.0001,t+du);o.start(t);o2.start(t);o.stop(t+du+.05);o2.stop(t+du+.05);}
function bs(f,t,du,g){var o=ax.createOscillator(),gn=ax.createGain();o.type="sine";o.frequency.value=f;
o.connect(gn);gn.connect(ms);gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.02);
gn.gain.exponentialRampToValueAtTime(.0001,t+du);o.start(t);o.stop(t+du+.05);}
function sh(t,g){var ln=Math.floor(ax.sampleRate*.06),b=ax.createBuffer(1,ln,ax.sampleRate),d=b.getChannelData(0),i;
for(i=0;i<ln;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/ln,3);
var s=ax.createBufferSource();s.buffer=b;var hp=ax.createBiquadFilter();hp.type="highpass";hp.frequency.value=5200;
var gn=ax.createGain();gn.gain.value=g;s.connect(hp);hp.connect(gn);gn.connect(ms);s.start(t);}
function loop(t0){var i,m,b;for(i=0;i<C.mel.length;i++){m=C.mel[i];
tone(F[m[1]],t0+m[0]*SPB,m[2]*SPB*.95,C.gain,C.wave);tone(F[m[1]]*2,t0+m[0]*SPB,m[2]*SPB*.5,C.gain*.28,"sine");}
for(i=0;i<C.bass.length;i++){b=C.bass[i];
if(typeof b==="string"){bs(F[b],t0+i*2*SPB,SPB*1.4,.15);}else{bs(F[b[1]],t0+b[0]*SPB,SPB*(b[2]||1.4),.15);}}

function tick(){var ah=ax.currentTime+.7;while(nt<ah){loop(nt);nt+=C.loop*SPB;}}
return{start:function(){if(!ax){ax=new (window.AudioContext||window.webkitAudioContext)();ms=ax.createGain();ms.gain.value=.0001;
var cp=ax.createDynamicsCompressor();ms.connect(cp);cp.connect(ax.destination);}
ax.resume();if(!on){on=true;nt=ax.currentTime+.15;tick();tm=setInterval(tick,400);}
ms.gain.cancelScheduledValues(ax.currentTime);ms.gain.setValueAtTime(Math.max(ms.gain.value,.0001),ax.currentTime);
ms.gain.exponentialRampToValueAtTime(.5,ax.currentTime+1.2);},
mute:function(){if(!ax)return;ms.gain.cancelScheduledValues(ax.currentTime);ms.gain.setValueAtTime(ms.gain.value,ax.currentTime);
