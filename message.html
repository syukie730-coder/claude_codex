<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Maru Gothic",sans-serif;color:#4F5A46;overflow-x:hidden;-webkit-text-size-adjust:100%;background:linear-gradient(180deg,#D5EFD9 0%,#EBF7E6 42%,#FFFAE9 78%,#FFF3D8 100%);background-attachment:fixed;min-height:100%}
.glow{position:fixed;top:-160px;left:50%;transform:translateX(-50%);width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(238,255,215,.9) 0%,rgba(238,255,215,.45) 35%,rgba(238,255,215,0) 70%);animation:br 7s ease-in-out infinite}
@keyframes br{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(1.12);opacity:1}}
#sp{position:fixed;inset:0;z-index:1;pointer-events:none}
.fly{position:fixed;z-index:2;pointer-events:none;will-change:transform;top:110vh}
.wrap{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:46px 22px 210px}
.eyebrow{font-family:"Yomogi",cursive;text-align:center;letter-spacing:.3em;font-size:13px;color:#4E9A6B;text-shadow:0 1px 0 #fff}
h1{font-family:"Yomogi",cursive;text-align:center;font-size:clamp(27px,8.2vw,38px);line-height:1.5;margin:10px 0 4px;font-weight:500;color:#3E7D5A;text-shadow:0 2px 0 #fff,0 6px 16px rgba(120,120,120,.18)}
h1 .to{display:block;font-size:.62em;color:#4E9A6B;margin-bottom:4px}
.date{font-family:"Yomogi",cursive;text-align:center;font-size:13px;color:#7C8A72;letter-spacing:.14em;margin-top:10px}
.pola{margin:32px auto 8px;width:min(100%,340px);background:#fff;padding:14px 14px 56px;border-radius:6px;position:relative;box-shadow:0 18px 38px rgba(60,60,60,.3);transform:rotate(-2.2deg);animation:sw 9s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(1.4deg)}}
.stack{position:relative;line-height:0}
.stack img{width:100%;display:block;border-radius:2px;background:#eee;transition:opacity 1.6s ease}
.stack .pn{position:absolute;inset:0;height:100%;object-fit:cover}
.pola figcaption{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:"Yomogi",cursive;font-size:14.5px;color:#8A7A6A;line-height:1.4;padding:0 10px}
.tape{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-3deg);width:110px;height:30px;border-radius:2px;background:linear-gradient(180deg,rgba(200,230,170,.85),rgba(200,230,170,.65));box-shadow:0 2px 6px rgba(0,0,0,.1)}
.letter{margin:34px auto 0;width:min(100%,420px);background:rgba(255,255,255,.74);backdrop-filter:blur(4px);border:1.5px dashed rgba(0,0,0,.12);border-radius:22px;padding:30px 24px 26px;box-shadow:0 14px 34px rgba(80,80,80,.16)}
.letter p{font-size:16.5px;line-height:2.05;margin-bottom:20px}
.letter p:last-child{margin-bottom:0}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.3,1)}
.rv.on{opacity:1;transform:none}
.sign{font-family:"Yomogi",cursive;text-align:right;font-size:16px;color:#4E9A6B;margin-top:26px}
.field{position:fixed;left:0;right:0;bottom:0;height:170px;z-index:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.field .st{transform-origin:bottom center;text-align:center}
.field .st:nth-child(odd){animation:wd 4.6s ease-in-out infinite}
.field .st:nth-child(even){animation:wd 5.9s ease-in-out infinite reverse}
@keyframes wd{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
.field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,rgba(255,255,255,0),#FFF3D8)}
.ab{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:20;width:50px;height:50px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:#4E9A6B;font-size:21px;cursor:pointer;box-shadow:0 6px 16px rgba(60,60,60,.28)}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#D5EFD9,#FFFAE9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px;transition:opacity .9s ease}
#gate.hide{opacity:0;pointer-events:none}
#gate .gi{width:110px;height:110px;animation:sp 22s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#gate h2{font-family:"Yomogi",cursive;font-size:22px;color:#3E7D5A;font-weight:500;line-height:1.75}
#gate button{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:.06em;border:none;border-radius:999px;padding:16px 34px;cursor:pointer;background:#4E9A6B;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#gate small{color:#7C8A72;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
