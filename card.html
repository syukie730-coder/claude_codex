<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メッセージカード工房</title>
<link rel="apple-touch-icon" href="card-icon.png">
<link rel="icon" href="card-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF6CD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pale:#FFF9E3;
  --pale2:#FFF3C9;
  --line:#F0DFA6;
  --accent:#E8A33D;
  --accent-deep:#C97F1C;
  --ink:#5C4B2E;
  --ink-soft:#948063;
  --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:"Zen Maru Gothic",-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#FFF9E3 0%,#FFF3C9 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:120px;
  -webkit-text-size-adjust:100%;
}
.head{
  text-align:center; padding:calc(26px + env(safe-area-inset-top)) 20px 18px;
}
.head h1{
  font-family:"Yomogi",cursive; font-size:26px; font-weight:400; color:var(--accent-deep);
  letter-spacing:.04em;
}
.head p{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.7;}

.wrap{max-width:560px; margin:0 auto; padding:0 16px;}

.card{
  background:var(--card); border:1.5px solid var(--line); border-radius:20px;
  padding:20px 18px; margin-bottom:16px;
  box-shadow:0 6px 18px rgba(200,170,90,.13);
}
.card h2{
  font-size:15.5px; font-weight:700; color:var(--accent-deep);
  display:flex; align-items:center; gap:8px; margin-bottom:14px;
}
.card h2 .n{
  background:var(--pale2); color:var(--accent-deep); font-size:12.5px;
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex:none;
}
label.f{display:block; font-size:12.5px; color:var(--ink-soft); margin:14px 0 5px;}
label.f:first-of-type{margin-top:0;}
input[type=text],textarea,select{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink);
  background:#FFFDF6; border:1.5px solid var(--line); border-radius:12px;
  padding:11px 13px; outline:none;
}
input[type=text]:focus,textarea:focus{border-color:var(--accent);}
textarea{line-height:1.85; resize:vertical;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.6;}

/* テーマ選択 */
.themes{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:9px;}
.th{
  border:2px solid var(--line); border-radius:15px; background:#FFFDF6;
  padding:12px 6px 10px; text-align:center; cursor:pointer; transition:.18s;
}
.th .e{font-size:26px; display:block; line-height:1.2;}
.th .t{font-size:12px; margin-top:5px; color:var(--ink);}
.th.on{border-color:var(--accent); background:var(--pale2); transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(232,163,61,.25);}

/* 写真 */
.photos{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:4px;}
.ph{
  position:relative; aspect-ratio:1/1; border-radius:12px; overflow:hidden;
  background:#FFFDF6; border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center;
}
.ph img{width:100%;height:100%;object-fit:cover;}
.ph .del{
  position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; border:none; font-size:13px; line-height:1; cursor:pointer;
}
.addph{
  font-size:26px; color:var(--line); background:none; border:none; width:100%; height:100%;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* ボタン */
.btns{max-width:560px; margin:0 auto; padding:4px 16px 30px;}
button.big{
  width:100%; font-family:inherit; font-weight:700; font-size:16px;
  border:none; border-radius:999px; padding:16px; cursor:pointer; margin-bottom:11px;
  letter-spacing:.03em;
}
.primary{background:linear-gradient(180deg,#FFD265,#E8A33D); color:#fff;
  box-shadow:0 8px 20px rgba(232,163,61,.38);}
.second{background:#fff; color:var(--accent-deep); border:1.5px solid var(--line)!important;}
button.big:active{transform:scale(.98);}

/* プレビュー */
#pv{position:fixed; inset:0; z-index:100; background:#000; display:none;}
#pv.on{display:block;}
#pv iframe{width:100%; height:100%; border:none; display:block;}
#pvClose{
  position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; z-index:101;
  background:rgba(255,255,255,.92); border:none; border-radius:999px;
  padding:10px 18px; font-family:inherit; font-size:14px; font-weight:700; color:var(--accent-deep);
  box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer;
}
/* 手順モーダル */
#steps{
  position:fixed; inset:0; z-index:110; background:rgba(70,55,30,.55);
  display:none; align-items:flex-end;
}
#steps.on{display:flex;}
#steps .inner{
  background:var(--pale); width:100%; max-height:86vh; overflow:auto;
  border-radius:22px 22px 0 0; padding:22px 18px calc(30px + env(safe-area-inset-bottom));
}
#steps h3{font-family:"Yomogi",cursive; font-size:19px; color:var(--accent-deep); margin-bottom:6px;}
#steps p{font-size:13px; color:var(--ink-soft); line-height:1.8; margin-bottom:12px;}
#steps .cmd{
  background:#463A22; color:#FFF3C9; font-family:ui-monospace,Menlo,monospace;
  font-size:13px; padding:12px 14px; border-radius:11px; margin:6px 0 12px;
  word-break:break-all; line-height:1.6;
}
#steps .st{font-size:13.5px; font-weight:700; margin-top:14px;}
.toast{
  position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
  background:rgba(70,55,30,.92); color:#fff; font-size:13.5px;
  padding:12px 22px; border-radius:999px; opacity:0; transition:.3s; z-index:200; pointer-events:none;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="head">
  <h1>💌 メッセージカード工房</h1>
  <p>写真とメッセージを入れるだけで、<br>音楽つきの動くカードができるよ🌻</p>
</div>

<div class="wrap">

  <section class="card">
    <h2><span class="n">1</span>どんなカードにする？</h2>
    <div class="themes" id="themes"></div>
  </section>

  <section class="card">
    <h2><span class="n">2</span>だれに、なんて伝える？</h2>
    <label class="f">相手の名前（宛名）</label>
    <input type="text" id="to" placeholder="ボンナンちゃんへ">
    <label class="f">大きな見出し</label>
    <input type="text" id="title" placeholder="暑中お見舞い申し上げます🌻">
    <label class="f">小さな一言（見出しの下）</label>
    <input type="text" id="sub" placeholder="まだまだ暑い日が続きますね">
  </section>

  <section class="card">
    <h2><span class="n">3</span>写真を入れる</h2>
    <div class="photos" id="photos"></div>
    <p class="hint">4枚まで入るよ📸 2枚以上入れると、ゆっくり切り替わって表示されます</p>
    <label class="f">写真の下に入れる一言</label>
    <input type="text" id="cap" placeholder="私たちの楽しい時間、これからもよろしくね！">
  </section>

  <section class="card">
    <h2><span class="n">4</span>メッセージ本文</h2>
    <textarea id="body" rows="10" placeholder="ボンナンちゃん😊✨&#10;暑中お見舞いありがとう〜🌻💕&#10;&#10;（1行あけると、次のかたまりになるよ）"></textarea>
    <p class="hint">1行あける（空の行を入れる）と、そこで区切られて、スクロールに合わせてふわっと出てくるよ✨</p>
    <label class="f">差出人・結びの言葉</label>
    <input type="text" id="sign" placeholder="またね！ 🌻">
  </section>

  <section class="card">
    <h2><span class="n">5</span>ファイルの名前</h2>
    <input type="text" id="fname" placeholder="natsu2026">
    <p class="hint">英語の小文字と数字で付けてね（例：natsu2026）。<br>自動で「.html」が付きます😊</p>
  </section>

</div>

<div class="btns">
  <button class="big primary" id="btnPreview">👀 できあがりを見てみる</button>
  <button class="big second" id="btnSave">💾 ファイルに保存する</button>
  <button class="big second" id="btnSteps">📖 送るまでの手順を見る</button>
</div>

<div id="pv"><button id="pvClose">✕ 閉じる</button><iframe id="pvFrame"></iframe></div>

<div id="steps"><div class="inner" id="stepsInner"></div></div>
<div class="toast" id="toast"></div>

<input type="file" id="file" accept="image/*" multiple style="display:none">

<script>
/* ================= テーマ設定 ================= */
const THEMES = {

         [28,'D5',.5],[28.5,'C5',.5],[29,'B4',.5],[29.5,'A4',.5],[30,'G4',1.75]],
    bass:['C3','C3','A3','A3','F3','F3','G3','G3','C3','C3','A3','A3','F3','F3','G3','G3']
  },
  celebrate:{
    name:"お祝い・誕生日", emoji:"🎉",
    bg:["#FFE3EF","#FFF0F5","#FFF7E8","#FFEDD6"],
    accent:"#E4568A", head:"#C2417A", ink:"#6B4657", soft:"#A2798A",
    glow:"255,220,240", tape:"255,190,215",
    item:"petal", field:"flower", font:"fun",
    bpm:126, wave:"triangle", shaker:true, gain:.15,
    mel:[[0,'C5',.5],[.5,'D5',.5],[1,'E5',1],[2,'G5',1],[3,'E5',1],
         [4,'D5',.5],[4.5,'E5',.5],[5,'D5',1],[6,'B4',2],
         [8,'C5',.5],[8.5,'E5',.5],[9,'A5',1],[10,'G5',.5],[10.5,'E5',.5],[11,'C5',1],
         [12,'F5',.5],[12.5,'E5',.5],[13,'D5',1],[14,'C5',1.75],
         [16,'E5',.5],[16.5,'G5',.5],[17,'C6',1],[18,'B5',.5],[18.5,'A5',.5],[19,'G5',1],
         [20,'A5',1],[21,'G5',.5],[21.5,'F5',.5],[22,'D5',1.75],
         [24,'A4',.5],[24.5,'C5',.5],[25,'E5',1],[26,'F5',.5],[26.5,'A5',.5],[27,'G5',1],
         [28,'D5',.5],[28.5,'E5',.5],[29,'F5',.5],[29.5,'G5',.5],[30,'C5',1.75]],
    bass:['C3','C3','G3','G3','A3','A3','F3','F3','C3','C3','G3','G3','A3','A3','G3','G3']
  },
  thanks:{
    name:"ありがとう", emoji:"💐",
    bg:["#DFF3E4","#F1F9EC","#FFFAE9","#FFF3D8"],
    accent:"#4E9A6B", head:"#3E7D5A", ink:"#4F5A46", soft:"#7C8A72",
    glow:"238,255,215", tape:"200,230,170",
    item:"flower", field:"flower", font:"fun",
    bpm:84, wave:"sine", shaker:false, gain:.19,
    mel:[[0,'F4',1],[1,'A4',1],[2,'C5',2],
         [4,'D5',1],[5,'C5',1],[6,'A4',2],
         [8,'Bb4',1],[9,'D5',1],[10,'C5',1],[11,'A4',1],
         [12,'G4',1],[13,'A4',1],[14,'G4',2],
         [16,'C5',1],[17,'F5',1],[18,'E5',1],[19,'C5',1],
         [20,'D5',1.5],[21.5,'C5',.5],[22,'A4',2],
         [24,'Bb4',1],[25,'A4',1],[26,'G4',2],
         [28,'A4',1],[29,'G4',1],[30,'F4',2]],
    bass:['F3','F3','D3','D3','Bb3','Bb3','C3','C3','F3','F3','D3','D3','Bb3','Bb3','C3','C3']
  },
  winter:{
    name:"冬・お正月", emoji:"❄️",
    bg:["#CBE4F6","#EAF4FC","#FBFDFF","#F2F8FF"],
    accent:"#5C86B8", head:"#3A5F8A", ink:"#4A5566", soft:"#7C8A9C",
    glow:"255,255,255", tape:"200,225,245",
    item:"snow", field:"snow", font:"fun",
    bpm:92, wave:"sine", shaker:false, gain:.18,
    mel:[[0,'G4',1],[1,'C5',1],[2,'E5',1.5],[3.5,'D5',.5],
         [4,'C5',1],[5,'D5',1],[6,'E5',2],
         [8,'F5',1],[9,'E5',1],[10,'D5',1],[11,'C5',1],
         [12,'D5',1],[13,'B4',1],[14,'G4',2],
         [16,'C5',1],[17,'E5',1],[18,'G5',2],
         [20,'A5',1],[21,'G5',1],[22,'E5',2],
         [24,'F5',1],[25,'A5',1],[26,'G5',1],[27,'E5',1],
         [28,'D5',1],[29,'B4',1],[30,'C5',2]],
    bass:['C3','C3','A3','A3','F3','F3','G3','G3','C3','C3','A3','A3','F3','F3','G3','G3']
  },
  memory:{
    name:"しのぶ・追悼", emoji:"🕊️",
    bg:["#F6EDE2","#FBF5EC","#FFF8F2","#F7EDE6"],
    accent:"#C08A9B", head:"#8A6B76", ink:"#5C4B44", soft:"#8E7A70",
    glow:"255,235,215", tape:"235,215,225",
    item:"petalw", field:"light", font:"calm",
    bpm:66, wave:"sine", shaker:false, gain:.2,
    mel:[[0,'A4',2],[2,'C5',1],[3,'B4',1],
         [4,'A4',2],[6,'G4',2],
         [8,'E4',1],[9,'G4',1],[10,'C5',2],
         [12,'B4',1],[13,'A4',1],[14,'G4',2],
         [16,'A4',1],[17,'C5',1],[18,'E5',2],
         [20,'D5',1],[21,'C5',1],[22,'A4',2],
         [24,'F4',1],[25,'A4',1],[26,'G4',2],
         [28,'E4',1],[29,'G4',1],[30,'A4',2]],
    bass:['A3','A3','F3','F3','C3','C3','G3','G3','A3','A3','F3','F3','D3','D3','G3','G3']
  }
};

const PLACE = {
  summer:{to:"○○ちゃんへ",title:"暑中お見舞い申し上げます🌻",sub:"まだまだ暑い日が続きますね",cap:"楽しい時間をありがとう！",sign:"またね！ 🌻",fname:"natsu"},
  celebrate:{to:"○○ちゃんへ",title:"お誕生日おめでとう🎉",sub:"すてきな一年になりますように",cap:"いつもありがとう！",sign:"またお祝いしようね🎂",fname:"omedetou"},
  thanks:{to:"○○さんへ",title:"ありがとう💐",sub:"感謝の気持ちをこめて",cap:"また会える日を楽しみに",sign:"心をこめて",fname:"arigatou"},
  winter:{to:"○○ちゃんへ",title:"あけましておめでとう❄️",sub:"今年もよろしくお願いします",cap:"今年も笑顔いっぱいの一年に",sign:"またね😊",fname:"newyear"},
  memory:{to:"○○さんへ",title:"あなたを想う日に",sub:"やさしい時間を、もう一度",cap:"ずっと忘れないよ",sign:"心をこめて",fname:"omoide"}
};

/* ================= 状態 ================= */
let S = {theme:"summer", photos:[]};
const $ = id => document.getElementById(id);

/* テーマのボタンを並べる */
(function(){
  let h = "";
  for(const k in THEMES){
    h += '<div class="th" data-k="'+k+'"><span class="e">'+THEMES[k].emoji+'</span><span class="t">'+THEMES[k].name+'</span></div>';
  }
  $("themes").innerHTML = h;
  $("themes").addEventListener("click", e=>{
    const el = e.target.closest(".th"); if(!el) return;
    S.theme = el.dataset.k; paintThemes(); applyPlaceholders(); save();
  });
})();
function paintThemes(){
  document.querySelectorAll(".th").forEach(el=>el.classList.toggle("on", el.dataset.k===S.theme));
}
function applyPlaceholders(){
  const p = PLACE[S.theme];
  $("to").placeholder=p.to; $("title").placeholder=p.title; $("sub").placeholder=p.sub;
  $("cap").placeholder=p.cap; $("sign").placeholder=p.sign; $("fname").placeholder=p.fname;
}

/* ================= 写真 ================= */
function paintPhotos(){
  let h="";
  S.photos.forEach((p,i)=>{
    h += '<div class="ph"><img src="'+p+'"><button class="del" data-i="'+i+'">✕</button></div>';
  });
  if(S.photos.length<4) h += '<div class="ph"><button class="addph" id="addph">＋</button></div>';
  $("photos").innerHTML = h;
  if($("addph")) $("addph").onclick = ()=> $("file").click();
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{
    S.photos.splice(+b.dataset.i,1); paintPhotos(); save();
  });
}
$("file").addEventListener("change", async e=>{
  const files = [...e.target.files].slice(0, 4-S.photos.length);
  for(const f of files){
    try{ S.photos.push(await shrink(f)); }catch(err){ toast("写真をうまく読めなかったみたい💦"); }
  }
  paintPhotos(); save(); e.target.value="";
});
function shrink(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max = 900;
        let w=img.width, h=img.height;
        if(w>h && w>max){ h=h*max/w; w=max; } else if(h>=w && h>max){ w=w*max/h; h=max; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg", .82));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ================= 下書きの保存 ================= */
const KEYS = ["to","title","sub","cap","body","sign","fname"];
function save(){
  const d = {theme:S.theme, photos:S.photos};
  KEYS.forEach(k=> d[k] = $(k).value);
  try{ localStorage.setItem("cardStudio", JSON.stringify(d)); }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem("cardStudio")||"null");
    if(!d) return;
    S.theme = d.theme || "summer";
    S.photos = d.photos || [];
    KEYS.forEach(k=>{ if(d[k]!=null) $(k).value = d[k]; });
  }catch(e){}
}
KEYS.forEach(k=> $(k).addEventListener("input", save));

/* ================= 生成 ================= */
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function val(id){ return ($(id).value.trim()) || $(id).placeholder; }

function build(){
  const T = THEMES[S.theme];
  const to = esc(val("to")), title = esc(val("title")), sub = esc(val("sub"));
  const cap = esc(val("cap")), sign = esc(val("sign"));
  const raw = $("body").value.trim() || "ここにメッセージが入ります😊";
  const paras = raw.split(/\n\s*\n/).map(p=>'<p class="rv">'+esc(p).replace(/\n/g,"<br>")+'</p>').join("");

  const photos = S.photos.length ? S.photos : [];
  let photoHTML = "";
  if(photos.length){
    let imgs = photos.map((p,i)=> i===0
      ? '<img class="p0" src="'+p+'" alt="">'
      : '<img class="pn" src="'+p+'" alt="" style="opacity:0">').join("");
    photoHTML = '<figure class="pola"><span class="tape"></span><div class="stack">'+imgs+'</div>'
      + (cap? '<figcaption>'+cap+'</figcaption>' : '') + '</figure>';
  }

  const fontLink = T.font==="calm"

/* ================= ボタンの動き ================= */
function fname(){
  let f = ($("fname").value.trim() || $("fname").placeholder);
  f = f.replace(/[^a-zA-Z0-9_-]/g,"").toLowerCase() || "message";
  return f + ".html";
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2600);
}

$("btnPreview").onclick = ()=>{
  $("pvFrame").srcdoc = build();
  $("pv").classList.add("on");
};
$("pvClose").onclick = ()=>{ $("pv").classList.remove("on"); $("pvFrame").srcdoc=""; };

$("btnSave").onclick = ()=>{
  const html = build();
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname();
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(fname()+" を保存したよ💾");
};

  + '<button class="big second" style="margin-top:6px" onclick="document.getElementById(\'steps\').classList.remove(\'on\')">閉じる</button>';
  $("steps").classList.add("on");
};
$("steps").addEventListener("click", e=>{ if(e.target.id==="steps") $("steps").classList.remove("on"); });
